/* ---------- photos and video on posts ----------
   The full file goes into IndexedDB (localStorage would blow its quota on
   one photo). A small poster image is kept on the post itself so the feed
   renders instantly and still shows something if the file is ever missing. */
const MAX_IMG=10*1024*1024, MAX_VID=60*1024*1024;

function shrinkImage(file,maxSide,quality){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error("read"));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("decode"));
      img.onload=()=>{
        const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        c.toBlob(b=>b?res({blob:b,w,h,url:c.toDataURL("image/jpeg",0.5)}):rej(new Error("encode")),
                 "image/jpeg",quality||0.82);
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

/* grab a frame so a video has something to show before you tap it */
function videoPoster(file){
  return new Promise(res=>{
    let url=null;
    try{url=URL.createObjectURL(file)}catch(e){return res(null)}
    const v=document.createElement("video");
    v.muted=true;v.playsInline=true;v.preload="metadata";
    const done=out=>{try{URL.revokeObjectURL(url)}catch(e){} res(out)};
    const bail=()=>done(null);
    v.onerror=bail;
    setTimeout(bail,6000);
    v.onloadeddata=()=>{
      try{
        const scale=Math.min(1,640/Math.max(v.videoWidth||640,v.videoHeight||360));
        const c=document.createElement("canvas");
        c.width=Math.round((v.videoWidth||640)*scale);c.height=Math.round((v.videoHeight||360)*scale);
        c.getContext("2d").drawImage(v,0,0,c.width,c.height);
        done({url:c.toDataURL("image/jpeg",0.5),dur:v.duration||0,w:c.width,h:c.height});
      }catch(e){bail()}
    };
    v.onloadedmetadata=()=>{try{v.currentTime=Math.min(0.5,(v.duration||1)/3)}catch(e){}};
    v.src=url;
  });
}

async function attachFile(file){
  if(!file)return null;
  const isVid=/^video\//.test(file.type), isImg=/^image\//.test(file.type);
  if(!isVid&&!isImg){toast("That file isn't a photo or a video");return null}
  if(isImg&&file.size>MAX_IMG){toast("That photo is over 10 MB — try a smaller one");return null}
  if(isVid&&file.size>MAX_VID){toast("That video is over 60 MB — trim it first");return null}
  const id="pm"+Date.now()+Math.floor(Math.random()*999);
  try{
    if(isImg){
      const out=await shrinkImage(file,1440,0.82);
      await clipPut(id,out.blob);
      return {id,kind:"photo",poster:out.url,w:out.w,h:out.h,size:out.blob.size};
    }
    const pos=await videoPoster(file);
    await clipPut(id,file);
    return {id,kind:"video",poster:pos?pos.url:null,dur:pos?pos.dur:0,
            w:pos?pos.w:640,h:pos?pos.h:360,size:file.size};
  }catch(e){toast("Couldn't read that file");return null}
}

function mediaBlock(m){
  if(!m)return "";
  const ratio=(m.w&&m.h)?(m.w/m.h):1.5;
  const pad=Math.min(125,Math.max(56,100/ratio));
  /* m.url means the file is on the server, so it is the same picture on
     every device. m.poster is the local copy the demo makes on this phone. */
  const src=m.poster||(m.kind!=="video"?m.url:null)||null;
  return `<div class="pmedia" data-media="${esc(m.id)}" style="padding-bottom:${pad.toFixed(1)}%">
    ${src?`<img src="${esc(src)}" alt="${m.kind==="video"?"Video":"Photo"} attached to this post" loading="lazy">`
             :`<div class="noposter">${art(hash(m.id),"",{k:"pm"})}</div>`}
    ${m.kind==="video"?`<span class="vplay"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></span>
      <span class="vlen">${m.dur?mmss(m.dur):"Video"}</span>`:""}</div>`;
}

async function openMediaViewer(mediaId,post){

  /* A post from the server carries its own URL and opens anywhere. Only the
     signed-out demo keeps media on the phone it was added from. */

    stage.innerHTML=`<div class="empty"><h3>This file isn't on this device</h3>
      <p style="font-size:13.5px">In the signed-out demo, photos and videos stay on the phone they were added from. Posted for real, they follow you everywhere.</p></div>`;

    : `<img src="${esc(url)}" alt="" style="width:100%;border-radius:14px;display:block">`;

/* ---------- safety: report and block ---------- */
const REPORT_REASONS=[
 ["harassment","Harassment or abuse","Unwanted sexual messages, slurs, threats, or repeated contact after being asked to stop."],
 ["fake","Fake or impersonation","Not who they say they are, or using someone else's music or photos."],
 ["spam","Spam or selling","Pitching services, promotions, or sending the same message to everyone."],
 ["minor","They may be under 18","Jammy is 18+. We check these first."],
 ["other","Something else","Tell us what happened."]
];
function isBlocked(id){return (S.blocks||[]).some(b=>b.id===id)}
/* Blocking has to be real. A block that only exists on this phone leaves
   the other person able to find you, message you and see your posts from
   theirs — which is the opposite of what the button promises, and the first
   thing an app reviewer tries. The screen updates immediately because
   waiting on the network while someone is trying to get away from another
   person is the wrong trade; if the server refuses, it is put back and
   said plainly. */
async function blockUser(id,reason,note){
  if(isBlocked(id))return true;
  const before={blocks:(S.blocks||[]).slice(),connections:S.connections.slice(),
                thread:S.threads[id],unread:S.unread[id],seen:S.seen[id]};
  S.blocks=(S.blocks||[]).concat([{id,reason:reason||null,note:note||"",at:new Date().toISOString()}]);
  S.connections=S.connections.filter(c=>c!==id);
  delete S.threads[id];delete S.unread[id];
  S.seen[id]="blocked";
  save();renderAll();

  if(!LIVE)return true;
  const r=await DB.block(id);
  if(r.error){
    S.blocks=before.blocks;S.connections=before.connections;
    if(before.thread)S.threads[id]=before.thread;
    if(before.unread)S.unread[id]=before.unread;
    if(before.seen)S.seen[id]=before.seen;else delete S.seen[id];
    save();renderAll();
    toast("Couldn't block them — "+authMessage(r.error));
    return false;
  }
  loadConvos();
  return true;
}
async function unblockUser(id){
  const before=(S.blocks||[]).slice();
  S.blocks=(S.blocks||[]).filter(b=>b.id!==id);
  delete S.seen[id];save();renderAll();
  if(!LIVE)return true;
  const r=await DB.unblock(id);
  if(r.error){
    S.blocks=before;save();renderAll();
    toast("Couldn't unblock them — "+authMessage(r.error));
    return false;
  }
  loadConvos();
  return true;
}

/* A report nobody receives is worse than no report button at all: it tells
   someone their complaint is being handled when it is going nowhere. */
async function reportUser(id,reason,note,opts){
  if(!LIVE)return true;
  const r=await DB.report(Object.assign({userId:id,reason,note},opts||{}));
  if(r.error){toast("Couldn't send that report — "+authMessage(r.error));return false}
  return true;
}
function openReport(id){
  /* never refuse: being unable to name somebody is no reason to stop
     you reporting them, and the server only needs the id */
  const p=personOr(id);
  const sb=$("#sheetbody");
  sb.innerHTML=`<div class="grabber"></div>
    <h2 style="font-size:21px;margin-bottom:4px">Report ${esc(p.name.split(" ")[0])}</h2>
    <p class="dimtext" style="font-size:13.5px;margin:0 0 14px">Pick what happened. Reports are read by a person, not a filter.</p>
    <div id="rp-reasons">${REPORT_REASONS.map(([k,t,d])=>`
      <div class="vopt" data-r="${k}"><div class="ic">${FLAG}</div>
        <div class="tx"><b>${t}</b><span>${d}</span></div><span class="tick">${CHECK}</span></div>`).join("")}</div>
    <div class="field" id="rp-notewrap" style="display:none"><label>What happened</label>
      <textarea id="rp-note" placeholder="Anything that helps us understand. Screenshots can be added by email."></textarea></div>
    <div class="toggle on" id="rp-block">
      <div class="tx"><b>Block them as well</b><span>They disappear from your deck, feed and messages, and can't contact you again.</span></div>
      <span class="sw"></span></div>
    <button class="btn" id="rp-send" style="width:100%;margin-top:12px" disabled>Send report</button>
    <button class="btn ghost" id="rp-blockonly" style="width:100%;margin-top:9px">Just block, don't report</button>
    <p class="dimtext" style="font-size:11.5px;margin:12px 0 0;line-height:1.5">${LIVE
      ? "Your report is sent to us and read by a person, normally within 24 hours, and we'll tell you the outcome. Blocking takes effect straight away, whatever we decide."
      : "You're looking at the demo, so this report stays on this device and reaches nobody. Sign in and it goes to a person who reads it."}</p>`;
  $("#sheet").classList.add("on");
  let reason=null;
  sb.querySelectorAll("[data-r]").forEach(o=>o.onclick=()=>{
    reason=o.dataset.r;
    sb.querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("on",x.dataset.r===reason));
    $("#rp-notewrap").style.display=reason==="other"?"":"none";
    $("#rp-send").disabled=false;
  });
  $("#rp-block").onclick=()=>$("#rp-block").classList.toggle("on");
  $("#rp-send").onclick=async()=>{
    const btn=$("#rp-send"),note=($("#rp-note")&&$("#rp-note").value||"").trim();
    const alsoBlock=$("#rp-block").classList.contains("on");
    btn.disabled=true;btn.textContent="Sending…";
    /* The report goes first. If it cannot be filed we say so instead of
       claiming it was — "Report filed" when nothing left the device is the
       kind of lie that gets someone hurt. */
    const sent=await reportUser(id,reason,note);
    btn.disabled=false;btn.textContent="Send report";
    if(!sent)return;
    S.reports=(S.reports||[]).concat([{id,reason,note,at:new Date().toISOString()}]);
    save();
    let blocked=true;
    if(alsoBlock)blocked=await blockUser(id,reason,note);
    $("#sheet").classList.remove("on");
    refreshDiscover();renderFeed();renderChats();renderYou();
    toast("Report filed"+(alsoBlock&&blocked?" and "+p.name.split(" ")[0]+" blocked":""));
  };
  $("#rp-blockonly").onclick=async()=>{
    const btn=$("#rp-blockonly");btn.disabled=true;
    const ok=await blockUser(id,null,"");
    btn.disabled=false;
    if(!ok)return;
    $("#sheet").classList.remove("on");
    refreshDiscover();renderFeed();renderChats();renderYou();
    toast(p.name.split(" ")[0]+" blocked");
  };
}
const FLAG='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 21V4.5h14l-3 4.5 3 4.5H5"/></svg>';

/* ---------- band media ---------- */
const CLIP_LABEL={live:"Live",rehearsal:"Rehearsal",studio:"Studio",video:"Video"};
function bandTracks(b){return (b.tracks||[]).concat(((S.bandMedia&&S.bandMedia[b.id])||[]).filter(m=>m.media==="track"))}
function bandClips(b){return (b.clips||[]).concat(((S.bandMedia&&S.bandMedia[b.id])||[]).filter(m=>m.media==="clip"))}
function mediaVis(m){return (S.eventVis&&S.eventVis[m.id||m.title])||m.vis||"members"}
function visibleMedia(list,member){return member?list:list.filter(m=>mediaVis(m)==="public")}
const EV_LABEL={practice:"Practice",gig:"Gig",call:"Call"};

/* ---------- event privacy ----------
   A gig is a public performance, so gigs are public by default — that's the point of
   playing one. Practices and calls are members-only and can never be published: a
   rehearsal time and address is often someone's home.
   The exception a working musician actually needs is the private function — a wedding
   or corporate booking is a gig, but it is not open to the public, and the client's
   venue and time are not ours to announce. */
function isBandMember(b){return !!b&&S.joined.includes(b.id)}
const DEFAULT_VIS={gig:"public",practice:"members",call:"members",recording:"members"};
function evVis(e){
  if(S.eventVis&&S.eventVis[e.id])return S.eventVis[e.id];
  return e.vis||DEFAULT_VIS[e.type]||"members";
}
function canAnnounce(e){return e.type==="gig"}
function visibleEvents(b,viewerIsMember){
  const all=bandEvents(b);
  return viewerIsMember?all:all.filter(e=>evVis(e)==="public");
}
const CHECK='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>';
const LOCK='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>';
const GLOBE='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14 0 17M12 3.5c-2.5 2.6-2.5 14 0 17"/></svg>';
function visBadge(e){
  const pub=evVis(e)==="public";
  const label=pub?(e.type==="gig"?"Public show":"Public")
    :(e.type==="gig"?"Private function":"Members only");
  return `<span class="visb ${pub?"pub":""}">${pub?GLOBE:LOCK}${label}</span>`;
}
function evIcon(t){
  return t==="gig"
    ? '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>'
    : t==="call"
    ? '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 10l6-4v12l-6-4z"/><rect x="3" y="6" width="12" height="12" rx="2.5"/></svg>'
    : '<svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>';
}

     a band he had never joined.

     You are in this list only if you are actually in the band. */
  const total=member ? mem.length+1
                     : Math.max(mem.length,(LIVE&&b._count)||0);
  h.appendChild(el("div","sechead",
    `<h2>Members</h2><span class="more">${total} ${total===1?"person":"people"}</span>`));
  if(member){
    const me=el("div","mrow2");
    me.innerHTML=`<div class="av">${meAvatar()}</div>
      <div class="t"><b>${esc(S.me.name||"You")}</b><span>${esc(b.myRole||"")}</span></div>
      <span class="tagme">YOU</span>`;
    h.appendChild(me);
  }
  /* Whoever runs the band can take somebody out of it. Before this there
     was no way to, which mattered because the old joining rule let people
     add themselves — and a member can read the rehearsal address. */
  const canRemove=LIVE&&b._admin&&b.kind==="jammy"&&mem.length>0;

  mem.forEach(m=>{
    const row=el("div","mrow2");
    if(m.p){
      row.innerHTML=`<div class="av">${avatarOf(m.p)}</div>
        <div class="t"><b>${esc(m.p.name)}</b><span>${esc(m.role)} · ${esc(m.p.city)}</span></div>
        <svg aria-hidden="true" class="chev" viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:var(--dim);stroke-width:2"><path d="M9 5l7 7-7 7"/></svg>`;
      row.classList.add("statbtn");
      row.onclick=()=>{$("#bandview").classList.remove("on");openProfile(m.p.id)};
    }else{
      row.innerHTML=`<div class="ph">${initials(m.name)}</div>
        <div class="t"><b>${esc(m.name)}</b><span>${esc(m.role)} · not on Jammy</span></div>`;
    }
    h.appendChild(row);

    if(canRemove&&m.id){
      const rm=el("div");
      rm.style.cssText="padding:0 16px 11px;margin-top:-6px;border-bottom:1px solid var(--line)";
      const rb=el("button","btn ghost","Remove from "+b.name);
      rb.style.cssText="padding:8px 13px;font-size:13px";
      rb.setAttribute("data-remove",m.id);
      rb.onclick=ev=>{ev.preventDefault();ev.stopPropagation();
        confirmRemoveMember(b,m.id,(m.p&&m.p.name)||m.name||"this person",rm)};
      rm.appendChild(rb);
      h.appendChild(rm);
    }
  });

  if(member&&(b.space||((b.info||[]).length))){
    h.appendChild(el("div","sechead",`<h2>Details</h2>`));
    if(b.space)h.appendChild(el("div","inforow",`<span>Rehearsal space</span><span>${esc(b.space)}</span>`));
    (b.info||[]).forEach(([k,v])=>h.appendChild(el("div","inforow",`<span>${esc(k)}</span><span>${esc(v)}</span>`)));
  }

  const foot=el("div");foot.style.padding="16px";
  /* A real band on Jammy is asked to join at the top of this page, which
     waits for the server and reports what it actually said. This button
     stayed behind from before that existed: it fired and announced
     "Request sent" in the same breath, without waiting to find out, and
     on a live band it put a second Ask to join on the same screen. It is
     now only what it is still for — listing a band that isn't on Jammy
     on your own profile. */
  if(!member&&!(LIVE&&b.kind==="jammy")){
    const jb=el("button","btn",b.kind==="jammy"?"Ask to join "+b.name:"Add this band to my profile");
    jb.style.width="100%";
    jb.onclick=async()=>{
      jb.disabled=true;
      await joinBand(b.id);
      jb.disabled=false;
      $("#bandview").classList.remove("on");openBandList();
    };
    foot.appendChild(jb);
  }
  if(b.kind==="jammy"&&member){
    const cb=el("button","btn","Open band chat");cb.style.width="100%";
    cb.onclick=()=>{$("#bandview").classList.remove("on");$("#bandlist").classList.remove("on");go("chats");openChat(b.id,true)};
    foot.appendChild(cb);
  }
  if(member){
    /* This used to edit S.joined and nothing else. In LIVE that meant
       leaving a band changed what your own phone believed and never told
       the server: you stayed on the roster, stayed in the band chat, and
       could still read the rehearsal address. leaveBand() was sitting
       right here doing it properly and nothing called it. */
    const lv=el("button","btn ghost","Leave this band");lv.style.cssText="width:100%;margin-top:9px";
    lv.onclick=async()=>{
      lv.disabled=true;lv.textContent="Leaving…";
      await leaveBand(b.id);
      lv.disabled=false;lv.textContent="Leave this band";
      openBandList();renderYou();
    };
    foot.appendChild(lv);
  }
  h.appendChild(foot);
  $("#bandview").classList.add("on");
}

/* joining a band updates your profile automatically */
async function joinBand(id,silent){
  if(S.joined.includes(id))return;
  const b=Bnd(id);if(!b)return;

  if(LIVE){
    const r=await DB.joinBandSrv(id,myInstruments(),S.me.role||null);
    if(r.error){toast(authMessage(r.error));return}
    /* The server answers true only if you are actually in the band now.
       Since joining became asking, false means a request was filed and
       somebody has to say yes. This used to announce "You're in" either
       way, which told people they had joined a band they had not. */
    if(r.data===false){
      const b2=Bnd(id);if(b2)b2._request="pending";
      if(!silent)toast("Asked to join "+b.name+". They have to say yes.");
      return;
    }
    await loadBands();await loadBandDetail(id);loadConvos();
    if(!silent)toast("You're in "+b.name);
    return;
  }

  S.joined.push(id);
  if(b.kind==="jammy"&&!S.threads[id])S.threads[id]=(b.seed||[]).map(m=>({f:m.f,t:m.t}));
  save();renderYou();renderChats();
  if(!silent)toast("You're in "+b.name+" — it's on your profile now");
}

/* Taking somebody out of a band is not undoable from the app, so it asks
   first — in the row itself, because the artifact viewer and some phone
   browsers never show a confirm() dialog, and a confirmation that silently
   returns false is a Remove button that does nothing. */
function confirmRemoveMember(b,userId,name,host){
  host.innerHTML="";
  const q=el("div","privnote",`Take ${esc(name)} out of ${esc(b.name)}? They lose the band chat and the practice address.`);
  q.style.marginBottom="8px";
  const row=el("div");row.style.cssText="display:flex;gap:8px";
  const yes=el("button","btn","Remove");yes.style.cssText="padding:8px 13px;font-size:13px";
  const no=el("button","btn ghost","Keep them");no.style.cssText="padding:8px 13px;font-size:13px";
  yes.setAttribute("data-remove-yes",userId);
  no.onclick=()=>{openBand(b.id)};
  yes.onclick=async()=>{
    yes.disabled=true;no.disabled=true;yes.textContent="Removing…";
    const r=await DB.removeBandMember(b.id,userId);
    if(r.error){
      yes.disabled=false;no.disabled=false;yes.textContent="Remove";
      toast(authMessage(r.error));return;
    }
    toast(name+" is no longer in "+b.name);
    bandDetailLoaded[b.id]=false;
    await loadBands();
    await loadBandDetail(b.id);
    openBand(b.id);
  };
  row.appendChild(yes);row.appendChild(no);
  host.appendChild(q);host.appendChild(row);
}

async function leaveBand(id){
  const b=Bnd(id);if(!b)return;
  if(LIVE){
    const r=await DB.leaveBandSrv(id);
    if(r.error){toast(authMessage(r.error));return}
    await loadBands();loadConvos();
    $("#bandview").classList.remove("on");
    toast("You left "+b.name);
    return;
  }
  S.joined=S.joined.filter(x=>x!==id);save();renderYou();renderChats();
  $("#bandview").classList.remove("on");
  toast("You left "+b.name);
}

function openBlocked(){
  const sb=$("#sheetbody"),list=S.blocks||[];
  sb.innerHTML=`<div class="grabber"></div>
    <h2 style="font-size:21px;margin-bottom:4px">Blocked accounts</h2>
    <p class="dimtext" style="font-size:13.5px;margin:0 0 12px">${list.length?"They can't see you, message you, or appear anywhere in your app.":"You haven't blocked anyone."}</p>
    <div id="bl-list"></div>`;
  const host=sb.querySelector("#bl-list");
  list.forEach(bk=>{
    /* Draw the row even when we no longer know who this is.

       It used to `return` when A(bk.id) came back null, silently
       skipping the row — and blocking somebody is precisely what makes
       the app forget them, since they drop out of the deck and the
       conversation list. So the person you blocked most recently was
       the one least likely to appear here, and with no row there was
       no Unblock button: you could block somebody and then have no way
       on this screen to undo it. loadBlocks() now carries the name
       down from the server, and when even that is missing we draw the
       row anyway, because the button matters more than the name. */
    const p=A(bk.id);
    const name=(p&&p.name)||bk.name||"Someone you blocked";
    const row=el("div","rrow");
    row.innerHTML=`<div class="av">${p?avatarOf(p):`<span class="ph">${esc(initials(name))}</span>`}</div>
      <div class="t"><b>${esc(name)}</b><span>${
        [bk.handle?"@"+bk.handle:(p&&p.handle?"@"+p.handle:""),
         bk.city||(p&&p.city)||"",
         "Blocked "+dayPhrase(bk.at).toLowerCase(),
         bk.reason||""].filter(Boolean).map(esc).join(" · ")
      }</span></div>`;
    const un=el("button","minibtn","Unblock");
    un.onclick=async()=>{
      un.disabled=true;un.textContent="…";
      const ok=await unblockUser(bk.id);
      if(!ok){un.disabled=false;un.textContent="Unblock";return}
      openBlocked();refreshDiscover();renderFeed();renderYou();
      if(LIVE){refreshFeed(true);loadDeckSoon&&loadDeckSoon()}
      toast("Unblocked "+String(name).split(" ")[0]);
    };
    row.appendChild(un);host.appendChild(row);
  });
  if(!list.length)host.appendChild(el("div","empty",`<p style="font-size:13.5px">Blocking is instant and silent — they're never told.</p>`));
  $("#sheet").classList.add("on");
}

/* ================= NOTIFICATIONS ================= */
function buildAlerts(){
  const out=[];
  myBandList().forEach(b=>{
    bandEvents(b).forEach(e=>{
      const ms=new Date(e.at)-Date.now();
      if(ms<0||ms>12*86400000)return;
      const soon=ms<3*86400000;
      let title,body;
      if(e.type==="gig"){
        title=`${b.name} has a gig ${whenPhrase(e.at)}`;
        body=`${clock(e.at)} at ${e.place}.`+(e.myJob?` ${e.myJob} — don't forget.`:"");
      }else if(e.type==="call"){
        title=`${b.name} call ${whenPhrase(e.at)}`;
        body=`${clock(e.at)}.`+(e.myJob?` ${e.myJob}.`:"");
      }else{
        title=`${b.name} practice ${whenPhrase(e.at)}`;
        body=`${clock(e.at)} at ${e.place}.`+(e.myJob?` ${e.myJob}.`:" Don't be late.");
      }
      out.push({id:b.id+":"+e.id,kind:e.type,bandId:b.id,at:e.at,title,body,soon});
    });
  });
  Object.keys(S.unread||{}).forEach(id=>{
    /* never skip: an unread message is a fact about your inbox, and it
       needs a notification whether or not this phone can name the sender */
    const p=Bnd(id)||personOr(id);
    out.push({id:"msg:"+id,kind:"msg",at:new Date().toISOString(),
      title:(p.name||"Someone")+" sent you a message",body:"Open the chat to reply.",chat:id,soon:true});
  });
  return out.sort((a,b)=>new Date(a.at)-new Date(b.at));
}
function alertCount(){return buildAlerts().filter(a=>!S.readAlerts.includes(a.id)).length}
function paintBell(){
  const n=alertCount(),b=$("#b-alerts");
  if(!b)return;
  let pip=b.querySelector(".pip");
  if(n){if(!pip){pip=el("span","pip");b.appendChild(pip)}}
  else if(pip)pip.remove();
}
function openAlerts(){
  const list=buildAlerts(),b=$("#sheetbody");
  b.innerHTML=`<div class="grabber"></div>
    <h2 style="font-size:22px;margin-bottom:4px">Reminders</h2>
    <p class="dimtext" style="font-size:13.5px;margin:0 0 8px">${list.length?"From your "+myBandList().length+" bands and your messages.":"Nothing coming up in the next nine days."}</p>
    <div id="al-list"></div>`;
  const host=b.querySelector("#al-list");
  list.forEach(a=>{
    const row=el("button","alert "+(a.kind==="gig"?"gig":a.kind==="practice"?"prac":"")+(S.readAlerts.includes(a.id)?"":" unread"));
    row.innerHTML=`<div class="ic">${a.kind==="msg"
      ? '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 11.5a8 8 0 0 1-11.6 7.1L4 20l1.4-4.6A8 8 0 1 1 21 11.5z"/></svg>'
      : evIcon(a.kind)}</div>
      <div class="t"><b>${esc(a.title)}</b><span>${esc(a.body)}</span>
        ${a.kind!=="msg"?`<span class="ago">${countdown(a.at)}</span>`:""}</div>`;
    row.onclick=()=>{
      if(!S.readAlerts.includes(a.id)){S.readAlerts.push(a.id);save();paintBell()}
      $("#sheet").classList.remove("on");
      if(a.chat){go("chats");openChat(a.chat,!!Bnd(a.chat))}
      else if(a.bandId)openBand(a.bandId);
    };
    host.appendChild(row);
  });

  const clear=el("button","btn ghost","Mark all as read");clear.style.cssText="width:100%;margin-top:14px";
  clear.onclick=()=>{list.forEach(a=>{if(!S.readAlerts.includes(a.id))S.readAlerts.push(a.id)});save();paintBell();$("#sheet").classList.remove("on")};
  b.appendChild(clear);

}

function openSearch(){
  const sb=$("#sheetbody");
  sb.innerHTML=`<div class="grabber"></div>

            <div class="t"><b>${esc(a.name)}</b><span>${esc(a.role)} · ${esc(a.city)}</span></div>

          host.appendChild(row);n++;});
      }
    }
    if(kind==="All"||kind==="Tracks"){
      const trks=[];
      /* POOL(), not ARTISTS: signed in that is the real people the app has
         seen, and searching the invented ones would put made-up songs by
         made-up musicians into a real search. */
      POOL().forEach(a=>{if(isBlocked(a.id))return;(a.tracks||[]).forEach(t=>{if(hit(t.title)||hit(a.name))trks.push({a,t,uid:a.id+":"+t.title})})});
      ALLBANDS().forEach(b=>bandTracks(b).forEach(t=>{
        if(mediaVis(t)!=="public"&&!isBandMember(b))return;
        if(hit(t.title)||hit(b.name))trks.push({a:{id:b.id,name:b.name},t,uid:b.id+":"+t.title})}));
      if(trks.length){
        host.appendChild(el("div","sechead",`<h2>Tracks</h2><span class="more">${trks.length}</span>`));
        trks.slice(0,12).forEach(({a,t,uid})=>{
          const row=el("div","trow");
          row.innerHTML=`<div class="cov">${art(hash(uid),"",{k:"t"})}</div>
            <div class="t"><b>${esc(t.title)}</b><span>${esc(a.name)} · ${esc(t.key||"")} · ${t.bpm||"—"} bpm</span></div>
            <button class="pbtn" aria-label="Play">${ICON_PLAY}</button>`;

      <p>Jammy is Boston-only for now, so there may genuinely be nobody. Try a broader word.</p>`));
  };

  sb.querySelectorAll("#sfilters .pill").forEach(b=>b.onclick=()=>{
    kind=b.dataset.k;
    sb.querySelectorAll("#sfilters .pill").forEach(x=>x.classList.toggle("on",x.dataset.k===kind));run();
  });
  run();setTimeout(()=>$("#sq").focus(),150);
}

                          : JammyAPI.auth.sendEmailCode(contact);
  },
  async signInVerify(kind, contact, code){

                          : JammyAPI.auth.verifyEmail(contact, code);
  },
  async createProfile(draft){
    if(!LIVE) return {data:null, error:null};
    const r = await JammyAPI.profile.create({
      handle:(draft.handle||"").replace(/^@/,""), name:draft.name, city:draft.city,
      instruments:draft.instruments, genres:draft.genres,
      lookingFor:draft.goal, birthDate:draft.dob, needs:[], days:draft.days||[]
    });

  /* ---- likes ----
     Optimistic: the heart fills instantly and we reconcile with whatever
     the server says. If the write fails we put it back and say so, rather
     than leaving a like that never happened. */
  async toggleLike(postId, nextState){
    if(!LIVE){
      S.likes[postId]=nextState;save();
      return {data:{liked:nextState}, error:null};
    }
    const r=await JammyAPI.sb.rpc("toggle_like",{post:postId});
    if(r.error)return {data:null, error:r.error};
    const row=Array.isArray(r.data)?r.data[0]:r.data;

      created_at:c.at||new Date().toISOString(),
      author_name:(c.who==="me"?S.me.name:(A(c.who)||{}).name)||"Someone",
      is_mine:c.who==="me"}))

      S.comments[postId]=(S.comments[postId]||[]).concat([{who:"me",t:body,at:new Date().toISOString()}]);

/* Show an onboarding failure where it can actually be read, and keep the
   raw server text underneath — that line is what makes a problem reportable
   instead of "it got stuck". */
function obError(e){
  const foot=$("#ob-foot");
  if(!foot)return;
  let box=foot.querySelector(".oberr");
  if(!box){box=document.createElement("div");box.className="oberr";foot.insertBefore(box,foot.firstChild)}
  const raw=(e&&(e.message||e.error_description||e.details))||"";
  box.innerHTML=`<b>${esc(authMessage(e))}</b>`+(raw?`<code>${esc(String(raw))}</code>`:"");
  box.classList.add("on");
}
function obClearError(){
  const b=document.querySelector(".oberr");
  if(b)b.classList.remove("on");
}

/* Turn a server error into something a musician can act on.
   "AuthApiError: Token has expired or is invalid" helps nobody. */
function authMessage(e){
  const m=String((e&&(e.message||e.error_description))||e||"").toLowerCase();
  if(m.includes("rate limit")||m.includes("too many"))
    return "Too many codes requested. Wait a few minutes and try again.";
  if(m.includes("expired")||m.includes("invalid")||m.includes("otp"))
    return "That code is wrong or has expired. Ask for a new one.";
  if(m.includes("email")&&m.includes("not")&&m.includes("enabled"))
    return "Email sign-in isn't switched on for this project yet.";
  if(m.includes("signups not allowed")||m.includes("disabled"))
    return "New accounts are switched off for this project right now.";
  if(m.includes("failed to fetch")||m.includes("network"))
    return "Couldn't reach the server. Check your connection and try again.";
  if(m.includes("duplicate")||m.includes("unique")){
    if(m.includes("handle"))return "That handle is taken — pick another.";
    return "That's already registered.";
  }
  if(m.includes("adults_only")||m.includes("birth"))
    return "Jammy is 18+. Check the date of birth you entered.";
  if(m.includes("handle_check")||m.includes("handle ~"))
    return "Handles can only use lowercase letters, numbers and underscores — 3 to 20 of them.";
  return (e&&e.message)||"Something went wrong. Try again.";
}

/* A real profiles row from the database, adopted as "me". */
function adoptProfile(r){
  if(!r)return;
  /* has_location, not location: since 23_columns.sql the coordinate
     itself is unreadable through the table, and this flag is all the
     app ever wanted from it — whether the server knows where you are. */
  srvLoc=!!r.has_location;
  /* The database is the truth for the city. A stale value cached on one
     device must never win over a correction made somewhere else. */
  if(r.city&&S.me&&S.me.loc&&!r.location)S.me.loc.label=r.city;
  S.me={...ME_DEFAULT,
    id:r.id,
    name:r.display_name||"You",
    handle:"@"+(r.handle||"you"),
    city:r.city||"",
    instruments:r.instruments||[],
    role:(r.instruments||[]).slice(0,2).join(" · ")||"Musician",
    genres:(r.genres||[]).join(", "),
    want:r.looking_for||"",
    bio:r.bio||"",
    days:r.rehearsal_days||[],
    photo:r.photo_path||null,
    loc:S.me&&S.me.loc?S.me.loc:{...HOME},
    /* never carry the demo's recording into a real account */
    tracks:(S.me&&S.me.tracks||[]).filter(t=>t&&t.title!=="Kitchen Demo")};
  S.account=Object.assign({},S.account,{serverId:r.id});
}

/* Handles have to satisfy the database: lowercase, 3–20, letters/digits/_ */
function cleanHandle(h){
  return String(h||"").replace(/^@/,"").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,20);
}

/* map a database row onto the shape the cards already render */

    instruments:r.instruments||[], genres:r.genres||[],

    };
  }

  else if(st.id==="done"){
    body.innerHTML=`<div class="splash">
      <h1 class="lw">Welcome</h1>
      <p>Your card is live. ${esc(obDraft.instruments[0]||"Musicians")} players near ${esc(obDraft.city||"you")} can find you now.</p>
      <div class="free">Free. No subscription, ever.</div></div>`;
    foot.innerHTML=`<button class="btn" id="ob-next">Start looking</button>
      <p class="fine">Add a track any time from your profile — it goes straight into Jammy Radio's rotation.</p>`;
    $("#ob-next").onclick=()=>{$("#onb").classList.remove("on");go("disc");
      setTimeout(()=>toast("Swipe right to connect. Tap a card for the full profile."),700)};
  }
}
async function finishOnboarding(){
  /* Live: the profile has to land in the database before we let anyone in.
     If it fails, stay on this screen and say why — silently carrying on
     would give them an account that exists only on their own phone. */
  if(LIVE){
    const btn=$("#ob-next");
    if(btn){btn.disabled=true;btn.textContent="Creating your profile…"}
    obDraft.handle=cleanHandle(obDraft.handle)||cleanHandle(obDraft.name)||("user"+Math.floor(Math.random()*9000+1000));
    if(obDraft.handle.length<3)obDraft.handle="user"+Math.floor(Math.random()*9000+1000);
    const r=await DB.createProfile(obDraft);
    if(btn){btn.disabled=false;btn.textContent="Agree and continue"}
    if(r.error){obError(r.error);return}
    obClearError();
    if(r.data)adoptProfile(r.data);
  }
  S.account={method:obDraft.method,contact:obDraft.contact||null,dob:obDraft.dob,
    agreedAt:new Date().toISOString(),notifications:!!obDraft.notif,createdAt:new Date().toISOString(),
    serverId:(S.account&&S.account.serverId)||null};
  /* In live mode adoptProfile() has already filled S.me from the row the
     database actually stored, which is the version that matters — it has
     the real id, and the handle the server accepted rather than the one
     that was typed. Only the demo builds "me" out of the draft. */
  if(!LIVE){
    S.me={...ME_DEFAULT,
      name:obDraft.name||"You",handle:obDraft.handle||"@you",city:obDraft.city||"Boston",
      role:obDraft.instruments.slice(0,2).join(" · ")||"Musician",
      instruments:obDraft.instruments.slice(),
      days:obDraft.days&&obDraft.days.length?obDraft.days:["Wed","Thu"],
      loc:obDraft.loc||{lat:HOME.lat,lng:HOME.lng,label:obDraft.city||"Boston"},
      genres:obDraft.genres.join(", "),want:obDraft.goal||"Open to anything",
      bio:"",tracks:[]};
  }else if(obDraft.loc){
    S.me.loc=obDraft.loc;
  }
  S.onboarded=true;save();renderAll();loadDeck();loadConvos();loadRequests();loadBands();loadBandRequests();loadFeed();loadChart();loadMyTracks();loadRising();watchFeed();loadBlocks();obGo(10);
}
$("#ob-back").onclick=()=>obGo(obStep-1);
$("#ob-skip").onclick=()=>obGo(obStep+1);
function signOut(){
  /* let go of the realtime channel, or it keeps listening for the
     account that just left */
  stopWatchingFeed();
  if(LIVE)JammyAPI.auth.signOut();
  S.onboarded=false;S.account=null;save();
  obStep=0;obDraft={instruments:[],genres:[],goal:null,agreed:false,method:null};
  renderStep();$("#onb").classList.add("on");
}

/* ============ picking up where you left off ============
   Supabase keeps the session on the device, so a returning user should
   land straight in the app. The case that matters more is the opposite:
   this phone thinks it's signed in but the session has expired or was
   ended elsewhere. Carrying on would show a full app where every single
   request fails. Better to ask them to sign in again. */
async function resumeSession(){
  if(!LIVE)return;
  let s;
  try{ s=await JammyAPI.auth.session(); }catch(e){ return; }
  const live=!!(s&&s.data&&s.data.session);
  if(!live){
    if(S.onboarded){S.onboarded=false;S.account=null;save();renderAll()}
    obGo(0);$("#onb").classList.add("on");
    return;
  }
  const me=await DB.loadMe();
  if(me.data){
    adoptProfile(me.data);S.onboarded=true;save();
    $("#onb").classList.remove("on");renderAll();
    loadDeck();loadConvos();loadRequests();loadBands();loadBandRequests();loadFeed();loadChart();loadMyTracks();loadRising();watchFeed();loadBlocks();
    setTimeout(()=>locateOnLaunch(),250);
  }else{
    /* Signed in, but the profile was never finished — drop them back
       into onboarding at the first step after verification. */
    S.onboarded=false;save();
    obGo(3);$("#onb").classList.add("on");
  }
}

paintMode();
renderAll();
{const fab=$("#fab");if(fab)fab.hidden=false;}   /* feed is the landing tab */
/* locate on launch — after first paint, so the app is usable instantly
   and a slow GPS fix never holds up the UI */
if(S.onboarded)setTimeout(()=>locateOnLaunch(),250);
if(!S.onboarded){obGo(0);$("#onb").classList.add("on")}
else if(S.firstRun){S.firstRun=false;save();setTimeout(()=>toast("Swipe in Discover, play anything, the chart moves"),900)}
/* then let the server have the final say on whether we're signed in */
if(LIVE)resumeSession();
</script>
