function relTime(iso){
  if(!iso)return "";
  const m=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return "just now";
  if(m<60)return m+"m";
  const h=Math.floor(m/60); if(h<24)return h+"h";
  const d=Math.floor(h/24); if(d<7)return d+"d";
  return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

function openPostMenu(id){
  const post=allPosts().find(p=>p.id===id);if(!post)return;

  const saved=!!(S.saved||{})[id];
  sb.innerHTML=`<div class="grabber"></div>

             <button class="menurow danger" data-a="delete">${ICN_TRASH}<span><b>Delete post</b><span>Removed for everyone, straight away</span></span></button>`
            :`<button class="menurow" data-a="message">${ICN_MSG}<span><b>Message ${esc(((A(post.who)||{}).name||"").split(" ")[0])}</b><span>Reply privately instead of in public</span></span></button>

      <button class="menurow" data-a="save">${ICN_SAVE}<span><b>${saved?"Remove from saved":"Save post"}</b><span>${saved?"Take it off your saved list":"Keep it on your Saved tab"}</span></span></button>

      ${mine?"":`<button class="menurow danger" data-a="report">${ICN_FLAG}<span><b>Report post</b><span>A person reads every report</span></span></button>`}
    </div>`;
  $("#sheet").classList.add("on");
  sb.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    $("#sheet").classList.remove("on");
    if(a==="edit")return openComposer(post);
    if(a==="delete"){
      /* Signed in, deleting has to reach the database. Dropping it from the
         screen only would leave the post up for everybody else, which is
         the opposite of what deleting means. */
      if(LIVE){
        const keep=LIVEPOSTS.slice();
        LIVEPOSTS=LIVEPOSTS.filter(p=>p.id!==id);renderFeed();renderYou();
        DB.deletePost(id).then(r=>{
          if(r.error){LIVEPOSTS=keep;renderFeed();renderYou();toast(authMessage(r.error))}
          else toast("Post deleted");
        });
        return;
      }
      S.posts=S.posts.filter(p=>p.id!==id);save();renderFeed();renderYou();toast("Post deleted");return;
    }
    if(a==="save"){
      S.saved=S.saved||{};S.saved[id]=!S.saved[id];save();renderFeed();
      toast(S.saved[id]?"Saved":"Removed from saved");return;
    }
    if(a==="copy"){
      try{navigator.clipboard.writeText(post.txt);toast("Copied")}catch(e){toast("Couldn't copy here")}return;
    }
    if(a==="message"){go("chats");openChat(post.who);return}
    if(a==="profile")return openProfile(post.who);
    if(a==="report")return openReport(post.who);
  });
}

const FEED_PAGE=12;
let feedShown=FEED_PAGE, feedTab="all";
const FEED_TABS=[["all","All"],["mine","Yours"],["looking","Looking for"],["show","Shows"],
                 ["track","Tracks"],["gear","Gear"],["space","Spaces"],["saved","Saved"]];
function feedFiltered(){
  const all=allPosts();
  if(feedTab==="all")return all;
  if(feedTab==="mine")return all.filter(p=>p.who==="me");
  if(feedTab==="saved")return all.filter(p=>(S.saved||{})[p.id]);
  return all.filter(p=>p.type===feedTab);

function renderFeed(){
  const f=$("#feed");f.innerHTML="";

  const tabs=el("div","pills feedtabs");
  FEED_TABS.forEach(([k,label])=>{
    const n=k==="all"?allPosts().length
      :k==="mine"?allPosts().filter(p=>p.who==="me").length
      :k==="saved"?allPosts().filter(p=>(S.saved||{})[p.id]).length
      :allPosts().filter(p=>p.type===k).length;
    const b=el("button","pill"+(feedTab===k?" on":""),label+(n?` <i>${n}</i>`:""));
    b.onclick=()=>{feedTab=k;feedShown=FEED_PAGE;renderFeed();};
    tabs.appendChild(b);
  });
  f.appendChild(tabs);

  const posts=feedFiltered();
  if(!posts.length&&feedFailed&&LIVE){
    f.appendChild(el("div","empty",
      `<h3>Can't reach Jammy right now</h3>
       <p>This is a connection problem, not an empty feed. Check your signal and try again.</p>`));
    const again=el("button","btn ghost","Try again");
    again.style.cssText="width:calc(100% - 32px);margin:0 16px";
    again.onclick=()=>{feedFailed=false;renderFeed();loadFeed()};
    f.appendChild(again);

  }
  if(!posts.length){
    f.appendChild(el("div","empty",
      feedTab==="mine"
      ? `<h3>You haven't posted yet</h3><p>Tap the + button. Looking for a drummer is the most answered kind of post there is.</p>`
      : feedTab==="saved"
      ? `<h3>Nothing saved yet</h3><p>Tap the bookmark on any post to keep it here.</p>`
      : `<h3>No ${esc((FEED_TABS.find(t=>t[0]===feedTab)||[])[1]||"").toLowerCase()} posts yet</h3><p>Be the first — tap the + button.</p>`));
    renderStories();return;
  }
  let adi=0;
  posts.slice(0,feedShown).forEach((p,i)=>{
    f.appendChild(postEl(p));
    const pool=liveAds();
    if((i+1)%3===0&&pool[adi])f.appendChild(adEl(pool[adi++]));
  });
  if(posts.length>feedShown){
    const more=el("button","loadmore","Show more posts");
    more.style.margin="14px 16px";

$("#feed").addEventListener("click",e=>{
  const lk=e.target.closest("[data-like]");
  if(lk){
    const id=lk.dataset.like, was=!!S.likes[id], next=!was;
    /* Paint immediately — a like that waits on a round trip feels broken.
       The number has to move with the heart too: a heart that fills while
       the count stays put reads as not having worked. */
    const row=LIVEPOSTS.find(p=>p.id===id), before=row?row.likes:0;
    if(row)row.likes=Math.max(0,(row.likes||0)+(next?1:-1));
    S.likes[id]=next;save();renderFeed();
    DB.toggleLike(id,next).then(r=>{
      if(r.error){
        if(row)row.likes=before;
        S.likes[id]=was;save();renderFeed();
        toast("Couldn't save that like — check your connection");
      }else{
        const d=Array.isArray(r.data)?r.data[0]:r.data;   /* the server's count is the real one */
        if(row&&d&&typeof d.like_count==="number")row.likes=d.like_count;
        renderFeed();
      }
    });
    return;
  }
  const cm=e.target.closest("[data-cm]");
  if(cm){openComments(cm.dataset.cm);return}
  const cn=e.target.closest("[data-conn]");
  if(cn){connect(cn.dataset.conn);return}
  const ry=e.target.closest("[data-req-yes]");
  if(ry){answerRequest(ry.dataset.reqYes,true);return}
  const rn=e.target.closest("[data-req-no]");
  if(rn){answerRequest(rn.dataset.reqNo,false);return}
  const adv=e.target.closest("[data-advertise]");
  if(adv){openAdvertise();return}
  const ad=e.target.closest("[data-ad]");
  if(ad){
    const id=ad.dataset.ad;
    S.adStats=S.adStats||{};
    const st=S.adStats[id]||{imp:0,clicks:0};st.clicks++;S.adStats[id]=st;save();
    const req=(S.adRequests||[]).find(r=>r.id===id);
    toast(req&&req.url?"Opening "+req.url:"Click logged — this is how Jammy stays free");
    return;
  }
  const pm=e.target.closest("[data-media]");
  if(pm){
    const card=pm.closest(".post");
    const id=pm.dataset.media;
    const post=allPosts().find(x=>x.media&&x.media.id===id);
    openMediaViewer(id,post);return;
  }
  const mo=e.target.closest("[data-more]");
  if(mo){openPostMenu(mo.dataset.more);return}
  const sv=e.target.closest("[data-save]");
  if(sv){const id=sv.dataset.save;S.saved=S.saved||{};S.saved[id]=!S.saved[id];save();renderFeed();
    toast(S.saved[id]?"Saved":"Removed from saved");return}
  const rp=e.target.closest("[data-reply]");
  if(rp){
    const post=allPosts().find(x=>x.id===rp.dataset.reply);
    if(!post)return;
    const t=PT(post.type);
    const opener=post.type==="looking"
      ? `Saw your post looking for ${(post.fields&&post.fields.instrument||"someone").toLowerCase()}. I play ${myInstruments().join(" and ")||"a bit of everything"} — still looking?`
      : post.type==="space" ? `Saw your post about the room${post.fields&&post.fields.where?" at "+post.fields.where:""}. Is it still free?`
      : post.type==="gear"  ? `Is the ${(post.fields&&post.fields.item||"item").toLowerCase()} still available?`
      : `Saw you're playing${post.fields&&post.fields.venue?" at "+post.fields.venue:""} — I'll try to come down.`;
    if(!connected(post.who))connect(post.who,true);
    go("chats");openChat(post.who);
    setTimeout(()=>{const i=$("#ch-input");if(i){i.value=opener;i.dispatchEvent(new Event("input"));i.focus()}},260);
    return;
  }
  const tr=e.target.closest("[data-track]");
  if(tr){const[w,ix]=tr.dataset.track.split("|");const who=w==="me"?S.me:A(w);
    if(who&&who.tracks&&who.tracks[+ix])play(who.tracks[+ix],who);return}
});

  commentPost=postId;
  let rows=[], loading=true;

  const paint=()=>{
    if(commentPost!==postId)return;
    sb.innerHTML=`<div class="grabber"></div>
      <div class="cmhead">
        <h2 style="font-size:20px;margin:0">${loading?"Comments":rows.length+" "+(rows.length===1?"comment":"comments")}</h2>
        ${LIVE?`<span class="livedot" title="Updating live"></span>`:""}
      </div>
      <div id="cm-list"></div>
      <div class="cbar" style="border:0;background:transparent;padding:12px 0 0">
        <input id="cm-in" placeholder="Add a comment" autocomplete="off" maxlength="800">
        <button class="send" id="cm-send" aria-label="Post comment">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></svg></button>
      </div>`;
    const host=sb.querySelector("#cm-list");

    if(loading){
      host.appendChild(el("div","empty",`<p style="font-size:13.5px">Loading…</p>`));
    }else if(!rows.length){
      host.appendChild(el("div","empty",`<p style="font-size:13.5px">No comments yet. Say something useful.</p>`));
    }else{
      /* oldest first reads like a conversation */
      rows.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(c=>{
        const mine=c.is_mine||c.author_id==="me";
        const who=mine?S.me:(A(c.author_id)||{name:c.author_name||"Someone"});
        const row=el("div","cmrow");
        row.innerHTML=`<div class="av">${mine?meAvatar(34):(who.id?avatarOf(who):art(hash(c.author_name||"x"),initials(c.author_name||"?"),{k:"a"}))}</div>
          <div class="t"><b>${esc(who.name||c.author_name||"Someone")} <i>${relTime(c.created_at)}</i></b>
            <span>${esc(c.body)}</span></div>
          ${(mine||post.who==="me")?`<button class="cmdel" data-del="${esc(c.id)}" aria-label="Delete comment">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`:""}`;
        host.appendChild(row);
      });
      host.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
        const id=b.dataset.del;
        rows=rows.filter(r=>String(r.id)!==String(id));paint();
        const r=await DB.deleteComment(id,postId);
        if(r.error){toast("Couldn't delete that");load()}
        else renderFeed();
      });
    }

    const send=async()=>{
      const inp=sb.querySelector("#cm-in"), v=inp.value.trim();
      if(!v)return;
      inp.value="";inp.disabled=true;
      /* show it straight away, reconcile after */
      const temp={id:"temp"+Date.now(),author_id:"me",is_mine:true,body:v,
                  created_at:new Date().toISOString(),author_name:S.me.name};
      rows.push(temp);paint();
      const r=await DB.addComment(postId,v);
      const inp2=sb.querySelector("#cm-in");if(inp2)inp2.disabled=false;
      if(r.error){
        rows=rows.filter(x=>x.id!==temp.id);paint();
        toast(String(r.error.message||"").includes("Slow down")
          ? "Slow down a moment — too many comments" : "Couldn't post that comment");
        return;
      }
      if(r.data&&r.data.id){temp.id=r.data.id}
      /* the card's comment count has to move too, or the comment appears in
         the sheet and the post still says none */
      const row=LIVEPOSTS.find(p=>p.id===postId);
      if(row)row.comments=(row.comments||0)+1;
      renderFeed();
    };
    sb.querySelector("#cm-send").onclick=send;
    sb.querySelector("#cm-in").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
    const box=sb.querySelector("#cm-list");if(box)box.scrollTop=box.scrollHeight;
  };

  const load=async()=>{
    const r=await DB.comments(postId);
    if(commentPost!==postId)return;
    loading=false;
    if(r.error){rows=[];paint();toast("Couldn't load comments");return}
    rows=r.data||[];paint();
  };

  paint();load();
  $("#sheet").classList.add("on");

  /* live updates while the sheet is open */
  closeComments();commentPost=postId;
  commentWatch=DB.watchComments(postId,(c)=>{
    if(commentPost!==postId)return;
    if(rows.some(x=>String(x.id)===String(c.id)))return;
    rows.push(c);paint();renderFeed();
  });
}

/* People you have asked to play with, who haven't answered yet. Kept on
   this device only — the server already knows, this is just so the button
   can say "Requested" instead of forgetting you ever pressed it. */
S.requested=S.requested||{};

/* Connecting is not something this app can decide on its own. Both people
   have to say yes, and only the server can see the other half of that. The
   Connect button used to add the person to a list on this device and show
   "Connected" — which was simply untrue. The server never heard about it,
   so no conversation existed, and every message afterwards failed. */
async function connect(id,silent){
  //  personOr, not A(): if the profile isn't in the cache (a block was
  //  lifted, a card arrived from the server mid-session, the page was
  //  reloaded on a deep link) the Connect button used to do nothing at
  //  all when pressed. The request itself only needs the id, so send it
  //  and use a neutral name in the toast rather than ignoring the press.
  const p=personOr(id);
  if(connected(id)){openChat(id);return}

  if(LIVE){
    if(S.requested[id]){toast("Already asked — waiting on "+p.name.split(" ")[0]);return}
    S.requested[id]=true;save();renderFeed();
    const r=await DB.swipe(id,"yes");
    if(r.error){
      delete S.requested[id];save();renderFeed();
      toast(authMessage(r.error));
      return;
    }
    const row=Array.isArray(r.data)?r.data[0]:r.data;
    const matched=!!(row&&(row.matched||row.is_match));
    if(!matched){
      toast("Asked "+p.name.split(" ")[0]+" — you'll connect when they say yes");
      return;
    }
    delete S.requested[id];
    S.connections.unshift(id);
    save();updateBadge();renderFeed();renderChats();
    loadConvos();
    if(!silent)showMatch(p,id);
    return;
  }

  S.connections.unshift(id);
  S.threads[id]=S.threads[id]||[{f:"them",t:(p.replies&&p.replies[0])||"Hey!"}];
  S.unread[id]=1;
  save();updateBadge();renderFeed();renderChats();
  if(!silent)showMatch(p,id);
}

/* ============ discover ============ */
/* ---------- filtering ---------- */
/* Someone 4 miles away is not a "remote collaborator" — they are simply outside a tight
   radius. Remote only means far enough that rehearsing in person is off the table. */
const REMOTE_FLOOR=25;
function isRemoteMatch(a){
  const f=S.filters;
  return f.remoteOk&&a.remote&&f.radius>0&&distTo(a)>Math.max(f.radius,REMOTE_FLOOR);
}
function passes(a){
  const f=S.filters,o=overlap(a);
  if(f.radius>0&&o.mi>f.radius&&!isRemoteMatch(a))return false;
  if(f.excludeSame&&o.sameInstrument)return false;
  if(f.needs.length&&!o.iNeedThem.length)return false;
  if(f.minGenres>0&&o.sharedGenres.length<f.minGenres)return false;
  if(f.genreMode==="all"&&myGenres().length&&o.sharedGenres.length<myGenres().length)return false;
  return true;
}
function matches(){
  /* Live rows have already been filtered by the database — by distance,
     by complementary instrument, by blocks, and by who you've swiped on.
     Re-running passes() over them would second-guess that with worse
     information and quietly empty the deck. */
  if(LIVE){
    return LIVEPOOL.filter(a=>!S.seen[a.id]&&!isBlocked(a.id))
      .map(a=>({a,o:overlap(a),remote:!!a.remote}))
      .sort((x,y)=>(x.remote-y.remote)||(y.o.score-x.o.score));
  }
  return ARTISTS.filter(a=>!S.seen[a.id]&&!isBlocked(a.id)).map(a=>({a,o:overlap(a),remote:isRemoteMatch(a)}))
    .filter(x=>passes(x.a))
    .sort((x,y)=>(x.remote-y.remote)||(y.o.score-x.o.score));
}
function queue(){return matches().map(x=>x.a)}
function filterSummary(){
  const f=S.filters,bits=[];
  bits.push(f.radius>0?"Within "+f.radius+" mi":"Any distance");
  if(f.needs.length)bits.push("needs "+f.needs.length+" role"+(f.needs.length>1?"s":""));
  if(f.minGenres>0)bits.push(f.minGenres+"+ shared");
  if(f.excludeSame)bits.push("complementary");
  if(f.remoteOk&&f.radius>0)bits.push("+ remote");
  return bits.join(" · ");
}
/* ---------- fetching real people ----------
   Every filter change is a new question for the database, because the
   distance ring and the complementary-instrument rule are enforced there,
   not here. Requests are coalesced: dragging the radius slider across four
   stops should ask once, not four times. */
let deckLoading=false,deckAgain=false,deckTimer=null;
async function loadDeck(){
  if(!LIVE)return;
  if(deckLoading){deckAgain=true;return}
  deckLoading=true;
  const r=await DB.matches();
  deckLoading=false;
  if(r.error){
    toast("Couldn't load people nearby — check your connection");
  }else{
    LIVEPOOL=remember(r.data||[]);
    /* The server already leaves out everyone you have swiped on, so anyone
       it DID send is someone you have not. A stale "seen" mark on this
       device would hide them forever — which is what happened when swipes
       failed to save: the card vanished here and never existed there. */
    LIVEPOOL.forEach(a=>{ if(S.seen[a.id])delete S.seen[a.id]; });
    save();
  }
  if(deckAgain){deckAgain=false;return loadDeck()}
  refreshDiscover();
}
function loadDeckSoon(){
  if(!LIVE)return;
  clearTimeout(deckTimer);
  deckTimer=setTimeout(loadDeck,220);
}

/* Discover has two halves: people to play with, and gigs to go to.
   Stella's own words for the second one — Jammy should also be where
   somebody who just wants to hear live music finds a gig tonight. */
function discoverMode(){return S.discMode==="gigs"?"gigs":"people"}

/* A screen that shows "Loading…" because somebody else was supposed to
   have fetched its data will show it forever if they did not. Each screen
   asks for what it needs when it is opened and finds nothing — once, and
   only when nothing is already in flight. */
function ensureScreenData(view){
  if(!LIVE)return;
  if(view==="radio"){
    if(LIVECHART===null&&!chartLoading)loadChart();
    if(RISING===null&&!risingLoading)loadRising();
  }
  /* The feed used to load once and never again: the condition below only
     fires while LIVEPOSTS is empty, so after the first visit, coming back
     to Feed did nothing. Hasan posted and it never reached hey's phone.
     Now the first visit loads it and every later visit re-asks. */
  if(view==="feed"){
    if(!LIVEPOSTS.length&&!feedLoading&&feedCursor===null)loadFeed();
    else refreshFeed();
  }
  if(view==="disc"&&discoverMode()==="gigs"&&LIVEGIGS===null&&!gigsLoading)loadGigs();
  /* Opening Messages re-asks the server who you are actually talking to.
     Without this, a connection somebody ended on their phone went on
     looking live on yours until the whole app was reloaded. */
  if(view==="chats")refreshConvos();
}

/* One place that re-checks conversations, throttled so that flicking
   between tabs doesn't hammer the server. */
let lastConvoCheck=0, convoChecking=false;
function refreshConvos(force){
  if(!LIVE||convoChecking)return;
  const now=Date.now();
  if(!force&&now-lastConvoCheck<8000)return;
  lastConvoCheck=now;convoChecking=true;
  Promise.resolve(loadConvos()).finally(()=>{convoChecking=false});
}

/* Who you have blocked, according to the SERVER.

   S.blocks was written only by this phone and never read back from
   anywhere. The feed, Discover and the chat list all hide people using
   that local list, so a block made on another device was invisible here
   — and worse, a block that had been LIFTED on the server stayed in
   this phone's storage forever, quietly hiding somebody's posts with
   nothing on screen to explain it. The server is the truth; this makes
   the phone agree with it. */
async function loadBlocks(){
  if(!LIVE)return;
  const r=await DB.blocked();
  if(r.error||!Array.isArray(r.data))return;     /* keep what we have */
  const serverIds=r.data.map(b=>b.blocked_id);
  const keep=(S.blocks||[]).filter(b=>serverIds.includes(b.id));
  const byId=new Map(keep.map(b=>[b.id,b]));
  r.data.forEach(b=>{
    /* my_blocks() carries the name, so attach it to rows we already
       had as well — otherwise somebody blocked before this existed
       stays nameless on the Blocked accounts screen for ever. */
    const name=b.display_name||null;
    const had=byId.get(b.blocked_id);
    if(had){ if(name)had.name=name; if(b.city)had.city=b.city; return }
    keep.push({id:b.blocked_id,reason:null,note:"",
      at:b.created_at||new Date().toISOString(),
      name:name,city:b.city||null,handle:b.handle||null});
  });
  const changed=keep.length!==(S.blocks||[]).length;
  S.blocks=keep;save();
  if(changed)renderAll();
}

/* Re-ask for page one of the feed, throttled. Posting, liking and
   commenting all refresh it already; this is for everything somebody
   ELSE did. */
let lastFeedCheck=0, feedChecking=false;
function refreshFeed(force){
  if(!LIVE||feedChecking||feedLoading)return;
  const now=Date.now();
  if(!force&&now-lastFeedCheck<8000)return;
  lastFeedCheck=now;feedChecking=true;
  feedCursor=null;feedCursorId=null;feedEnd=false;
  Promise.resolve(loadFeed()).finally(()=>{feedChecking=false});
}

/* A new post anywhere is a nudge to refetch, not something to render
   from directly — the realtime row has no author name or counts on it. */
let postWatch=null;
function watchFeed(){
  if(!LIVE||postWatch)return;
  try{ postWatch=DB.watchPosts(()=>refreshFeed(true)); }catch(e){ postWatch=null }
}
function stopWatchingFeed(){
  if(postWatch){try{DB.unwatch(postWatch)}catch(e){}postWatch=null}
}

/* ---------- gigs near you ---------- */
let LIVEGIGS=null,gigsLoading=false;

async function loadGigs(){
  if(!LIVE||gigsLoading)return;
  gigsLoading=true;
  /* The same ring Discover uses, so "within 7 miles" means the same
     thing on both halves of this screen. Zero means anywhere. */
  const miles=(S.filters&&S.filters.radius!=null)?S.filters.radius:25;
  const r=await DB.gigsNearMe(miles,60);
  gigsLoading=false;
  if(r.error){LIVEGIGS=[];renderGigs(r.error);return}
  LIVEGIGS=(r.data||[]).map(g=>({
    id:g.event_id, bandId:g.band_id, band:g.band_name,
    genres:g.band_genres||[], at:g.starts_at,
    place:g.place||"", city:g.city||"", miles:g.miles,
    mine:!!g.i_am_member
  }));
  renderGigs();
}

function renderGigs(err){
  const host=$("#gigs");if(!host)return;
  host.innerHTML="";

  if(!LIVE){
    host.appendChild(el("div","empty",
      `<h3>Gigs near you</h3><p>This fills up once you're signed in. A band posts a show and everyone nearby can find it — you don't have to be in the band, or know anyone in it.</p>`));
    return;
  }
  if(err){
    host.appendChild(el("div","empty",
      `<h3>Couldn't load gigs</h3><p>${esc(authMessage(err))}</p>`));
    return;
  }
  if(LIVEGIGS===null){
    host.appendChild(el("div","empty",`<p style="font-size:13.5px">Looking for gigs…</p>`));
    return;
  }

  const miles=(S.filters&&S.filters.radius!=null)?S.filters.radius:25;
  if(!LIVEGIGS.length){
    host.appendChild(el("div","empty",
      `<h3>No gigs coming up</h3>
       <p>Nothing booked ${miles>0?"within "+miles+" miles":"anywhere"} in the next two months. When a band near you posts a show, it lands here.</p>`));
    const wider=el("button","btn ghost",miles>0?"Look anywhere":"Try again");
    wider.style.cssText="width:calc(100% - 32px);margin:0 16px";
    wider.onclick=()=>{
      if(miles>0){S.filters.radius=0;save()}
      LIVEGIGS=null;renderGigs();loadGigs();
    };
    host.appendChild(wider);
    return;
  }

  host.appendChild(el("div","sechead",
    `<h2>Coming up</h2><span class="more">${LIVEGIGS.length} ${LIVEGIGS.length===1?"gig":"gigs"}</span>`));

  let lastDay="";
  LIVEGIGS.forEach(g=>{
    const d=new Date(g.at), day=dayPhrase(g.at);
    if(day!==lastDay){lastDay=day;host.appendChild(el("div","bgroup",day.toUpperCase()))}
    const row=el("button","evrow statbtn");
    row.innerHTML=`<div class="when"><b>${DOW[d.getDay()].slice(0,3)} ${d.getDate()}</b><span>${clock(g.at)}</span></div>
      <div class="what"><b>${esc(g.band)}</b>
        <span>${esc(g.place||"Venue to be announced")}${g.city?" · "+esc(g.city):""}${g.miles!=null?" · "+distLabel(g.miles):""}</span>
        ${g.genres.length?`<span style="opacity:.75">${esc(g.genres.join(" · "))}</span>`:""}</div>
      <span class="evtype gig">${g.mine?"YOURS":"GIG"}</span>`;
    row.onclick=()=>openBand(g.bandId);
    host.appendChild(row);
  });

  host.appendChild(el("div","privnote",
    `${GLOBE} Only public shows appear here. Practices never do — a practice is usually somebody's home.`));
}

/* ---------- deck ---------- */
function dcard(a,layer){
  const tr=a.tracks[0],uid=a.id+":"+tr.title,o=overlap(a);
  const c=el("div","dcard"+(layer?" s"+layer:""));c.dataset.id=a.id;
  c.innerHTML=`<div class="hero">${art(hash(a.id),initials(a.name),{size:170})}
      <div class="badge-dist">${isRemoteMatch(a)?"Remote · "+esc(a.city)+" · "+distLabel(o.mi):(o.mi===null?esc(a.city):distLabel(o.mi)+" · "+esc(a.city))}</div>
      <div class="mscore"><i></i>${o.score}% fit</div>
      <div class="stamp y">CONNECT</div><div class="stamp n">SKIP</div></div>
    <div class="info">
      <h2>${esc(a.name.split(" ")[0])} <em>${esc(a.handle)}</em></h2>
      <div class="role">${esc(a.role)}</div>
      <div class="why">${reasons(a,o).map(r=>`<span class="${r.hot?"hot":""}">${esc(r.t)}</span>`).join("")}</div>
      <p class="bio">${esc(a.bio)}</p>
      <div class="chips">${a.genres.map(g=>{
        const sh=o.sharedGenres.some(x=>x.toLowerCase()===g.toLowerCase());
        return `<span class="chip${sh?" mag":""}">${esc(g)}</span>`}).join("")}</div>
      <div class="trk"><button class="pbtn" data-play="${esc(uid)}" data-dtrack="${a.id}">${nowPlaying===uid?ICON_PAUSE:ICON_PLAY}</button>
        ${waveBars(uid,30)}
        <div style="font-size:11px;color:var(--dim);text-align:right;line-height:1.2;flex:none;max-width:90px">${esc(tr.title)}<br>${esc(tr.key)} · ${tr.bpm}bpm</div></div>
    </div>`;
  c.querySelector("[data-dtrack]").addEventListener("click",ev=>{ev.stopPropagation();play(tr,a)});
  if(!layer)drag(c,a);
  return c;
}
function renderDeck(){
  const d=$("#deck");d.innerHTML="";
  const q=queue();
  if(!q.length){
    const f=S.filters;
    const wider=RINGS.find(r=>r===0||r>f.radius);

    /* An empty deck in live mode is nearly always one of two things, and
       the old message named neither. Without a location Jammy can only
       match on the city you typed, so "Boston" and "Somerville" never see
       each other — which looks exactly like nobody being out there. */
    if(LIVE&&!srvLoc){
      const e2=el("div","empty",`<h3>Nobody yet — and Jammy can't tell where you are</h3>
        <p>Without your location, Jammy can only match you with people who typed
        the <b>same city</b> as you. Someone two miles away who wrote a different
        neighbourhood won't show up.</p>`);
      const b=el("button","btn","Use my location");
      b.style.marginTop="14px";
      b.onclick=async()=>{b.disabled=true;b.textContent="Locating…";
        await locateOnLaunch(true);b.disabled=false;b.textContent="Use my location";
        loadDeck();};
      e2.appendChild(b);
      const b2=el("button","btn ghost","Edit my city instead");
      b2.style.cssText="margin-top:9px";
      /* This called editProfile(), which does not exist anywhere in the
         app — the editor is openEdit(). Pressing it went to the profile
         tab and then threw, on the one screen a new person reaches when
         Jammy cannot find anybody near them. */
      b2.onclick=()=>{go("you");setTimeout(openEdit,120)};
      e2.appendChild(b2);
      d.appendChild(e2);
      return;
    }

    const e=el("div","empty",`<h3>Nobody matches that yet</h3>
      <p>${f.radius>0?"No one within "+f.radius+" miles fits these filters.":"No one fits these filters."}
      ${POOL().filter(a=>!S.seen[a.id]).length?" Loosening the distance usually helps most.":" You've seen everyone — reset the deck below."}</p>`);
    if(POOL().filter(a=>!S.seen[a.id]).length&&f.radius>0){
      const b=el("button","btn",wider===0?"Show any distance":"Widen to "+wider+" miles");
      b.style.marginTop="14px";
      b.onclick=()=>{S.filters.radius=wider;save();refreshDiscover();loadDeckSoon()};
      e.appendChild(b);
      const b2=el("button","btn ghost","Open filters");b2.style.cssText="margin-top:9px";
      b2.onclick=openFilters;e.appendChild(b2);
    }else{
      const b=el("button","btn ghost","Start over");b.style.marginTop="14px";
      b.onclick=()=>{S.seen={};save();refreshDiscover();loadDeckSoon()};e.appendChild(b);
    }
    d.appendChild(e);return;
  }
  q.slice(0,3).reverse().forEach((a,i,arr)=>d.appendChild(dcard(a,arr.length-1-i)));
}
function drag(c,a){
  let x0=0,y0=0,dx=0,dy=0,down=false,moved=false;
  const y=c.querySelector(".stamp.y"),n=c.querySelector(".stamp.n");
  c.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    down=true;moved=false;x0=e.clientX;y0=e.clientY;c.style.transition="none";
    try{c.setPointerCapture(e.pointerId)}catch(_){}
  });
  c.addEventListener("pointermove",e=>{
    if(!down)return;dx=e.clientX-x0;dy=e.clientY-y0;
    if(Math.abs(dx)>6||Math.abs(dy)>6)moved=true;
    c.style.transform=`translate(${dx}px,${dy*.4}px) rotate(${dx/22}deg)`;
    y.style.opacity=Math.max(0,Math.min(1,dx/90));
    n.style.opacity=Math.max(0,Math.min(1,-dx/90));
  });
  const end=()=>{
    if(!down)return;down=false;c.style.transition="";
    if(!moved){openProfile(a.id);reset();return}
    if(dx>100)return swipe(a,"yes");
    if(dx<-100)return swipe(a,"no");
    reset();
  };
  function reset(){c.style.transform="";y.style.opacity=n.style.opacity=0;dx=dy=0}
  c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);
}
function swipe(a,verdict){
  const c=$(`.dcard[data-id="${a.id}"]`);
  if(c){c.classList.add("fly");c.style.transform=`translate(${verdict==="yes"?620:-620}px,40px) rotate(${verdict==="yes"?28:-28}deg)`;c.style.opacity=0}
  S.seen[a.id]=verdict;save();
  remember([a]);

  if(LIVE){
    /* The card leaves straight away — waiting on the network before the
       animation would make every swipe feel broken. The server decides
       whether it's a match, because only it can see the other person's
       swipe. */
    DB.swipe(a.id,verdict).then(r=>{
      if(r.error){
        delete S.seen[a.id];save();refreshDiscover();
        toast("That didn't save — check your connection");
        return;
      }
      if(verdict==="yes"){
        const row=Array.isArray(r.data)?r.data[0]:r.data;
        const matched=!!(row&&(row.matched||row.is_match));
        if(matched){connect(a.id);loadConvos()}else toast("Request sent to "+a.name.split(" ")[0]);
      }
      if(LIVEPOOL.length<4)loadDeck();
      if(LIVE&&REQUESTS.some(x=>x.id===a.id))loadRequests();
    });
    setTimeout(refreshDiscover,380);
    return;
  }

  const match=verdict==="yes"&&a.likesYou;
  setTimeout(()=>{refreshDiscover();
    if(verdict==="yes"){
      if(match)connect(a.id);
      else toast("Request sent to "+a.name.split(" ")[0]);
    }},380);
}
$("#d-no").onclick=()=>{const q=queue();if(q[0])swipe(q[0],"no")};
$("#d-yes").onclick=()=>{const q=queue();if(q[0])swipe(q[0],"yes")};
$("#d-hear").onclick=()=>{const q=queue();if(q[0])play(q[0].tracks[0],q[0])};

/* ---------- distance rings ---------- */
function renderRadar(){
  const host=$("#radar");host.innerHTML="";
  const f=S.filters,R=150,cx=170,cy=170;
  const all=POOL().filter(a=>!S.seen[a.id]).map(a=>({a,o:overlap(a)}));
  const maxRing=f.radius>0?f.radius:Math.max(30,...all.map(x=>x.o.mi));
  const scale=mi=>{const t=Math.log10(1+mi)/Math.log10(1+maxRing*1.25);return Math.min(1,t)*R};
  const ringsToDraw=(f.radius>0?[3,7,15,30,100].filter(r=>r<=Math.max(f.radius,3)):[3,7,15,30,100]);
  let svg=`<svg viewBox="0 0 340 352" role="img" aria-label="Musicians by distance from you">`;
  ringsToDraw.forEach(r=>{
    const rr=scale(r),sel=f.radius===r;
    svg+=`<circle cx="${cx}" cy="${cy}" r="${rr.toFixed(1)}" fill="none"
      stroke="${sel?"var(--mag)":"var(--line)"}" stroke-width="${sel?1.6:1}" ${sel?"":'stroke-dasharray="3 4"'}/>`;
    svg+=`<text x="${cx}" y="${(cy-rr-4).toFixed(1)}" text-anchor="middle" font-size="8.5"
      fill="${sel?"var(--mag)":"var(--dim)"}" font-family="JetBrains Mono,monospace">${r}mi</text>`;
  });
  svg+=`<circle cx="${cx}" cy="${cy}" r="5" fill="var(--text)"/>
        <text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="9" fill="var(--dim)">you</text>`;
  const shown=[];
  all.forEach(({a,o})=>{
    const ok=passes(a);
    const ang=toRad(bearing(myLoc(),{lat:a.lat,lng:a.lng})-90);
    const rr=scale(o.mi);
    const x=cx+Math.cos(ang)*rr,y=cy+Math.sin(ang)*rr;
    const size=ok?(4+o.score/22):3.2;
    const fill=ok?(o.theyNeedMe.length?"var(--amber)":"var(--mag)"):"var(--surface2)";
    svg+=`<g class="rdot" data-id="${a.id}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size.toFixed(1)}"
      fill="${fill}" ${ok?"":'stroke="var(--line)"'}/>`;
    if(ok&&o.score>55)svg+=`<text x="${x.toFixed(1)}" y="${(y-size-4).toFixed(1)}" text-anchor="middle" font-size="8"
      fill="var(--dim)">${esc(a.name.split(" ")[0])}</text>`;
    svg+=`</g>`;
    if(ok)shown.push({a,o});
  });
  svg+=`</svg>`;
  const wrap=el("div","rwrap",svg);
  host.appendChild(wrap);
  host.appendChild(el("div","rleg",
    `<span><b>●</b> fits your filters</span><span style="color:var(--amber)"><b>●</b> needs your instrument</span><span>○ filtered out</span>`));
  const list=el("div","rlist");
  list.appendChild(el("div","sechead",`<h2>${shown.length} ${shown.length===1?"match":"matches"}</h2><span class="more">${filterSummary()}</span>`));
  shown.sort((x,y)=>x.o.mi-y.o.mi).forEach(({a,o})=>{
    const row=el("button","rrow");
    row.innerHTML=`<div class="av">${avatarOf(a)}</div>
      <div class="t"><b>${esc(a.name)}</b><span>${esc(a.role)} · ${esc(a.city)}${o.theyNeedMe.length?" · needs a "+esc(o.theyNeedMe[0].toLowerCase()):""}</span></div>
      <div class="d"><b>${distLabel(o.mi)}</b>${o.score}% fit</div>`;
    row.onclick=()=>openProfile(a.id);
    list.appendChild(row);
  });
  if(!shown.length)list.appendChild(el("div","empty",`<h3>Nothing inside this ring</h3><p>Drag the distance up, or allow remote collaborators.</p>`));
  host.appendChild(list);
  wrap.querySelectorAll(".rdot").forEach(g=>g.onclick=()=>openProfile(g.dataset.id));
}

let lbTab="week";

/* The chart, from real plays. Everything below this line is the signed-out
   demo — invented tracks, invented play counts, a made-up position change.
   Signed in, every number on this screen is a true one, including when the
   true one is nothing. */
let LIVECHART=null, LIVELISTENERS=0, chartLoading=false, chartStall=null;

async function loadChart(){
  if(!LIVE||chartLoading)return;
  chartLoading=true;
  const [c,l]=await Promise.all([DB.weeklyChart(10),DB.listeningNow()]);
  chartLoading=false;
  if(c.error){LIVECHART=[];renderRadio();return}
  LIVECHART=(c.data||[]).map(r=>({
    uid:"t:"+r.track_id,
    track:{id:r.track_id,title:r.title,key:r.key||"",bpm:r.bpm||0,path:r.audio_path},
    artist:{id:r.owner_id,name:r.artist_name||r.artist_handle||"Someone",photo_path:r.artist_photo},
    plays:Number(r.plays||0), listeners:r.listeners||0,
    move:r.move||0, isNew:!!r.is_new, me:!!r.mine
  }));
  LIVELISTENERS=(l&&!l.error&&typeof l.data==="number")?l.data:0;
  renderRadio();
}

function chartData(){
  if(LIVE)return LIVECHART||[];
  const rows=[];
  ARTISTS.forEach(a=>a.tracks.forEach((t,i)=>{
    const uid=a.id+":"+t.title;
    rows.push({artist:a,track:t,uid,plays:t.plays+(S.plays[uid]||0)*137,
      move:(hash(uid)%7)-3,isNew:hash(uid)%9===0});
  }));
  ALLBANDS().forEach(b=>bandTracks(b).forEach(t=>{
    if(mediaVis(t)!=="public")return;
    const uid=b.id+":"+t.title;
    rows.push({artist:{id:b.id,name:b.name,band:true},track:t,uid,
      plays:(t.plays||0)+(S.plays[uid]||0)*137,move:(hash(uid)%5)-2,isNew:hash(uid)%7===0});
  }));
  const mine=(S.me.tracks||[]).map(t=>({artist:S.me,track:t,uid:"me:"+t.title,
    plays:t.plays+(S.plays["me:"+t.title]||0)*137,move:2,isNew:true,me:true}));
  const all=[...rows,...mine].sort((x,y)=>y.plays-x.plays);
  if(lbTab==="new")return all.filter(r=>r.isNew||r.me).slice(0,10);
  if(lbTab==="near")return all.filter(r=>r.me||r.artist.dist<900).slice(0,10);
  return all.slice(0,10);
}
function renderRadio(){
  const r=$("#radio");r.innerHTML="";
  const chart=chartData(),top=chart[0];

  /* An empty chart is the correct chart when nobody has uploaded anything
     yet. It used to show invented tracks instead, under a banner reading
     "2,140 LISTENING" when the true number was nobody. */
  if(!top){
    if(LIVE&&LIVECHART===null){
      r.appendChild(el("div","empty",`<p style="font-size:13.5px">Loading the chart…</p>`));
      /* and if it is still loading in eight seconds, say something true
         instead of leaving the word "Loading" on the screen for good */
      clearTimeout(chartStall);
      chartStall=setTimeout(()=>{
        if(LIVECHART===null&&$("#v-radio")&&$("#v-radio").classList.contains("on")){
          const host=$("#radio");if(!host)return;
          host.innerHTML="";
          host.appendChild(el("div","empty",
            `<h3>Can't reach the chart</h3><p>Check your connection and try again.</p>`));
          const again=el("button","btn ghost","Try again");
          again.style.cssText="width:calc(100% - 32px);margin:0 16px";
          again.onclick=()=>{LIVECHART=null;renderRadio();loadChart()};
          host.appendChild(again);
        }
      },8000);
      return;
    }
    r.appendChild(el("div","empty",
      `<h3>Nothing on the chart yet</h3>
       <p>The chart is built from what people actually play. Put a recording on your profile and it can land here — every play from Jammy Radio or someone's profile counts.</p>`));
    const up=el("button","btn","Upload a track");
    up.style.cssText="width:calc(100% - 32px);margin:0 16px";
    up.onclick=()=>openUpload();
    r.appendChild(up);
    return;
  }

  const np=el("div","nowplaying");
  /* the real number of people listening right now, even when it is one */
  const listening=LIVE
    ? (LIVELISTENERS===1?"1 LISTENING":LIVELISTENERS+" LISTENING")
    : "2,140 LISTENING";
  np.innerHTML=`<div class="art">${art(hash(top.uid),"",{k:"np"})}
      <div class="lbl"><span class="live"></span>JAMMY RADIO · ${esc(listening)}</div></div>
    <div class="bot"><div class="t"><h3>${esc(top.track.title)}</h3><span>${esc(top.artist.name)} · ${esc(top.track.key)} · ${top.track.bpm} bpm</span></div>
      <button class="pbtn" style="width:46px;height:46px" data-play="${esc(top.uid)}" data-rplay="0">${nowPlaying===top.uid?ICON_PAUSE:ICON_PLAY}</button></div>`;
  r.appendChild(np);
  const pills=el("div","pills");
  [["week","Most played"],["new","New this week"],["near","Near you"]].forEach(([k,label])=>{
    const b=el("button","pill"+(lbTab===k?" on":""),label);
    b.onclick=()=>{lbTab=k;renderRadio()};pills.appendChild(b);
  });
  r.appendChild(pills);

  const movement=row=>row.isNew?`<span class="mv new">NEW</span>`
    :row.move>0?`<span class="mv up">▲ ${row.move}</span>`
    :row.move<0?`<span class="mv dn">▼ ${-row.move}</span>`
    :`<span class="mv dn">—</span>`;

  /* The top three, set apart. They used to be three ordinary rows with a
     differently coloured numeral, which is not something anyone notices. */
  const podium=chart.slice(0,3), rest=chart.slice(3);
  const PLACE=["1st","2nd","3rd"];

  r.appendChild(el("div","sechead",
    `<h2>${podium.length===1?"Top this week":"Top "+podium.length+" this week"}</h2>
     <span class="more">Resets Sunday</span>`));

  const pod=el("div","podium");
  podium.forEach((row,i)=>{
    const b=el("button","podrow p"+(i+1)+(row.me?" me":""));
    b.innerHTML=`<span class="place">${PLACE[i]}</span>
      <div class="cov">${art(hash(row.uid),"",{k:"lb"})}</div>
      <div class="t"><b>${esc(row.track.title)}</b>
        <span>${esc(row.artist.name)}</span>
        <span class="n">${nfmt(row.plays)} ${row.plays===1?"play":"plays"}${row.listeners?" · "+nfmt(row.listeners)+(row.listeners===1?" listener":" listeners"):""}</span></div>
      ${movement(row)}
      <span class="pb">${nowPlaying===row.uid?ICON_PAUSE:ICON_PLAY}</span>`;
    b.onclick=()=>play(row.track,row.artist);
    pod.appendChild(b);
  });
  r.appendChild(pod);

  if(rest.length){
    r.appendChild(el("div","sechead",
      `<h2>${rest.length===1?"Fourth":"4 to "+chart.length}</h2>`));
    const list=el("div");
    rest.forEach((row,i)=>{
      const b=el("button","lbrow"+(row.me?" me":""));
      b.innerHTML=`<span class="rank">${i+4}</span><div class="cov">${art(hash(row.uid),"",{k:"lb"})}</div>
        <div class="t"><b>${esc(row.track.title)}</b><span>${esc(row.artist.name)} · ${nfmt(row.plays)} plays</span></div>${movement(row)}`;
      b.onclick=()=>play(row.track,row.artist);
      list.appendChild(b);
    });
    r.appendChild(list);
  }

  renderNewArtist(r);

  const note=el("div","empty",`<p style="font-size:13px">A play counts after fifteen seconds, once per person per track per day. Every listen you give someone moves them up.</p>`);
  r.appendChild(note);
  np.querySelector("[data-rplay]").onclick=()=>play(top.track,top.artist);
}

/* ============ chats ============ */
function threadOf(id){return S.threads[id]||[]}

/* ============ live messaging ============
   The app keys every conversation by the person (or band) it's with,
   because that's what the screens already use. The database keys them by
   its own conversation id. CONVOID is the bridge between the two. */
let LIVECONVOS=[],CONVOID={},msgChannel=null,msgWatchingId=null;

/* People who have asked to play with you and are waiting on an answer.
   Before this existed a connection could only happen by coincidence —
   both people swiping yes without either knowing the other had. */
let REQUESTS=[];
async function loadRequests(){

}

/* People waiting to join a band you run, across all your bands. */
let BANDREQS=[];
async function loadBandRequests(){

async function answerBandJoin(q,yes){

async function answerRequest(id,yes){
  const p=A(id);
  REQUESTS=REQUESTS.filter(x=>x.id!==id);
  renderChats();updateBadge();
  const r=await DB.swipe(id,yes?"yes":"no");
  if(r.error){
    toast(authMessage(r.error));
    loadRequests();
    return;
  }
  if(!yes){toast("Declined");return}
  const row=Array.isArray(r.data)?r.data[0]:r.data;
  if(row&&(row.matched||row.is_match)){
    if(!connected(id))S.connections.unshift(id);
    save();loadConvos();
    toast("Connected with "+((p&&p.name.split(" ")[0])||"them"));
  }
}

function dbRowToMsg(m){
  const mine=!!(S.me&&m.sender_id===S.me.id);
  return m.clip_path
    ? {f:mine?"me":m.sender_id,kind:"audio",clipId:"srv:"+m.clip_path,
       dur:Math.round((m.clip_duration_ms||0)/1000),label:m.clip_label||"Jam clip",
       peaks:m.clip_peaks||null,at:m.created_at,id:m.id}
    : {f:mine?"me":m.sender_id,t:m.body||"",at:m.created_at,id:m.id};
}

/* Pull the message list. This also rebuilds who you're connected to, since
   a match always creates a conversation — they're the same fact. */
let convosFailed=false;
async function loadConvos(){
  if(!LIVE)return;
  const r=await DB.convos();
  if(r.error){
    /* This used to return in silence, so a person whose messages failed
       to load was shown an empty Chats tab and told nothing. Somebody
       waiting to hear back from a drummer would decide they had been
       ignored. */
    convosFailed=true;renderChats();return;
  }
  convosFailed=false;
  LIVECONVOS=r.data||[];
  CONVOID={};
  const seen=[];
  S.connections=[];
  LIVECONVOS.forEach(row=>{
    const key=row.kind==="band"?row.band_id:row.other_id;
    if(!key)return;
    CONVOID[key]=row.conversation_id;
    if(row.kind==="dm"){
      S.connections.push(row.other_id);
      seen.push(rowToArtist({id:row.other_id,display_name:row.other_name,
        handle:row.other_handle,city:row.other_city,photo_path:row.other_photo,
        instruments:[],genres:[]}));
    }
    if(row.unread>0)S.unread[key]=row.unread;else delete S.unread[key];
  });
  remember(seen);

  /* Clear out what the server no longer has.

     When somebody removes you as a connection, the server drops the
     conversation for both of you — but this device kept its own copy of
     the messages in S.threads and went on showing them. The person on
     the other end reported still being connected and still having the
     thread, and this is why: nothing here ever threw anything away.

     Anything cached for a DM the server no longer lists goes now. Band
     threads are left alone: they come and go with band membership, which
     is a different thing. */
  const live=new Set(LIVECONVOS.map(r=>r.kind==="band"?r.band_id:r.other_id).filter(Boolean));
  const bandKeys=new Set(myBandList().map(b=>b.id));
  let dropped=[];
  Object.keys(S.threads||{}).forEach(key=>{
    if(live.has(key)||bandKeys.has(key))return;
    delete S.threads[key];delete S.unread[key];
    dropped.push(key);
  });
  (S.connections||[]).forEach(()=>{});          /* already rebuilt above */

  /* If they were reading the conversation that just vanished, take them
     out of it rather than leaving them typing into nothing. */
  if(chatId&&!isBand&&dropped.includes(chatId)){
    chatId=null;stopWatchingThread();
    $("#chat").classList.remove("on");
    toast("That connection has ended");
  }

  save();updateBadge();renderChats();
}

/* The conversation id for a screen, fetched once and remembered. */
let convoWhy=null;
async function convoIdFor(key,band){
  convoWhy=null;
  if(CONVOID[key])return CONVOID[key];
  const r=band?await DB.bandConvo(key):await DB.dmWith(key);
  if(r.error){
    convoWhy=(r.error.message||r.error.details||"")+"";
    /* the one that actually happens: the match exists on your phone but
       never got written on the server */
    if(/not connected/i.test(convoWhy))
      convoWhy="You and this person aren't connected on the server yet — the match didn't save.";
    return null;
  }
  if(!r.data)return null;
  const id=Array.isArray(r.data)?r.data[0]:r.data;
  CONVOID[key]=id;
  return id;
}

async function loadThread(key,band){
  const cid=await convoIdFor(key,band);
  if(!cid){toast("Couldn't open that conversation");return}
  const r=await DB.thread(cid);
  if(r.error){toast("Couldn't load messages");return}
  /* messages_page returns newest first; the screen reads oldest first */
  S.threads[key]=(r.data||[]).slice().reverse().map(dbRowToMsg);
  save();
  if(chatId===key)renderMsgs();
  DB.markRead(cid);
  watchThread(key,cid);
}

function watchThread(key,cid){
  if(msgWatchingId===cid)return;
  stopWatchingThread();
  msgWatchingId=cid;
  msgChannel=DB.watchThread(cid,m=>{
    const list=S.threads[key]||(S.threads[key]=[]);
    if(list.some(x=>x.id&&x.id===m.id))return;      /* already have it */
    const mapped=dbRowToMsg(m);
    /* our own message is already on screen, sent optimistically */
    if(mapped.f==="me"){
      const pending=list.find(x=>!x.id&&x.t===mapped.t);
      if(pending){pending.id=mapped.id;pending.at=mapped.at;save();return}
    }
    list.push(mapped);save();
    if(chatId===key){renderMsgs();DB.markRead(cid)}
    else{S.unread[key]=(S.unread[key]||0)+1;save();updateBadge();renderChats()}
  });
}
function stopWatchingThread(){
  if(msgChannel){try{DB.stopThread(msgChannel)}catch(e){}}
  msgChannel=null;msgWatchingId=null;
}
function renderChats(){
  const c=$("#chats");c.innerHTML="";

  if(LIVE&&convosFailed){
    const warn=el("div","empty",
      `<h3>Can't reach your messages</h3>
       <p>Your conversations are safe — this device just couldn't load them. It isn't that nobody has written.</p>`);
    c.appendChild(warn);
    const again=el("button","btn ghost","Try again");
    again.style.cssText="width:calc(100% - 32px);margin:0 16px 8px";
    again.onclick=()=>{convosFailed=false;renderChats();loadConvos()};
    c.appendChild(again);
  }

  if(LIVE&&REQUESTS.length){
    c.appendChild(el("div","sechead",
      `<h2>Requests</h2><span class="reqn">${REQUESTS.length}</span>`));
    REQUESTS.forEach(p=>{
      const row=el("div","reqrow");
      row.innerHTML=`<div class="av" style="width:52px;height:52px">${avatarOf(p)}</div>
        <div class="t"><b>${esc(p.name)}</b><span>${esc([p.role,p.city].filter(Boolean).join(" · "))}</span></div>
        <div class="ra">
          <button class="rbtn pass" data-req-no="${p.id}" aria-label="Decline ${esc(p.name)}">Decline</button>
          <button class="rbtn yes" data-req-yes="${p.id}" aria-label="Approve ${esc(p.name)}">Approve</button>
        </div>`;
      /* Wire these here rather than relying on the page-wide click handler,
         which listens on the feed and never sees a click in Chats. */
      row.querySelector("[data-req-yes]").onclick=ev=>{
        ev.preventDefault();ev.stopPropagation();answerRequest(p.id,true);
      };
      row.querySelector("[data-req-no]").onclick=ev=>{
        ev.preventDefault();ev.stopPropagation();answerRequest(p.id,false);
      };
      c.appendChild(row);
    });
  }

  /* Somebody asking to join a band you run is the same kind of thing as
     somebody asking to connect, so it belongs in the same place. */
  if(LIVE&&BANDREQS.length){
    c.appendChild(el("div","sechead",
      `<h2>Wants to join your band</h2><span class="reqn">${BANDREQS.length}</span>`));
    BANDREQS.forEach(q=>{
      const row=el("div","reqrow");
      row.innerHTML=`<div class="av" style="width:52px;height:52px">${art(hash(q.userId),initials(q.name),{size:52})}</div>
        <div class="t"><b>${esc(q.name)}</b>
          <span>${esc([q.plays,q.band].filter(Boolean).join(" · "))}</span>
          ${q.note?`<span style="opacity:.75">“${esc(q.note)}”</span>`:""}</div>
        <div class="ra">
          <button class="rbtn pass" data-bq-no="${q.id}" aria-label="Decline ${esc(q.name)}">Decline</button>
          <button class="rbtn yes" data-bq-yes="${q.id}" aria-label="Approve ${esc(q.name)}">Approve</button>
        </div>`;
      row.querySelector("[data-bq-yes]").onclick=ev=>{
        ev.preventDefault();ev.stopPropagation();answerBandJoin(q,true);
      };
      row.querySelector("[data-bq-no]").onclick=ev=>{
        ev.preventDefault();ev.stopPropagation();answerBandJoin(q,false);
      };
      c.appendChild(row);
    });
  }

  c.appendChild(el("div","sechead",`<h2>Bands</h2>`));
  /* Band chats come from the server now (LIVECONVOS carries them), so
     live mode lists real bands. The four written-in demo bands below are
     for the signed-out demo only: showing them to someone with a real
     account would be a lie about who they play with. */
  if(LIVE){
    const liveBands=LIVECONVOS.filter(r=>r.kind==="band");
    if(!liveBands.length){
      c.appendChild(el("div","empty",`<h3>No bands yet</h3><p>Start one from your profile, or ask to join one from a gig. Every band gets its own group chat, and it shows up here.</p>`));
    }else{

let chatId=null,isBand=false;
function openChat(id,band){
  if(!id)return;chatId=id;isBand=!!band;
  delete S.unread[id];save();updateBadge();renderChats();
  if(LIVE){
    /* Show whatever we already have, then fetch. Opening a conversation
       should never be a blank screen waiting on the network. */
    loadThread(id,!!band);
    if(band){
      const r=LIVECONVOS.find(x=>x.band_id===id);
      $("#ch-av").innerHTML=`<span class="ph">${esc(initials((r&&r.band_name)||"Band"))}</span>`;
      $("#ch-name").textContent=(r&&r.band_name)||"Band";
      $("#ch-sub").textContent="Band chat";
      msgShown=MSG_WINDOW;renderMsgs();
      stopClip();if(rec.mr)cancelRecording();
      $("#ch-input").value="";$("#ch-send").hidden=true;$("#ch-mic").hidden=false;
      $("#chat").classList.add("on");
      return;
    }
  }
  /* The other side may be gone — account deleted, or a conversation
     opened from a notification before the profile has loaded. The
     messages are still yours to read, so open the thread with a
     placeholder rather than throwing and leaving the tap dead. */
  if(band){
    const b=Bnd(id);
    $("#ch-av").innerHTML=b?avatarOf(A(b.members[0])):`<span class="ph">${esc(initials("Band"))}</span>`;
    $("#ch-name").textContent=b?b.name:"Band";
    $("#ch-sub").textContent=b?b.about:"Band chat";
  }else{
    const p=A(id);
    $("#ch-av").innerHTML=p?avatarOf(p):`<span class="ph">${esc(initials("?"))}</span>`;
    $("#ch-name").textContent=p?p.name:"Someone";
    $("#ch-sub").textContent=p?(p.role+" · "+p.city):"This person is no longer on Jammy";
  }
  msgShown=MSG_WINDOW;
  renderMsgs();
  stopClip();if(rec.mr)cancelRecording();
  $("#ch-input").value="";$("#ch-send").hidden=true;$("#ch-mic").hidden=false;
  $("#chat").classList.add("on");
}
const MSG_WINDOW=60;
let msgShown=MSG_WINDOW;
function renderMsgs(){
  const box=$("#ch-msgs");box.innerHTML="";
  const all=threadOf(chatId);
  /* only ever build the tail of the thread. a 5,000-message band chat would
     otherwise rebuild 5,000 nodes on every keystroke-send and lock the phone. */
  const start=Math.max(0,all.length-msgShown);
  if(start>0){
    const more=el("button","loadmore",`Load earlier messages · ${start} above`);
    more.onclick=()=>{msgShown+=MSG_WINDOW;renderMsgs();};
    box.appendChild(more);
  }
  if(isBand&&start===0)box.appendChild(el("div","msg sys","Band chat · everything here is shared with all members"));
  all.slice(start).forEach(m=>{
    const who=m.f==="me"?null:A(m.f);
    const d=el("div","msg "+(m.f==="me"?"me":"them"));
    if(m.kind==="audio"){
      d.classList.add("clipmsg");
      d.innerHTML=(isBand&&who?`<span class="who">${esc(who.name.split(" ")[0])}</span>`:"")+
        `<div class="cliprow">
          <button class="cplay" data-clip="${esc(m.clipId)}" aria-label="Play clip">${clipPlayingId===m.clipId?ICON_PAUSE:ICON_PLAY}</button>
          ${clipWave(m.clipId,m.peaks)}
          <span class="cdur">${mmss(m.dur)}</span>
        </div>
        <span class="cliplab">${esc(m.label||"Jam clip")}${m.size?" · "+Math.max(1,Math.round(m.size/1024))+" KB":""}</span>`;
      const btn=d.querySelector(".cplay");
      btn.onclick=()=>playClip(m.clipId,btn,d.querySelector(".cwave"));
      box.appendChild(d);
      return;
    }
    if(m.sending)d.classList.add("sending");
    if(m.failed)d.classList.add("failed");
    if(m.failed){
      /* Retrying must not need a finger. A bubble with an onclick and
         nothing else is invisible to a keyboard and silent to a screen
         reader, so the only people who could resend a failed message
         were the ones using a mouse or a touchscreen. */
      d.title="Tap to try again";
      d.setAttribute("role","button");
      d.setAttribute("tabindex","0");
      d.setAttribute("aria-label","Message not sent"+(m.why?": "+m.why:"")+". Press to try again.");
      const retry=()=>{
        const list=S.threads[chatId]||[];
        const i=list.indexOf(m);if(i>-1)list.splice(i,1);
        save();renderMsgs();sendMsg(m.t,m.attach);
      };
      d.onclick=retry;
      d.onkeydown=e=>{
        if(e.key==="Enter"||e.key===" "||e.key==="Spacebar"){e.preventDefault();retry()}
      };
    }
    d.innerHTML=(isBand&&who?`<span class="who">${esc(who.name.split(" ")[0])}</span>`:"")+esc(m.t)+
      (m.sending?'<span class="mstate">sending…</span>':"")+
      (m.failed?'<span class="mstate">not sent · tap to retry</span>'+
        (m.why?'<span class="mwhy">'+esc(m.why)+'</span>':""):"")+
      (m.attach?`<div class="attach"><div class="cov">${art(hash(m.attach),"",{k:"at"})}</div>
        <div style="flex:1;min-width:0"><b style="display:block;font-size:13px">${esc(m.attach)}</b><span style="font-size:11px;opacity:.8">Track · tap to play</span></div>
        <div class="pbtn" style="width:28px;height:28px">${ICON_PLAY}</div></div>`:"");
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}
$("#ch-back").onclick=()=>{if(rec.mr)cancelRecording();stopClip();stopWatchingThread();
  $("#chat").classList.remove("on");chatId=null;if(LIVE)loadConvos()};
function sendMsg(text,attach){
  if(!chatId)return;
  S.threads[chatId]=S.threads[chatId]||[];

  if(LIVE){
    const key=chatId;
    const pending={f:"me",t:text,attach,sending:true};
    S.threads[key].push(pending);save();renderMsgs();
    (async()=>{
      const cid=await convoIdFor(key,isBand);
      if(!cid){
        pending.failed=true;delete pending.sending;
        pending.why=convoWhy||"Jammy couldn't find a conversation with this person.";
        save();renderMsgs();return;
      }
      const r=await DB.sendText(cid,text);
      delete pending.sending;
      if(r.error){
        pending.failed=true;
        pending.why=(r.error&&(r.error.message||r.error.details))||"The server refused it.";
        save();renderMsgs();
        return;
      }
      delete pending.why;
      if(r.data&&r.data.id){pending.id=r.data.id;pending.at=r.data.created_at}
      save();renderMsgs();
    })();
    return;
  }

  S.threads[chatId].push({f:"me",t:text,attach});save();renderMsgs();
  const id=chatId,band=isBand;
  const box=$("#ch-msgs"),responder=band?(bandMembers(Bnd(id)).filter(m=>m.p).map(m=>m.p)[0]||A("a1")):A(id);
  const typ=el("div","typing",`${responder.name.split(" ")[0]} is typing…`);
  box.appendChild(typ);box.scrollTop=box.scrollHeight;
  setTimeout(()=>{
    const used=(S.threads[id]||[]).filter(m=>m.f!=="me").length;
    const r=responder.replies[used%responder.replies.length];
    S.threads[id].push({f:band?responder.id:"them",t:r});save();
    if(chatId===id)renderMsgs();else{S.unread[id]=1;save();updateBadge();renderChats()}
  },1000+Math.random()*900);
}

/* ============ video call ============ */
/* Video calling was removed on 22 November 2026, at Stella's request.

   What stood here opened your own camera, drew the other people as
   generated artwork, moved a "speaking" ring between them on a timer and
   reported a round-trip time of 38 ms that was typed into the page. It
   never contacted anybody: no WebRTC, no signalling, no server. Pressing
   call did nothing on the other person's phone.

   Jam clips are the honest version of the same idea and they are real: you
   hold the microphone in a message, play something, and it arrives as a
   recording. */

/* ============ profile sheet ============ */

/* ------------------------------------------------------------
   The two menus behind a profile.

   Disconnect used to be a row of equal-looking grey buttons at the
   bottom of the sheet, and the first person to use Jammy said it was
   not clear how to remove somebody. It wasn't: nothing on screen said
   "you are connected to this person", so there was nothing obvious to
   press to stop being.

   So the relationship is now the button. It reads "Connected", the way
   Facebook's reads "Friends", and tapping the thing that describes the
   relationship is where you end it. Blocking and reporting live behind
   the separate "..." button, because blocking someone and parting ways
   with them are different acts and should not sit side by side looking
   identical.
   ------------------------------------------------------------ */
function menuSheet(title, sub, rows){
  const b=$("#sheetbody");
  b.innerHTML=`<div class="grabber"></div>
    <h2 style="font-size:19px;margin:6px 0 ${sub?"4px":"14px"}">${esc(title)}</h2>
    ${sub?`<p class="dimtext" style="font-size:13.5px;margin:0 0 14px">${esc(sub)}</p>`:""}
    ${rows.map((r,i)=>`<button class="menurow${r.danger?" danger":""}" data-row="${i}">
        <span class="mi">${r.icon||""}</span>
        <span class="mt"><b>${esc(r.label)}</b>${r.note?`<span>${esc(r.note)}</span>`:""}</span>
      </button>`).join("")}
    <button class="btn ghost" id="menu-cancel" style="width:100%;margin-top:10px">Cancel</button>`;
  $("#sheet").classList.add("on");
  b.querySelectorAll("[data-row]").forEach(el=>el.onclick=()=>rows[+el.dataset.row].go());
  $("#menu-cancel").onclick=()=>$("#sheet").classList.remove("on");
}

/* ONE menu for a person, reachable from everywhere they appear: their
   profile, the connections list, and their row in Messages.

   The first version split this in two — relationship actions behind the
   "Connected" button, blocking behind "...". That was Facebook's shape,
   but it meant you had to already know which of the two held the thing
   you wanted. Same menu everywhere, holding everything, is clearer than
   a tidier arrangement you have to learn. */
function personMenu(p, opts){
  opts=opts||{};
  const first=p.name.split(" ")[0];
  const rows=[];
  const close=()=>$("#sheet").classList.remove("on");

  if(connected(p.id)){
    rows.push({label:"Message "+first, icon:ICON_CHAT,
      go:()=>{close();go("chats");openChat(p.id)}});
    rows.push({label:"Send a jam clip", icon:ICON_MIC,
      go:()=>{close();go("chats");openChat(p.id);setTimeout(startRecording,420)}});
  }
  if(!opts.fromProfile){
    rows.push({label:"View profile", icon:ICON_PERSON,
      go:()=>{close();setTimeout(()=>openProfile(p.id),120)}});
  }
  if(connected(p.id)){
    rows.push({label:"Remove connection",
      note:"Ends it for both of you. We don't notify them.",
      icon:ICON_UNLINK, danger:true, go:()=>confirmDisconnect(p)});
  }
  rows.push({label:"Block "+first,
    note:"They can't see you or reach you. We don't notify them.",
    icon:ICON_BLOCK, danger:true, go:()=>confirmBlock(p)});
  rows.push({label:"Report "+first, note:"Sent to us and read by a person",
    icon:ICON_FLAG, danger:true, go:()=>openReport(p.id)});

  menuSheet(p.name, connected(p.id)?"You're connected":null, rows);
}

/* Blocking on its own, without filling in a report first. Someone who
   wants a person gone should not have to explain themselves to anybody
   to make that happen. Reporting is still there, separately, for when
   they want us to know. */
function confirmBlock(p){
  const first=p.name.split(" ")[0];
  const b=$("#sheetbody");
  b.innerHTML=`<div class="grabber"></div>
    <h2 style="font-size:20px;margin:6px 0 8px">Block ${esc(p.name)}?</h2>
    <p class="dimtext" style="font-size:14px;line-height:1.55;margin:0 0 6px">
      ${esc(first)} won't be able to find you, see anything you post, or message
      you. You won't see them either. We don't notify ${esc(first)}, though
      they may notice you've gone.</p>
    <p class="dimtext" style="font-size:14px;line-height:1.55;margin:0 0 16px">
      If you're connected, that ends too. You can undo this in Settings,
      under Account and safety.</p>
    <button class="btn" id="bl-no" style="width:100%">Cancel</button>
    <button class="btn ghost" id="bl-yes" style="width:100%;margin-top:8px">Block ${esc(first)}</button>
    <button class="btn ghost" id="bl-report" style="width:100%;margin-top:8px">Block and report them</button>`;
  $("#sheet").classList.add("on");
  $("#bl-no").onclick=()=>$("#sheet").classList.remove("on");
  $("#bl-report").onclick=()=>openReport(p.id);
  $("#bl-yes").onclick=async()=>{
    const btn=$("#bl-yes");btn.disabled=true;btn.textContent="Blocking…";
    const ok=await blockUser(p.id,null,"");
    if(!ok){btn.disabled=false;btn.textContent="Block "+first;return}
    $("#sheet").classList.remove("on");
    if(chatId===p.id){chatId=null;$("#chat").classList.remove("on")}
    refreshDiscover();renderFeed();renderChats();renderYou();updateBadge();
    toast(first+" blocked");
  };
}

/* Leaving a connection.

   Until the first person used Jammy there was no way out of one. Blocking
   existed, but blocking is for somebody who frightens you, and most people
   who want out just played together once and it did not work. Making them
   block a person to do that is a bad choice to force on anyone.

   The confirmation is in the page rather than a confirm() dialog, which
   never appears in some phone browsers and would make the button look
   broken. */
function confirmDisconnect(p){
  const b=$("#sheetbody");
  b.innerHTML=`<div class="grabber"></div>
    <h2 style="font-size:20px;margin:6px 0 8px">Disconnect from ${esc(p.name.split(" ")[0])}?</h2>
    <p class="dimtext" style="font-size:14px;line-height:1.55;margin:0 0 6px">
      You'll both drop out of each other's connections, and your conversation
      disappears for both of you. That part can't be undone.</p>
    <p class="dimtext" style="font-size:14px;line-height:1.55;margin:0 0 16px">
      We don't notify ${esc(p.name.split(" ")[0])}, though they may notice
      the connection has gone. You'll each show up in the
      other's Discover again, so you can connect later if you both want to —
      but you'd be starting the conversation over.</p>
    <button class="btn" id="dc-no" style="width:100%">Keep the connection</button>
    <button class="btn ghost" id="dc-yes" style="width:100%;margin-top:8px">Disconnect</button>`;
  $("#sheet").classList.add("on");
  $("#dc-no").onclick=()=>$("#sheet").classList.remove("on");
  $("#dc-yes").onclick=async()=>{
    const btn=$("#dc-yes");btn.disabled=true;btn.textContent="Disconnecting…";
    if(LIVE){
      const r=await DB.disconnect(p.id);
      if(r&&r.error){
        btn.disabled=false;btn.textContent="Disconnect";
        toast(authMessage(r.error));return;
      }
    }
    /* drop it locally too, so the screen is right before any reload */
    S.connections=(S.connections||[]).filter(id=>id!==p.id);
    delete S.threads[p.id];delete S.unread[p.id];
    if(LIVE){LIVECONVOS=(LIVECONVOS||[]).filter(c=>c.other_id!==p.id)}
    save();
    $("#sheet").classList.remove("on");
    if(chatId===p.id){chatId=null;$("#chat").classList.remove("on")}
    renderChats();updateBadge();refreshDiscover();
    toast("Disconnected");
    if(LIVE){loadConvos();loadDeckSoon()}
  };
}

/* The signed-out demo has nothing on a server to delete, so the button
   says what it actually does there. */
function clearThisDevice(quiet){
  try{localStorage.removeItem(KEY)}catch(e){}
  S=freshState();S.firstRun=false;
  LIVEPOSTS=[];LIVEBANDS=[];OTHERBANDS=[];BANDREQS=[];REQUESTS=[];
  feedCursor=null;feedCursorId=null;feedEnd=false;
  save();renderAll();signOut();
  if(!quiet)toast("Cleared this device");
}

async function exportMyData(btn){
  if(btn){btn.disabled=true;btn.textContent="Gathering…"}
  const r=await DB.exportMyData();
  if(btn){btn.disabled=false;btn.textContent="Download my data"}
  if(r.error)return toast(authMessage(r.error));
  const name="jammy-my-data-"+new Date().toISOString().slice(0,10)+".json";
  const text=JSON.stringify(r.data,null,2);
  /* Some app views have no Blob URLs. A data: URL downloads just as well,
     and this is the only path, so there is no branch to get wrong. */
  const url="data:application/json;charset=utf-8,"+encodeURIComponent(text);
  const a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  toast("Saved "+name);
}

/* Deleting cannot be undone, so it asks in the page and makes you type the
   word — the same word the database insists on. A confirm() dialog is no
   good here: several browsers and the artifact viewer never show one, and
   a confirmation that silently returns false is a Delete button that does

      <li>Messages you already sent stay in the other person's conversation, the way a sent text does.</li>
      <li>You can download everything first — the button above this one.</li>
    </ul>
    <div class="field"><label>Type <b>delete</b> to confirm</label>
      <input id="da-word" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="delete"></div>
    <button class="btn" id="da-go" style="width:100%;margin-top:4px;background:#E5285C">Delete my account</button>
    <button class="btn ghost" id="da-no" style="width:100%;margin-top:9px">Keep my account</button>`;
  $("#sheet").classList.add("on");
  $("#da-no").onclick=()=>$("#sheet").classList.remove("on");
  $("#da-go").onclick=async()=>{

    const go=$("#da-go");go.disabled=true;go.textContent="Deleting…";

/* Taking a recording down cannot be undone, so it asks first — in the row
   itself. confirm() is no good here: the artifact viewer and some phone
   browsers never show one, and a confirmation that silently returns false
   is a button that quietly does nothing. */
function confirmRemoveTrack(track,row){
  const old=row.innerHTML;
  row.innerHTML="";
  const wrap=el("div");wrap.style.cssText="flex:1;min-width:0";
  wrap.appendChild(el("div","",`Take <b>${esc(track.title)}</b> off your profile and the radio?`));
  const note=el("div","");note.style.cssText="font-size:12px;color:var(--dim);margin-top:3px";
  note.textContent="The recording is deleted and its plays go with it. This can't be undone.";
  wrap.appendChild(note);
  const acts=el("div");acts.style.cssText="display:flex;gap:8px;margin-top:9px";
  const yes=el("button","btn","Remove");yes.style.cssText="padding:8px 13px;font-size:13px;background:#E5285C";
  const no=el("button","btn ghost","Keep it");no.style.cssText="padding:8px 13px;font-size:13px";
  yes.setAttribute("data-rmtrack-yes",track.id);
  no.onclick=()=>{row.innerHTML=old;renderYou()};
  yes.onclick=async()=>{
    yes.disabled=true;no.disabled=true;yes.textContent="Removing…";
    const r=await DB.removeTrack(track.id);
    if(r.error){yes.disabled=false;no.disabled=false;yes.textContent="Remove";
      toast(authMessage(r.error));return}
    if(nowPlaying===trackUid(track,S.me))stopAudio();
    await loadMyTracks();
    renderYou();loadChart();loadRising();
    toast(track.title+" removed");
  };
  acts.appendChild(yes);acts.appendChild(no);wrap.appendChild(acts);
  row.appendChild(wrap);
}

/* How long a recording is, read from the file itself rather than asked for.
   Returns null when the browser cannot tell, which is fine — it is only
   used to show a length. */
function audioDuration(file){
  return new Promise(res=>{
    try{
      const a=new Audio(), u=URL.createObjectURL(file);
      const done=v=>{try{URL.revokeObjectURL(u)}catch(e){}res(v)};
      a.onloadedmetadata=()=>done(isFinite(a.duration)?Math.round(a.duration*1000):null);
      a.onerror=()=>done(null);
      setTimeout(()=>done(null),5000);
      a.src=u;
    }catch(e){res(null)}
  });
}

/* ---------- jam clips: record, store, play ----------
   Audio blobs go in IndexedDB — localStorage would blow its quota on one clip.
   Recording uses music-grade constraints: no noise suppression, no auto gain,
   no echo cancellation. Speech processing destroys cymbals and sustained notes. */
let idbP=null;
function idb(){
  if(idbP)return idbP;
  idbP=new Promise((res,rej)=>{
    try{
      const r=indexedDB.open("jammy-clips",1);
      r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("clips"))db.createObjectStore("clips")};
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    }catch(e){rej(e)}
  });
  return idbP;
}
async function clipPut(id,blob){
  try{const db=await idb();return new Promise((res,rej)=>{
    const tx=db.transaction("clips","readwrite");
    tx.objectStore("clips").put(blob,id);
    tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);
  })}catch(e){return false}
}
async function clipGet(id){
  try{const db=await idb();return new Promise((res)=>{
    const tx=db.transaction("clips","readonly");
    const q=tx.objectStore("clips").get(id);
    q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);
  })}catch(e){return null}
}

const urlCache={};
async function clipURL(id){
  if(urlCache[id])return urlCache[id];
  const b=await clipGet(id);
  if(!b)return null;
  urlCache[id]=URL.createObjectURL(b);
  return urlCache[id];
}
let clipAudio=null,clipPlayingId=null,clipRaf=null;
/* Signed links last an hour, so one is kept only for that long. */
const clipLinks={};
async function clipSource(id){
  if(String(id).startsWith("srv:")){
    const path=String(id).slice(4);
    const hit=clipLinks[path];
    if(hit&&hit.until>Date.now())return hit.url;
    const r=await DB.clipUrl(path);
    if(r.error||!r.data)return null;
    const url=r.data.signedUrl||r.data.signedURL||r.data;
    clipLinks[path]={url,until:Date.now()+50*60*1000};
    return url;
  }
  return clipURL(id);
}

async function playClip(id,btn,waveEl){
  if(clipPlayingId===id){stopClip();return}
  stopClip();stopAudio();
  /* "srv:<path>" is a clip that lives in storage rather than on this phone.
     It is fetched as a short-lived signed link, never a permanent public
     one: if the sender is blocked or leaves the conversation afterwards, a
     fresh link simply is not issued. */
  const u=await clipSource(id);
  if(!u){toast("Couldn't open that clip");return}
  clipAudio=new Audio(u);
  clipPlayingId=id;
  if(btn)btn.innerHTML=ICON_PAUSE;
  clipAudio.onended=()=>stopClip();
  clipAudio.onerror=()=>{toast("Couldn't play that clip");stopClip()};
  try{await clipAudio.play()}catch(e){toast("Tap again to play");stopClip();return}
  const bars=waveEl?[...waveEl.children]:[];
  const frame=()=>{
    if(clipPlayingId!==id||!clipAudio)return;
    const p=clipAudio.duration?clipAudio.currentTime/clipAudio.duration:0;
    bars.forEach((b,i)=>b.classList.toggle("hit",i/bars.length<=p));
    clipRaf=requestAnimationFrame(frame);
  };
  clipRaf=requestAnimationFrame(frame);
}
function stopClip(){
  if(clipRaf)cancelAnimationFrame(clipRaf);clipRaf=null;
  if(clipAudio){clipAudio.pause();clipAudio=null}
  if(clipPlayingId){
    document.querySelectorAll(`[data-clip="${cssEsc(clipPlayingId)}"]`).forEach(b=>b.innerHTML=ICON_PLAY);
    document.querySelectorAll(`[data-clipwave="${cssEsc(clipPlayingId)}"] i`).forEach(b=>b.classList.remove("hit"));
  }
  clipPlayingId=null;
}

/* peaks for a real waveform, decoded from the actual audio */
async function peaksOf(blob,n){
  n=n||34;
  try{
    const ab=await blob.arrayBuffer();
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const buf=await ctx.decodeAudioData(ab.slice(0));
    const ch=buf.getChannelData(0),block=Math.floor(ch.length/n)||1;
    const out=[];
    for(let i=0;i<n;i++){
      let max=0;
      for(let j=i*block;j<(i+1)*block&&j<ch.length;j+=7){const v=Math.abs(ch[j]);if(v>max)max=v}
      out.push(Math.max(0.08,Math.min(1,max)));
    }
    try{ctx.close()}catch(e){}
    return {peaks:out,dur:buf.duration};
  }catch(e){
    return {peaks:Array.from({length:n},(_,i)=>0.25+Math.abs(Math.sin(i*0.7))*0.6),dur:0};
  }
}
function clipWave(id,peaks){
  return `<div class="cwave" data-clipwave="${esc(id)}">${(peaks||[]).map(v=>
    `<i style="height:${Math.round(Math.max(8,v*100))}%"></i>`).join("")}</div>`;
}
const mmss=sec=>{sec=Math.max(0,Math.round(sec||0));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")};

/* ---------- the recorder ---------- */
let rec={mr:null,stream:null,chunks:[],t0:0,timer:null,raf:null,ctx:null};
function recordingUI(on){
  $("#recbar").classList.toggle("on",on);
  document.querySelector("#chat .cbar").style.display=on?"none":"";
}
async function startRecording(){
  if(!navigator.mediaDevices||!window.MediaRecorder){
    toast("Recording isn't supported in this browser");return;
  }
  try{
    rec.stream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false,noiseSuppression:false,autoGainControl:false,
      sampleRate:48000,channelCount:1}});
  }catch(e){
    toast(e&&e.name==="NotAllowedError"?"Microphone permission is off — turn it on in settings":"Couldn't open the microphone");
    return;
  }
  const types=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"];
  const mime=types.find(t=>window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  try{rec.mr=mime?new MediaRecorder(rec.stream,{mimeType:mime,audioBitsPerSecond:128000}):new MediaRecorder(rec.stream)}
  catch(e){toast("Couldn't start recording here");stopStream();return}
  rec.chunks=[];
  rec.mr.ondataavailable=e=>{if(e.data&&e.data.size)rec.chunks.push(e.data)};
  rec.mr.start();
  rec.t0=Date.now();
  recordingUI(true);
  $("#rec-time").textContent="0:00";
  rec.timer=setInterval(()=>{
    const sec=(Date.now()-rec.t0)/1000;
    $("#rec-time").textContent=mmss(sec);
    if(sec>=120)finishRecording(true);   /* hard cap, 2 minutes is plenty for a tone check */
  },250);

  /* live level meter off the real input */
  try{
    rec.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=rec.ctx.createMediaStreamSource(rec.stream);
    const an=rec.ctx.createAnalyser();an.fftSize=512;src.connect(an);
    const data=new Uint8Array(an.frequencyBinCount);
    const meter=$("#rec-meter");
    meter.innerHTML=Array.from({length:22},()=>"<i></i>").join("");
    const bars=[...meter.children];
    const tick=()=>{
      if(!rec.mr)return;
      an.getByteFrequencyData(data);
      bars.forEach((b,i)=>{
        const v=data[Math.floor(i/bars.length*data.length*0.6)]/255;
        b.style.height=Math.max(10,v*100)+"%";
      });
      rec.raf=requestAnimationFrame(tick);
    };
    tick();
  }catch(e){}
}
function stopStream(){
  if(rec.stream){rec.stream.getTracks().forEach(t=>t.stop());rec.stream=null}
  if(rec.timer)clearInterval(rec.timer);rec.timer=null;
  if(rec.raf)cancelAnimationFrame(rec.raf);rec.raf=null;
  if(rec.ctx){try{rec.ctx.close()}catch(e){}rec.ctx=null}
}
function cancelRecording(){
  if(rec.mr){try{rec.mr.onstop=null;rec.mr.stop()}catch(e){}}
  rec.mr=null;rec.chunks=[];stopStream();recordingUI(false);
  toast("Discarded");
}
function finishRecording(auto){
  if(!rec.mr)return;
  const mr=rec.mr;rec.mr=null;
  const secs=(Date.now()-rec.t0)/1000;
  mr.onstop=async()=>{
    stopStream();recordingUI(false);
    if(secs<0.8){toast("Too short — hold it a bit longer");return}
    const blob=new Blob(rec.chunks,{type:mr.mimeType||"audio/webm"});
    rec.chunks=[];
    await sendClip(blob,secs);
    if(auto)toast("Two minutes is the limit — sent");
  };
  try{mr.stop()}catch(e){stopStream();recordingUI(false)}
}
async function sendClip(blob,secs,label){
  if(!chatId)return;
  const {peaks,dur}=await peaksOf(blob);

  /* Signed in, a clip goes to the other person: uploaded to storage, then
     written as a message, the same as any other. It used to stay on this
     phone and be answered by an invented reply — which in a real
     conversation is a message from somebody who never sent it. */
  if(LIVE){
    const mic=$("#ch-mic");
    if(mic)mic.disabled=true;
    const r=await DB.sendClip(chatId,blob,{
      durationMs:Math.round((dur||secs||0)*1000),
      peaks:peaks||[], label:label||"Jam clip"
    });
    if(mic)mic.disabled=false;
    if(r.error){toast(authMessage(r.error));return}
    await loadThread(chatId);
    renderChats();
    return;
  }

  const id="clip"+Date.now()+Math.floor(Math.random()*999);
  const ok=await clipPut(id,blob);
  const msg={f:"me",kind:"audio",clipId:id,dur:dur||secs||0,peaks,
    label:label||"Jam clip",size:blob.size,stored:ok,t:""};
  S.threads[chatId]=S.threads[chatId]||[];
  S.threads[chatId].push(msg);save();renderMsgs();renderChats();
  if(!ok)toast("Sent, but this device wouldn't store it for later");
  clipReply(chatId);
}
const CLIP_REPLIES=[
 "Okay, that tone is filthy. What are you playing through?",
