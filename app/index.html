/* ============ discover ============ */
/* ---------- filtering ---------- */
/* Someone 4 miles away is not a "remote collaborator" — they are simply outside a tight
   radius. Remote only means far enough that rehearsing in person is off the table. */
const REMOTE_FLOOR=25;
function isRemoteMatch(a){
  const f=S.filters;
  return f.remoteOk&&a.remote&&f.radius>0&&distTo(a)>Math.max(f.radius,REMOTE_FLOOR);
}
function passes(a){
  const f=S.filters,o=overlap(a);
  if(f.radius>0&&o.mi>f.radius&&!isRemoteMatch(a))return false;
  if(f.excludeSame&&o.sameInstrument)return false;
  if(f.needs.length&&!o.iNeedThem.length)return false;
  if(f.minGenres>0&&o.sharedGenres.length<f.minGenres)return false;
  if(f.genreMode==="all"&&myGenres().length&&o.sharedGenres.length<myGenres().length)return false;
  return true;
}
function matches(){
  /* Live rows have already been filtered by the database — by distance,
     by complementary instrument, by blocks, and by who you've swiped on.
     Re-running passes() over them would second-guess that with worse
     information and quietly empty the deck. */
  if(LIVE){
    return LIVEPOOL.filter(a=>!S.seen[a.id]&&!isBlocked(a.id))
      .map(a=>({a,o:overlap(a),remote:!!a.remote}))
      .sort((x,y)=>(x.remote-y.remote)||(y.o.score-x.o.score));
  }
  return ARTISTS.filter(a=>!S.seen[a.id]&&!isBlocked(a.id)).map(a=>({a,o:overlap(a),remote:isRemoteMatch(a)}))
    .filter(x=>passes(x.a))
    .sort((x,y)=>(x.remote-y.remote)||(y.o.score-x.o.score));
}
function queue(){return matches().map(x=>x.a)}
function filterSummary(){
  const f=S.filters,bits=[];
  bits.push(f.radius>0?"Within "+f.radius+" mi":"Any distance");
  if(f.needs.length)bits.push("needs "+f.needs.length+" role"+(f.needs.length>1?"s":""));
  if(f.minGenres>0)bits.push(f.minGenres+"+ shared");
  if(f.excludeSame)bits.push("complementary");
  if(f.remoteOk&&f.radius>0)bits.push("+ remote");
  return bits.join(" · ");
}
/* ---------- fetching real people ----------
   Every filter change is a new question for the database, because the
   distance ring and the complementary-instrument rule are enforced there,
   not here. Requests are coalesced: dragging the radius slider across four
   stops should ask once, not four times. */
let deckLoading=false,deckAgain=false,deckTimer=null;
async function loadDeck(){
  if(!LIVE)return;
  if(deckLoading){deckAgain=true;return}
  deckLoading=true;
  const r=await DB.matches();
  deckLoading=false;
  if(r.error){
    toast("Couldn't load people nearby — check your connection");
  }else{
    LIVEPOOL=remember(r.data||[]);
  }
  if(deckAgain){deckAgain=false;return loadDeck()}
  refreshDiscover();
}
function loadDeckSoon(){
  if(!LIVE)return;
  clearTimeout(deckTimer);
  deckTimer=setTimeout(loadDeck,220);
}

function refreshDiscover(){
  const sum=$("#f-summary");if(sum)sum.textContent=filterSummary();
  if(S.filters.view==="radar")renderRadar();else renderDeck();
  $("#deck").classList.toggle("on",S.filters.view==="deck");
  $("#radar").classList.toggle("on",S.filters.view==="radar");
  $("#deck").style.display=S.filters.view==="deck"?"":"none";
  $("#v-deck").classList.toggle("on",S.filters.view==="deck");
  $("#v-radar").classList.toggle("on",S.filters.view==="radar");
  document.querySelector(".dacts").style.display=S.filters.view==="deck"?"":"none";
}

/* ---------- deck ---------- */
function dcard(a,layer){
  const tr=a.tracks[0],uid=a.id+":"+tr.title,o=overlap(a);
  const c=el("div","dcard"+(layer?" s"+layer:""));c.dataset.id=a.id;
  c.innerHTML=`<div class="hero">${art(hash(a.id),initials(a.name),{size:170})}
      <div class="badge-dist">${isRemoteMatch(a)?"Remote · "+esc(a.city)+" · "+distLabel(o.mi):distLabel(o.mi)+" · "+esc(a.city)}</div>
      <div class="mscore"><i></i>${o.score}% fit</div>
      <div class="stamp y">CONNECT</div><div class="stamp n">SKIP</div></div>
    <div class="info">
      <h2>${esc(a.name.split(" ")[0])} <em>${esc(a.handle)}</em></h2>
      <div class="role">${esc(a.role)}</div>
      <div class="why">${reasons(a,o).map(r=>`<span class="${r.hot?"hot":""}">${esc(r.t)}</span>`).join("")}</div>
      <p class="bio">${esc(a.bio)}</p>
      <div class="chips">${a.genres.map(g=>{
        const sh=o.sharedGenres.some(x=>x.toLowerCase()===g.toLowerCase());
        return `<span class="chip${sh?" mag":""}">${esc(g)}</span>`}).join("")}</div>
      <div class="trk"><button class="pbtn" data-play="${esc(uid)}" data-dtrack="${a.id}">${nowPlaying===uid?ICON_PAUSE:ICON_PLAY}</button>
        ${waveBars(uid,30)}
        <div style="font-size:11px;color:var(--dim);text-align:right;line-height:1.2;flex:none;max-width:90px">${esc(tr.title)}<br>${esc(tr.key)} · ${tr.bpm}bpm</div></div>
    </div>`;
  c.querySelector("[data-dtrack]").addEventListener("click",ev=>{ev.stopPropagation();play(tr,a)});
  if(!layer)drag(c,a);
  return c;
}
function renderDeck(){
  const d=$("#deck");d.innerHTML="";
  const q=queue();
  if(!q.length){
    const f=S.filters;
    const wider=RINGS.find(r=>r===0||r>f.radius);
    const e=el("div","empty",`<h3>Nobody matches that yet</h3>
      <p>${f.radius>0?"No one within "+f.radius+" miles fits these filters.":"No one fits these filters."}
      ${POOL().filter(a=>!S.seen[a.id]).length?" Loosening the distance usually helps most.":" You've seen everyone — reset the deck below."}</p>`);
    if(POOL().filter(a=>!S.seen[a.id]).length&&f.radius>0){
      const b=el("button","btn",wider===0?"Show any distance":"Widen to "+wider+" miles");
      b.style.marginTop="14px";
      b.onclick=()=>{S.filters.radius=wider;save();refreshDiscover();loadDeckSoon()};
      e.appendChild(b);
      const b2=el("button","btn ghost","Open filters");b2.style.cssText="margin-top:9px";
      b2.onclick=openFilters;e.appendChild(b2);
    }else{
      const b=el("button","btn ghost","Start over");b.style.marginTop="14px";
      b.onclick=()=>{S.seen={};save();refreshDiscover();loadDeckSoon()};e.appendChild(b);
    }
    d.appendChild(e);return;
  }
  q.slice(0,3).reverse().forEach((a,i,arr)=>d.appendChild(dcard(a,arr.length-1-i)));
}
function drag(c,a){
  let x0=0,y0=0,dx=0,dy=0,down=false,moved=false;
  const y=c.querySelector(".stamp.y"),n=c.querySelector(".stamp.n");
  c.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    down=true;moved=false;x0=e.clientX;y0=e.clientY;c.style.transition="none";
    try{c.setPointerCapture(e.pointerId)}catch(_){}
  });
  c.addEventListener("pointermove",e=>{
    if(!down)return;dx=e.clientX-x0;dy=e.clientY-y0;
    if(Math.abs(dx)>6||Math.abs(dy)>6)moved=true;
    c.style.transform=`translate(${dx}px,${dy*.4}px) rotate(${dx/22}deg)`;
    y.style.opacity=Math.max(0,Math.min(1,dx/90));
    n.style.opacity=Math.max(0,Math.min(1,-dx/90));
  });
  const end=()=>{
    if(!down)return;down=false;c.style.transition="";
    if(!moved){openProfile(a.id);reset();return}
    if(dx>100)return swipe(a,"yes");
    if(dx<-100)return swipe(a,"no");
    reset();
  };
  function reset(){c.style.transform="";y.style.opacity=n.style.opacity=0;dx=dy=0}
  c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);
}
function swipe(a,verdict){
  const c=$(`.dcard[data-id="${a.id}"]`);
  if(c){c.classList.add("fly");c.style.transform=`translate(${verdict==="yes"?620:-620}px,40px) rotate(${verdict==="yes"?28:-28}deg)`;c.style.opacity=0}
  S.seen[a.id]=verdict;save();
  remember([a]);

  if(LIVE){
    /* The card leaves straight away — waiting on the network before the
       animation would make every swipe feel broken. The server decides
       whether it's a match, because only it can see the other person's
       swipe. */
    DB.swipe(a.id,verdict).then(r=>{
      if(r.error){
        delete S.seen[a.id];save();refreshDiscover();
        toast("That didn't save — check your connection");
        return;
      }
      if(verdict==="yes"){
        const row=Array.isArray(r.data)?r.data[0]:r.data;
        const matched=!!(row&&(row.matched||row.is_match));
        if(matched){connect(a.id);loadConvos()}else toast("Request sent to "+a.name.split(" ")[0]);
      }
      if(LIVEPOOL.length<4)loadDeck();
    });
    setTimeout(refreshDiscover,380);
    return;
  }

  const match=verdict==="yes"&&a.likesYou;
  setTimeout(()=>{refreshDiscover();
    if(verdict==="yes"){
      if(match)connect(a.id);
      else toast("Request sent to "+a.name.split(" ")[0]);
    }},380);
}
$("#d-no").onclick=()=>{const q=queue();if(q[0])swipe(q[0],"no")};
$("#d-yes").onclick=()=>{const q=queue();if(q[0])swipe(q[0],"yes")};
$("#d-hear").onclick=()=>{const q=queue();if(q[0])play(q[0].tracks[0],q[0])};

/* ---------- distance rings ---------- */
function renderRadar(){
  const host=$("#radar");host.innerHTML="";
  const f=S.filters,R=150,cx=170,cy=170;
  const all=POOL().filter(a=>!S.seen[a.id]).map(a=>({a,o:overlap(a)}));
  const maxRing=f.radius>0?f.radius:Math.max(30,...all.map(x=>x.o.mi));
  const scale=mi=>{const t=Math.log10(1+mi)/Math.log10(1+maxRing*1.25);return Math.min(1,t)*R};
  const ringsToDraw=(f.radius>0?[3,7,15,30,100].filter(r=>r<=Math.max(f.radius,3)):[3,7,15,30,100]);
  let svg=`<svg viewBox="0 0 340 352" role="img" aria-label="Musicians by distance from you">`;
  ringsToDraw.forEach(r=>{
    const rr=scale(r),sel=f.radius===r;
    svg+=`<circle cx="${cx}" cy="${cy}" r="${rr.toFixed(1)}" fill="none"
      stroke="${sel?"var(--mag)":"var(--line)"}" stroke-width="${sel?1.6:1}" ${sel?"":'stroke-dasharray="3 4"'}/>`;
    svg+=`<text x="${cx}" y="${(cy-rr-4).toFixed(1)}" text-anchor="middle" font-size="8.5"
      fill="${sel?"var(--mag)":"var(--dim)"}" font-family="JetBrains Mono,monospace">${r}mi</text>`;
  });
  svg+=`<circle cx="${cx}" cy="${cy}" r="5" fill="var(--text)"/>
        <text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="9" fill="var(--dim)">you</text>`;
  const shown=[];
  all.forEach(({a,o})=>{
    const ok=passes(a);
    const ang=toRad(bearing(myLoc(),{lat:a.lat,lng:a.lng})-90);
    const rr=scale(o.mi);
    const x=cx+Math.cos(ang)*rr,y=cy+Math.sin(ang)*rr;
    const size=ok?(4+o.score/22):3.2;
    const fill=ok?(o.theyNeedMe.length?"var(--amber)":"var(--mag)"):"var(--surface2)";
    svg+=`<g class="rdot" data-id="${a.id}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size.toFixed(1)}"
      fill="${fill}" ${ok?"":'stroke="var(--line)"'}/>`;
    if(ok&&o.score>55)svg+=`<text x="${x.toFixed(1)}" y="${(y-size-4).toFixed(1)}" text-anchor="middle" font-size="8"
      fill="var(--dim)">${esc(a.name.split(" ")[0])}</text>`;
    svg+=`</g>`;
    if(ok)shown.push({a,o});
  });
  svg+=`</svg>`;
  const wrap=el("div","rwrap",svg);
  host.appendChild(wrap);
  host.appendChild(el("div","rleg",
    `<span><b>●</b> fits your filters</span><span style="color:var(--amber)"><b>●</b> needs your instrument</span><span>○ filtered out</span>`));
  const list=el("div","rlist");
  list.appendChild(el("div","sechead",`<h2>${shown.length} ${shown.length===1?"match":"matches"}</h2><span class="more">${filterSummary()}</span>`));
  shown.sort((x,y)=>x.o.mi-y.o.mi).forEach(({a,o})=>{
    const row=el("button","rrow");
    row.innerHTML=`<div class="av">${avatarOf(a)}</div>
      <div class="t"><b>${esc(a.name)}</b><span>${esc(a.role)} · ${esc(a.city)}${o.theyNeedMe.length?" · needs a "+esc(o.theyNeedMe[0].toLowerCase()):""}</span></div>
      <div class="d"><b>${distLabel(o.mi)}</b>${o.score}% fit</div>`;
    row.onclick=()=>openProfile(a.id);
    list.appendChild(row);
  });
  if(!shown.length)list.appendChild(el("div","empty",`<h3>Nothing inside this ring</h3><p>Drag the distance up, or allow remote collaborators.</p>`));
  host.appendChild(list);
  wrap.querySelectorAll(".rdot").forEach(g=>g.onclick=()=>openProfile(g.dataset.id));
}

/* ---------- filter sheet ---------- */
const ROLES=["Drums","Bass","Guitar","Vocals","Keys","Synths","Sax","Trumpet","Violin","Cello","Percussion","Producer","Engineer","Songwriter"];
function openFilters(){
  const f=S.filters,b=$("#sheetbody");
  const idx=RINGS.indexOf(f.radius)<0?1:RINGS.indexOf(f.radius);
  b.innerHTML=`<div class="grabber"></div>
    <h2 style="font-size:22px;margin-bottom:4px">Who you see</h2>
    <p class="dimtext" style="font-size:13.5px;margin:0 0 6px">Based in ${esc(myLoc().label)}. <button id="f-geo" style="color:var(--mag);font-weight:600;text-decoration:underline">Change</button></p>

    <div style="padding:10px 0 0">
      <div class="radval" id="f-radval"></div>
      <input type="range" class="slider" id="f-rad" min="0" max="${RINGS.length-1}" step="1" value="${idx}">
      <div class="ticks">${RINGS.map(r=>`<span data-t="${r}">${r===0?"∞":r}</span>`).join("")}</div>
    </div>

    <div class="toggle${f.excludeSame?" on":""}" id="f-same">

let lbTab="week";
function chartData(){
  const rows=[];
  ARTISTS.forEach(a=>a.tracks.forEach((t,i)=>{
    const uid=a.id+":"+t.title;
    rows.push({artist:a,track:t,uid,plays:t.plays+(S.plays[uid]||0)*137,
      move:(hash(uid)%7)-3,isNew:hash(uid)%9===0});
  }));
  ALLBANDS().forEach(b=>bandTracks(b).forEach(t=>{
    if(mediaVis(t)!=="public")return;
    const uid=b.id+":"+t.title;
    rows.push({artist:{id:b.id,name:b.name,band:true},track:t,uid,
      plays:(t.plays||0)+(S.plays[uid]||0)*137,move:(hash(uid)%5)-2,isNew:hash(uid)%7===0});
  }));
  const mine=(S.me.tracks||[]).map(t=>({artist:S.me,track:t,uid:"me:"+t.title,

/* ============ chats ============ */
function threadOf(id){return S.threads[id]||[]}

/* ============ live messaging ============
   The app keys every conversation by the person (or band) it's with,
   because that's what the screens already use. The database keys them by
   its own conversation id. CONVOID is the bridge between the two. */
let LIVECONVOS=[],CONVOID={},msgChannel=null,msgWatchingId=null;

function dbRowToMsg(m){
  const mine=!!(S.me&&m.sender_id===S.me.id);
  return m.clip_path
    ? {f:mine?"me":m.sender_id,kind:"audio",clipId:"srv:"+m.clip_path,
       dur:Math.round((m.clip_duration_ms||0)/1000),label:m.clip_label||"Jam clip",
       peaks:m.clip_peaks||null,at:m.created_at,id:m.id}
    : {f:mine?"me":m.sender_id,t:m.body||"",at:m.created_at,id:m.id};
}

/* Pull the message list. This also rebuilds who you're connected to, since
   a match always creates a conversation — they're the same fact. */
async function loadConvos(){
  if(!LIVE)return;
  const r=await DB.convos();
  if(r.error)return;
  LIVECONVOS=r.data||[];
  CONVOID={};
  const seen=[];
  S.connections=[];
  LIVECONVOS.forEach(row=>{
    const key=row.kind==="band"?row.band_id:row.other_id;
    if(!key)return;
    CONVOID[key]=row.conversation_id;
    if(row.kind==="dm"){
      S.connections.push(row.other_id);
      seen.push(rowToArtist({id:row.other_id,display_name:row.other_name,
        handle:row.other_handle,city:row.other_city,photo_path:row.other_photo,
        instruments:[],genres:[]}));
    }
    if(row.unread>0)S.unread[key]=row.unread;else delete S.unread[key];
  });
  remember(seen);
  save();updateBadge();renderChats();
}

/* The conversation id for a screen, fetched once and remembered. */
async function convoIdFor(key,band){
  if(CONVOID[key])return CONVOID[key];
  const r=band?await DB.bandConvo(key):await DB.dmWith(key);
  if(r.error||!r.data)return null;
  const id=Array.isArray(r.data)?r.data[0]:r.data;
  CONVOID[key]=id;
  return id;
}

async function loadThread(key,band){
  const cid=await convoIdFor(key,band);
  if(!cid){toast("Couldn't open that conversation");return}
  const r=await DB.thread(cid);
  if(r.error){toast("Couldn't load messages");return}
  /* messages_page returns newest first; the screen reads oldest first */
  S.threads[key]=(r.data||[]).slice().reverse().map(dbRowToMsg);
  save();
  if(chatId===key)renderMsgs();
  DB.markRead(cid);
  watchThread(key,cid);
}

function watchThread(key,cid){
  if(msgWatchingId===cid)return;
  stopWatchingThread();
  msgWatchingId=cid;
  msgChannel=DB.watchThread(cid,m=>{
    const list=S.threads[key]||(S.threads[key]=[]);
    if(list.some(x=>x.id&&x.id===m.id))return;      /* already have it */
    const mapped=dbRowToMsg(m);
    /* our own message is already on screen, sent optimistically */
    if(mapped.f==="me"){
      const pending=list.find(x=>!x.id&&x.t===mapped.t);
      if(pending){pending.id=mapped.id;pending.at=mapped.at;save();return}
    }
    list.push(mapped);save();
    if(chatId===key){renderMsgs();DB.markRead(cid)}
    else{S.unread[key]=(S.unread[key]||0)+1;save();updateBadge();renderChats()}
  });
}
function stopWatchingThread(){
  if(msgChannel){try{DB.stopThread(msgChannel)}catch(e){}}
  msgChannel=null;msgWatchingId=null;
}
function renderChats(){
  const c=$("#chats");c.innerHTML="";
  c.appendChild(el("div","sechead",`<h2>Bands</h2>`));
  /* Bands aren't wired to the database yet. Showing the four written-in
     demo bands to someone with a real account would be a lie, so in live
     mode the section says so instead. */
  if(LIVE){
    const liveBands=LIVECONVOS.filter(r=>r.kind==="band");
    if(!liveBands.length){
      c.appendChild(el("div","empty",`<h3>No bands yet</h3><p>Band chats arrive with the bands feature. Direct messages work now.</p>`));
    }else{
      liveBands.forEach(r=>{
        const th=S.threads[r.band_id]||[];
        const row=el("button","crow");
        row.innerHTML=`<div class="av" style="width:52px;height:52px"><span class="ph">${esc(initials(r.band_name||"Band"))}</span></div>
          <div class="t"><b>${esc(r.band_name||"Band")}</b><span>${esc(r.last_body||"No messages yet")}</span></div>
          <div class="r">${r.unread?'<span class="u">'+r.unread+'</span>':""}</div>`;
        row.onclick=()=>openChat(r.band_id,true);
        c.appendChild(row);
      });

  }else
  ALLBANDS().forEach(b=>{
    if(!S.joined.includes(b.id))return;
    const th=S.threads[b.id]||(b.seed||[]).map(m=>({f:m.f,t:m.t}));
    S.threads[b.id]=th;
    const last=th[th.length-1]||{f:"sys",t:"No messages yet"};
    const row=el("button","crow");
    row.innerHTML=`<div class="stack">${(b.members||[]).slice(0,2).map(m=>{
        const mp=m&&m.id?A(m.id):null;
        return `<div class="av">${mp?avatarOf(mp):`<span class="ph">${esc(initials((m&&m.name)||b.name))}</span>`}</div>`;
      }).join("")}</div>
      <div class="t"><b>${esc(b.name)}</b><span>${esc(
        (last.f==="me"?"You: ":(A(last.f)?A(last.f).name.split(" ")[0]+": ":""))+
        (last.kind==="audio"?"Jam clip · "+mmss(last.dur):(last.t||"")))}</span></div>
      <div class="r"><i>${b.members.length} members</i>${S.unread[b.id]?'<span class="u">new</span>':""}</div>`;
    row.onclick=()=>openChat(b.id,true);
    const info=el("button","iconbtn");info.style.cssText="flex:none;width:30px;height:30px";
    info.setAttribute("aria-label","Band details");
    info.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';
    info.onclick=ev=>{ev.stopPropagation();openBand(b.id)};
    row.appendChild(info);
    c.appendChild(row);
  });
  c.appendChild(el("div","sechead",`<h2>Direct messages</h2>`));
  if(!S.connections.length){
    c.appendChild(el("div","empty",`<h3>No conversations yet</h3><p>Connect with someone in Discover or tap Connect on a post in the feed.</p>`));
  }
  S.connections.filter(id=>!isBlocked(id)).forEach(id=>{
    const p=A(id);if(!p)return;
    const th=threadOf(id),last=th[th.length-1];
    /* Live: prefer the preview the server sent. It knows the last message
       even for conversations this device has never opened. */
    const srv=LIVE?LIVECONVOS.find(r=>r.other_id===id):null;
    let preview;
    if(last){
      preview=(last.f==="me"?"You: ":"")+(last.kind==="audio"?"🎵 Jam clip · "+mmss(last.dur):last.t);
    }else if(srv&&srv.last_body){
      preview=(srv.last_sender_id===(S.me&&S.me.id)?"You: ":"")+srv.last_body;
    }else if(srv&&srv.last_clip_label){
      preview="🎵 "+srv.last_clip_label;
    }else preview="Say hello";
    const n=S.unread[id]||0;
    const row=el("button","crow");
    row.innerHTML=`<div class="av" style="width:52px;height:52px">${avatarOf(p)}</div>
      <div class="t"><b>${esc(p.name)}</b><span>${esc(preview)}</span></div>
      <div class="r"><i>${esc(p.city)}</i>${n?'<span class="u">'+(n>9?"9+":n)+'</span>':""}</div>`;
    row.onclick=()=>openChat(id);
    c.appendChild(row);
  });
  if(!LIVE)c.appendChild(el("div","empty",`<p style="font-size:13px">Group chats are how bands run. Start one from any conversation in the full build.</p>`));
}
let chatId=null,isBand=false;
function openChat(id,band){
  if(!id)return;chatId=id;isBand=!!band;
  delete S.unread[id];save();updateBadge();renderChats();
  if(LIVE){
    /* Show whatever we already have, then fetch. Opening a conversation
       should never be a blank screen waiting on the network. */
    loadThread(id,!!band);
    if(band){
      const r=LIVECONVOS.find(x=>x.band_id===id);
      $("#ch-av").innerHTML=`<span class="ph">${esc(initials((r&&r.band_name)||"Band"))}</span>`;
      $("#ch-name").textContent=(r&&r.band_name)||"Band";
      $("#ch-sub").textContent="Band chat";
      msgShown=MSG_WINDOW;renderMsgs();
      stopClip();if(rec.mr)cancelRecording();
      $("#ch-input").value="";$("#ch-send").hidden=true;$("#ch-mic").hidden=false;
      $("#chat").classList.add("on");
      return;
    }
  }
  if(band){
    const b=Bnd(id);
    $("#ch-av").innerHTML=avatarOf(A(b.members[0]));
    $("#ch-name").textContent=b.name;$("#ch-sub").textContent=b.about;
  }else{
    const p=A(id);
    $("#ch-av").innerHTML=avatarOf(p);
    $("#ch-name").textContent=p.name;$("#ch-sub").textContent=p.role+" · "+p.city;
  }
  msgShown=MSG_WINDOW;
  renderMsgs();
  stopClip();if(rec.mr)cancelRecording();
  $("#ch-input").value="";$("#ch-send").hidden=true;$("#ch-mic").hidden=false;
  $("#chat").classList.add("on");
}
const MSG_WINDOW=60;
let msgShown=MSG_WINDOW;
function renderMsgs(){
  const box=$("#ch-msgs");box.innerHTML="";
  const all=threadOf(chatId);
  /* only ever build the tail of the thread. a 5,000-message band chat would
     otherwise rebuild 5,000 nodes on every keystroke-send and lock the phone. */
  const start=Math.max(0,all.length-msgShown);
  if(start>0){
    const more=el("button","loadmore",`Load earlier messages · ${start} above`);
    more.onclick=()=>{msgShown+=MSG_WINDOW;renderMsgs();};
    box.appendChild(more);
  }
  if(isBand&&start===0)box.appendChild(el("div","msg sys","Band chat · everything here is shared with all members"));
  all.slice(start).forEach(m=>{
    const who=m.f==="me"?null:A(m.f);
    const d=el("div","msg "+(m.f==="me"?"me":"them"));
    if(m.kind==="audio"){
      d.classList.add("clipmsg");
      d.innerHTML=(isBand&&who?`<span class="who">${esc(who.name.split(" ")[0])}</span>`:"")+
        `<div class="cliprow">
          <button class="cplay" data-clip="${esc(m.clipId)}" aria-label="Play clip">${clipPlayingId===m.clipId?ICON_PAUSE:ICON_PLAY}</button>
          ${clipWave(m.clipId,m.peaks)}
          <span class="cdur">${mmss(m.dur)}</span>
        </div>
        <span class="cliplab">${esc(m.label||"Jam clip")}${m.size?" · "+Math.max(1,Math.round(m.size/1024))+" KB":""}</span>`;
      const btn=d.querySelector(".cplay");
      btn.onclick=()=>playClip(m.clipId,btn,d.querySelector(".cwave"));
      box.appendChild(d);
      return;
    }
    if(m.sending)d.classList.add("sending");
    if(m.failed)d.classList.add("failed");
    if(m.failed){
      d.title="Tap to try again";
      d.onclick=()=>{
        const list=S.threads[chatId]||[];
        const i=list.indexOf(m);if(i>-1)list.splice(i,1);
        save();renderMsgs();sendMsg(m.t,m.attach);
      };
    }
    d.innerHTML=(isBand&&who?`<span class="who">${esc(who.name.split(" ")[0])}</span>`:"")+esc(m.t)+
      (m.sending?'<span class="mstate">sending…</span>':"")+
      (m.failed?'<span class="mstate">not sent · tap to retry</span>':"")+
      (m.attach?`<div class="attach"><div class="cov">${art(hash(m.attach),"",{k:"at"})}</div>
        <div style="flex:1;min-width:0"><b style="display:block;font-size:13px">${esc(m.attach)}</b><span style="font-size:11px;opacity:.8">Track · tap to play</span></div>
        <div class="pbtn" style="width:28px;height:28px">${ICON_PLAY}</div></div>`:"");
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}
$("#ch-back").onclick=()=>{if(rec.mr)cancelRecording();stopClip();stopWatchingThread();
  $("#chat").classList.remove("on");chatId=null;if(LIVE)loadConvos()};
function sendMsg(text,attach){
  if(!chatId)return;
  S.threads[chatId]=S.threads[chatId]||[];

  if(LIVE){
    const key=chatId;
    const pending={f:"me",t:text,attach,sending:true};
    S.threads[key].push(pending);save();renderMsgs();
    (async()=>{
      const cid=await convoIdFor(key,isBand);
      if(!cid){pending.failed=true;delete pending.sending;save();renderMsgs();
        toast("Couldn't open that conversation");return}
      const r=await DB.sendText(cid,text);
      delete pending.sending;
      if(r.error){
        pending.failed=true;save();renderMsgs();
        toast("Message didn't send — tap it to try again");
        return;
      }
      if(r.data&&r.data.id){pending.id=r.data.id;pending.at=r.data.created_at}
      save();renderMsgs();
    })();
    return;
  }

  S.threads[chatId].push({f:"me",t:text,attach});save();renderMsgs();
  const id=chatId,band=isBand;

/* ============ video call ============ */
let stream=null,micOn=true,camOn=true,studio=true,callTimer=null;
function openCallWith(ids,title){
  $("#cl-title").textContent=title||"Jam room";
  $("#cl-sub").textContent="Connecting…";
  const grid=$("#cl-grid");grid.innerHTML="";
  const me=el("div","tile",`<video id="cl-video" autoplay playsinline muted></video>
    <div class="nm">You${micOn?"":' <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4l16 16"/></svg>'}</div>`);
  grid.appendChild(me);
  ids.slice(0,3).forEach((id,i)=>{
    const p=A(id);
    const t=el("div","tile"+(i===0?" speaking":""),`<svg aria-hidden="true" class="face" viewBox="0 0 400 400">${art(hash(p.id),initials(p.name),{k:"c"}).replace(/^<svg aria-hidden="true"[^>]*>|<\/svg>$/g,"")}</svg>
      <div class="nm">${esc(p.name.split(" ")[0])} · ${esc(p.city)}</div>`);
    grid.appendChild(t);
  });
  grid.style.gridTemplateColumns=ids.length<=1?"1fr":"1fr 1fr";
  $("#call").classList.add("on");
  startCam();
  let sec=0;
  $("#cl-info").innerHTML=`<span>Round trip <b>38 ms</b></span><span>Audio <b>48 kHz stereo</b></span><span>Processing <b>off</b></span>`;
  clearInterval(callTimer);
  callTimer=setInterval(()=>{sec++;const m=String(Math.floor(sec/60)).padStart(2,"0"),s=String(sec%60).padStart(2,"0");
    $("#cl-sub").textContent=`${ids.length+1} in the room · ${m}:${s}`;
    const tiles=[...grid.children].slice(1);
    if(tiles.length){tiles.forEach(t=>t.classList.remove("speaking"));tiles[sec%tiles.length].classList.add("speaking")}
  },1000);
}
async function startCam(){
  const v=$("#cl-video");if(!v)return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user"},
      audio:studio?{echoCancellation:false,noiseSuppression:false,autoGainControl:false,sampleRate:48000,channelCount:2}
                  :{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
    v.srcObject=stream;
  }catch(e){
    v.remove();
    const tile=$("#cl-grid").firstElementChild;
    if(tile)tile.insertAdjacentHTML("afterbegin",`<svg aria-hidden="true" class="face" viewBox="0 0 400 400">${art(hash("me"+(S.me.name||"You")),initials(S.me.name||"You"),{k:"c"}).replace(/^<svg aria-hidden="true"[^>]*>|<\/svg>$/g,"")}</svg>`);
  }
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
$("#ch-call").onclick=()=>{

};
$("#cl-end").onclick=()=>{$("#call").classList.remove("on");stopCam();clearInterval(callTimer)};
$("#cl-mic").onclick=()=>{micOn=!micOn;$("#cl-mic").classList.toggle("off",!micOn);

  stopCam();await startCam();

/* ---------- jam clips: record, store, play ----------
   Audio blobs go in IndexedDB — localStorage would blow its quota on one clip.
   Recording uses music-grade constraints: no noise suppression, no auto gain,
   no echo cancellation. Speech processing destroys cymbals and sustained notes. */
let idbP=null;
function idb(){
  if(idbP)return idbP;
  idbP=new Promise((res,rej)=>{
    try{
      const r=indexedDB.open("jammy-clips",1);
      r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("clips"))db.createObjectStore("clips")};
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    }catch(e){rej(e)}
  });
  return idbP;
}
async function clipPut(id,blob){
  try{const db=await idb();return new Promise((res,rej)=>{
    const tx=db.transaction("clips","readwrite");
    tx.objectStore("clips").put(blob,id);
    tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);
  })}catch(e){return false}
}
async function clipGet(id){
  try{const db=await idb();return new Promise((res)=>{
    const tx=db.transaction("clips","readonly");
    const q=tx.objectStore("clips").get(id);
    q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);
  })}catch(e){return null}
}

const urlCache={};
async function clipURL(id){
  if(urlCache[id])return urlCache[id];
  const b=await clipGet(id);
  if(!b)return null;
  urlCache[id]=URL.createObjectURL(b);
  return urlCache[id];
}
let clipAudio=null,clipPlayingId=null,clipRaf=null;
async function playClip(id,btn,waveEl){
  if(clipPlayingId===id){stopClip();return}
  stopClip();stopAudio();
  const u=await clipURL(id);
  if(!u){toast("That clip isn't on this device any more");return}
  clipAudio=new Audio(u);
  clipPlayingId=id;
  if(btn)btn.innerHTML=ICON_PAUSE;
  clipAudio.onended=()=>stopClip();
  clipAudio.onerror=()=>{toast("Couldn't play that clip");stopClip()};
  try{await clipAudio.play()}catch(e){toast("Tap again to play");stopClip();return}
  const bars=waveEl?[...waveEl.children]:[];
  const frame=()=>{
    if(clipPlayingId!==id||!clipAudio)return;
    const p=clipAudio.duration?clipAudio.currentTime/clipAudio.duration:0;
    bars.forEach((b,i)=>b.classList.toggle("hit",i/bars.length<=p));
    clipRaf=requestAnimationFrame(frame);
  };
  clipRaf=requestAnimationFrame(frame);
}
function stopClip(){
  if(clipRaf)cancelAnimationFrame(clipRaf);clipRaf=null;
  if(clipAudio){clipAudio.pause();clipAudio=null}
  if(clipPlayingId){
    document.querySelectorAll(`[data-clip="${CSS.escape(clipPlayingId)}"]`).forEach(b=>b.innerHTML=ICON_PLAY);
    document.querySelectorAll(`[data-clipwave="${CSS.escape(clipPlayingId)}"] i`).forEach(b=>b.classList.remove("hit"));
  }
  clipPlayingId=null;
}

/* peaks for a real waveform, decoded from the actual audio */
async function peaksOf(blob,n){
  n=n||34;
  try{
    const ab=await blob.arrayBuffer();
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const buf=await ctx.decodeAudioData(ab.slice(0));
    const ch=buf.getChannelData(0),block=Math.floor(ch.length/n)||1;
    const out=[];
    for(let i=0;i<n;i++){
      let max=0;
      for(let j=i*block;j<(i+1)*block&&j<ch.length;j+=7){const v=Math.abs(ch[j]);if(v>max)max=v}
      out.push(Math.max(0.08,Math.min(1,max)));
    }
    try{ctx.close()}catch(e){}
    return {peaks:out,dur:buf.duration};
  }catch(e){
    return {peaks:Array.from({length:n},(_,i)=>0.25+Math.abs(Math.sin(i*0.7))*0.6),dur:0};
  }
}
function clipWave(id,peaks){
  return `<div class="cwave" data-clipwave="${esc(id)}">${(peaks||[]).map(v=>
    `<i style="height:${Math.round(Math.max(8,v*100))}%"></i>`).join("")}</div>`;
}
const mmss=sec=>{sec=Math.max(0,Math.round(sec||0));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")};

/* ---------- the recorder ---------- */
let rec={mr:null,stream:null,chunks:[],t0:0,timer:null,raf:null,ctx:null};
function recordingUI(on){
  $("#recbar").classList.toggle("on",on);
  document.querySelector("#chat .cbar").style.display=on?"none":"";
}
async function startRecording(){
  if(!navigator.mediaDevices||!window.MediaRecorder){
    toast("Recording isn't supported in this browser");return;
  }
  try{
    rec.stream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false,noiseSuppression:false,autoGainControl:false,
      sampleRate:48000,channelCount:1}});
  }catch(e){
    toast(e&&e.name==="NotAllowedError"?"Microphone permission is off — turn it on in settings":"Couldn't open the microphone");
    return;
  }
  const types=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"];
  const mime=types.find(t=>window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  try{rec.mr=mime?new MediaRecorder(rec.stream,{mimeType:mime,audioBitsPerSecond:128000}):new MediaRecorder(rec.stream)}
  catch(e){toast("Couldn't start recording here");stopStream();return}
  rec.chunks=[];
  rec.mr.ondataavailable=e=>{if(e.data&&e.data.size)rec.chunks.push(e.data)};
  rec.mr.start();
  rec.t0=Date.now();
  recordingUI(true);
  $("#rec-time").textContent="0:00";
  rec.timer=setInterval(()=>{
    const sec=(Date.now()-rec.t0)/1000;
    $("#rec-time").textContent=mmss(sec);
    if(sec>=120)finishRecording(true);   /* hard cap, 2 minutes is plenty for a tone check */
  },250);

  /* live level meter off the real input */
  try{
    rec.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=rec.ctx.createMediaStreamSource(rec.stream);
    const an=rec.ctx.createAnalyser();an.fftSize=512;src.connect(an);
    const data=new Uint8Array(an.frequencyBinCount);
    const meter=$("#rec-meter");
    meter.innerHTML=Array.from({length:22},()=>"<i></i>").join("");
    const bars=[...meter.children];
    const tick=()=>{
      if(!rec.mr)return;
      an.getByteFrequencyData(data);
      bars.forEach((b,i)=>{
        const v=data[Math.floor(i/bars.length*data.length*0.6)]/255;
        b.style.height=Math.max(10,v*100)+"%";
      });
      rec.raf=requestAnimationFrame(tick);
    };
    tick();
  }catch(e){}
}
function stopStream(){
  if(rec.stream){rec.stream.getTracks().forEach(t=>t.stop());rec.stream=null}
  if(rec.timer)clearInterval(rec.timer);rec.timer=null;
  if(rec.raf)cancelAnimationFrame(rec.raf);rec.raf=null;
  if(rec.ctx){try{rec.ctx.close()}catch(e){}rec.ctx=null}
}
function cancelRecording(){
  if(rec.mr){try{rec.mr.onstop=null;rec.mr.stop()}catch(e){}}
  rec.mr=null;rec.chunks=[];stopStream();recordingUI(false);
  toast("Discarded");
}
function finishRecording(auto){
  if(!rec.mr)return;
  const mr=rec.mr;rec.mr=null;
  const secs=(Date.now()-rec.t0)/1000;
  mr.onstop=async()=>{
    stopStream();recordingUI(false);
    if(secs<0.8){toast("Too short — hold it a bit longer");return}
    const blob=new Blob(rec.chunks,{type:mr.mimeType||"audio/webm"});
    rec.chunks=[];
    await sendClip(blob,secs);
    if(auto)toast("Two minutes is the limit — sent");
  };
  try{mr.stop()}catch(e){stopStream();recordingUI(false)}
}
async function sendClip(blob,secs,label){
  if(!chatId)return;
  const id="clip"+Date.now()+Math.floor(Math.random()*999);
  const ok=await clipPut(id,blob);
  const {peaks,dur}=await peaksOf(blob);
  const msg={f:"me",kind:"audio",clipId:id,dur:dur||secs||0,peaks,
    label:label||"Jam clip",size:blob.size,stored:ok,t:""};
  S.threads[chatId]=S.threads[chatId]||[];
  S.threads[chatId].push(msg);save();renderMsgs();renderChats();
  if(!ok)toast("Sent, but this device wouldn't store it for later");
  clipReply(chatId);
}

/* ---------- photos and video on posts ----------
   The full file goes into IndexedDB (localStorage would blow its quota on
   one photo). A small poster image is kept on the post itself so the feed
   renders instantly and still shows something if the file is ever missing. */
const MAX_IMG=10*1024*1024, MAX_VID=60*1024*1024;

function shrinkImage(file,maxSide,quality){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error("read"));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error("decode"));
      img.onload=()=>{
        const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        c.toBlob(b=>b?res({blob:b,w,h,url:c.toDataURL("image/jpeg",0.5)}):rej(new Error("encode")),
                 "image/jpeg",quality||0.82);
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

/* grab a frame so a video has something to show before you tap it */
function videoPoster(file){
  return new Promise(res=>{
    let url=null;
    try{url=URL.createObjectURL(file)}catch(e){return res(null)}
    const v=document.createElement("video");
    v.muted=true;v.playsInline=true;v.preload="metadata";
    const done=out=>{try{URL.revokeObjectURL(url)}catch(e){} res(out)};
    const bail=()=>done(null);
    v.onerror=bail;
    setTimeout(bail,6000);
    v.onloadeddata=()=>{
      try{
        const scale=Math.min(1,640/Math.max(v.videoWidth||640,v.videoHeight||360));
        const c=document.createElement("canvas");
        c.width=Math.round((v.videoWidth||640)*scale);c.height=Math.round((v.videoHeight||360)*scale);
        c.getContext("2d").drawImage(v,0,0,c.width,c.height);
        done({url:c.toDataURL("image/jpeg",0.5),dur:v.duration||0,w:c.width,h:c.height});
      }catch(e){bail()}
    };
    v.onloadedmetadata=()=>{try{v.currentTime=Math.min(0.5,(v.duration||1)/3)}catch(e){}};
    v.src=url;
  });
}

async function attachFile(file){
  if(!file)return null;
  const isVid=/^video\//.test(file.type), isImg=/^image\//.test(file.type);
  if(!isVid&&!isImg){toast("That file isn't a photo or a video");return null}
  if(isImg&&file.size>MAX_IMG){toast("That photo is over 10 MB — try a smaller one");return null}
  if(isVid&&file.size>MAX_VID){toast("That video is over 60 MB — trim it first");return null}
  const id="pm"+Date.now()+Math.floor(Math.random()*999);
  try{
    if(isImg){
      const out=await shrinkImage(file,1440,0.82);
      await clipPut(id,out.blob);
      return {id,kind:"photo",poster:out.url,w:out.w,h:out.h,size:out.blob.size};
    }
    const pos=await videoPoster(file);
    await clipPut(id,file);
    return {id,kind:"video",poster:pos?pos.url:null,dur:pos?pos.dur:0,
            w:pos?pos.w:640,h:pos?pos.h:360,size:file.size};
  }catch(e){toast("Couldn't read that file");return null}
}

function mediaBlock(m){

      <span class="vlen">${m.dur?mmss(m.dur):"Video"}</span>`:""}</div>`;

const REPORT_REASONS=[

function isBlocked(id){return (S.blocks||[]).some(b=>b.id===id)}
function blockUser(id,reason,note){

  S.blocks=(S.blocks||[]).concat([{id,reason:reason||null,note:note||"",at:new Date().toISOString()}]);
  S.connections=S.connections.filter(c=>c!==id);
  delete S.threads[id];delete S.unread[id];
  S.seen[id]="blocked";

  sb.querySelectorAll("[data-r]").forEach(o=>o.onclick=()=>{
    reason=o.dataset.r;
    sb.querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("on",x.dataset.r===reason));
    $("#rp-notewrap").style.display=reason==="other"?"":"none";
    $("#rp-send").disabled=false;
  });
  $("#rp-block").onclick=()=>$("#rp-block").classList.toggle("on");
  $("#rp-send").onclick=()=>{
    const note=($("#rp-note")&&$("#rp-note").value||"").trim();
    S.reports=(S.reports||[]).concat([{id,reason,note,at:new Date().toISOString()}]);
    if($("#rp-block").classList.contains("on"))blockUser(id,reason,note);
    save();$("#sheet").classList.remove("on");
    refreshDiscover();renderFeed();renderChats();renderYou();
    toast("Report filed"+($("#rp-block")&&isBlocked(id)?" and "+p.name.split(" ")[0]+" blocked":""));
  };
  $("#rp-blockonly").onclick=()=>{
    blockUser(id,null,"");$("#sheet").classList.remove("on");

}
const FLAG='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 21V4.5h14l-3 4.5 3 4.5H5"/></svg>';

/* ---------- band media ---------- */
const CLIP_LABEL={live:"Live",rehearsal:"Rehearsal",studio:"Studio",video:"Video"};
function bandTracks(b){return (b.tracks||[]).concat(((S.bandMedia&&S.bandMedia[b.id])||[]).filter(m=>m.media==="track"))}
function bandClips(b){return (b.clips||[]).concat(((S.bandMedia&&S.bandMedia[b.id])||[]).filter(m=>m.media==="clip"))}
function mediaVis(m){return (S.eventVis&&S.eventVis[m.id||m.title])||m.vis||"members"}
function visibleMedia(list,member){return member?list:list.filter(m=>mediaVis(m)==="public")}
const EV_LABEL={practice:"Practice",gig:"Gig",call:"Call"};

/* ---------- event privacy ----------
   A gig is a public performance, so gigs are public by default — that's the point of
   playing one. Practices and calls are members-only and can never be published: a
   rehearsal time and address is often someone's home.
   The exception a working musician actually needs is the private function — a wedding
   or corporate booking is a gig, but it is not open to the public, and the client's
   venue and time are not ours to announce. */
function isBandMember(b){return !!b&&S.joined.includes(b.id)}
const DEFAULT_VIS={gig:"public",practice:"members",call:"members",recording:"members"};
function evVis(e){
  if(S.eventVis&&S.eventVis[e.id])return S.eventVis[e.id];
  return e.vis||DEFAULT_VIS[e.type]||"members";
}
function canAnnounce(e){return e.type==="gig"}
function visibleEvents(b,viewerIsMember){
  const all=bandEvents(b);
  return viewerIsMember?all:all.filter(e=>evVis(e)==="public");
}
const CHECK='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>';
const LOCK='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>';
const GLOBE='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14 0 17M12 3.5c-2.5 2.6-2.5 14 0 17"/></svg>';
function visBadge(e){
  const pub=evVis(e)==="public";
  const label=pub?(e.type==="gig"?"Public show":"Public")
    :(e.type==="gig"?"Private function":"Members only");
  return `<span class="visb ${pub?"pub":""}">${pub?GLOBE:LOCK}${label}</span>`;
}
function evIcon(t){
  return t==="gig"
    ? '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>'
    : t==="call"
    ? '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15 10l6-4v12l-6-4z"/><rect x="3" y="6" width="12" height="12" rx="2.5"/></svg>'
    : '<svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>';
}

  const member=isBandMember(b);

       <span class="evtype ${e.type}">${EV_LABEL[e.type].toUpperCase()}</span>`;
    if(member)row.onclick=()=>openEventPrivacy(b.id,e);
    h.appendChild(row);

  if(member){
    const ph=el("div");ph.style.padding="4px 16px 0";

    inp.onchange=async()=>{
      const f=inp.files&&inp.files[0];if(!f)return;

      if(f.size>12*1024*1024){toast("Over 12 MB — try a smaller photo");return}
      toast("Processing…");
      try{const out=await shrinkImage(f,900,0.8);
        S.bandPhotos[b.id]=out.url;save();openBand(b.id);renderChats();renderYou();toast("Band photo updated")}
      catch(e){toast("Couldn't read that image")}
    };
    ph.appendChild(pb);
    if((S.bandPhotos||{})[b.id]){
      const rm=el("button","btn ghost","Remove band photo");rm.style.cssText="width:100%;margin-top:9px";

  /* ---- recordings ---- */

  if(trks.length||clips.length||member){

    if(clips.length){
      const strip=el("div","clipstrip");
      clips.forEach(c=>{
        const card=el("button","clipcard");
        card.innerHTML=`<div class="th">${art(hash(b.id+c.id),"",{k:"cl"})}
            <span class="dur">${esc(c.len||"")}</span>
            <span class="pl">${ICON_PLAY}</span>
            ${mediaVis(c)==="public"?`<span class="pubdot">${GLOBE}</span>`:`<span class="pubdot lock">${LOCK}</span>`}</div>
          <b>${esc(c.title)}</b><span>${CLIP_LABEL[c.kind]||"Clip"}</span>`;
        card.onclick=()=>openClip(b.id,c,member);
        strip.appendChild(card);
      });
      h.appendChild(strip);
    }else h.appendChild(el("div","empty",`<p style="font-size:13.5px">${member?"No clips yet. Phone video of a rehearsal is the most useful thing you can post.":"No public clips."}</p>`));

    if(member){

      const amb=el("button","btn ghost","Add a recording or clip");amb.style.width="100%";
      amb.onclick=()=>openAddMedia(b.id);addM.appendChild(amb);h.appendChild(addM);
    }

  me.innerHTML=`<div class="av">${meAvatar()}</div>
    <div class="t"><b>${esc(S.me.name||"You")}</b><span>${esc(b.myRole||"")}</span></div>
    <span class="tagme">YOU</span>`;
  h.appendChild(me);
  mem.forEach(m=>{
    const row=el("div","mrow2");
    if(m.p){
      row.innerHTML=`<div class="av">${avatarOf(m.p)}</div>
        <div class="t"><b>${esc(m.p.name)}</b><span>${esc(m.role)} · ${esc(m.p.city)}</span></div>
        <svg aria-hidden="true" class="chev" viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:var(--dim);stroke-width:2"><path d="M9 5l7 7-7 7"/></svg>`;
      row.classList.add("statbtn");
      row.onclick=()=>{$("#bandview").classList.remove("on");openProfile(m.p.id)};

  if(member&&(b.space||((b.info||[]).length))){
    h.appendChild(el("div","sechead",`<h2>Details</h2>`));
    if(b.space)h.appendChild(el("div","inforow",`<span>Rehearsal space</span><span>${esc(b.space)}</span>`));

  if(member){

    lv.onclick=()=>{S.joined=S.joined.filter(x=>x!==b.id);save();
      $("#bandview").classList.remove("on");openBandList();renderYou();toast("Left "+b.name)};

/* joining a band updates your profile automatically */
function joinBand(id,silent){
  if(S.joined.includes(id))return;
  const b=Bnd(id);if(!b)return;
  S.joined.push(id);
  if(b.kind==="jammy"&&!S.threads[id])S.threads[id]=(b.seed||[]).map(m=>({f:m.f,t:m.t}));
  save();renderYou();renderChats();
  if(!silent)toast("You're in "+b.name+" — it's on your profile now");
}

function buildAlerts(){
  const out=[];
  myBandList().forEach(b=>{
    bandEvents(b).forEach(e=>{
      const ms=new Date(e.at)-Date.now();
      if(ms<0||ms>12*86400000)return;
      const soon=ms<3*86400000;
      let title,body;
      if(e.type==="gig"){
        title=`${b.name} has a gig ${whenPhrase(e.at)}`;
        body=`${clock(e.at)} at ${e.place}.`+(e.myJob?` ${e.myJob} — don't forget.`:"");
      }else if(e.type==="call"){
        title=`${b.name} call ${whenPhrase(e.at)}`;
        body=`${clock(e.at)}.`+(e.myJob?` ${e.myJob}.`:"");
      }else{
        title=`${b.name} practice ${whenPhrase(e.at)}`;
        body=`${clock(e.at)} at ${e.place}.`+(e.myJob?` ${e.myJob}.`:" Don't be late.");
      }
      out.push({id:b.id+":"+e.id,kind:e.type,bandId:b.id,at:e.at,title,body,soon});
    });
  });
  Object.keys(S.unread||{}).forEach(id=>{
    const p=A(id)||Bnd(id);
    if(p)out.push({id:"msg:"+id,kind:"msg",at:new Date().toISOString(),
      title:(p.name||"Someone")+" sent you a message",body:"Open the chat to reply.",chat:id,soon:true});
  });
  return out.sort((a,b)=>new Date(a.at)-new Date(b.at));
}
function alertCount(){return buildAlerts().filter(a=>!S.readAlerts.includes(a.id)).length}

                          : JammyAPI.auth.sendEmailCode(contact);
  },
  async signInVerify(kind, contact, code){
    if(!LIVE) return {data:{demo:true}, error:null};

                          : JammyAPI.auth.verifyEmail(contact, code);
  },
  async createProfile(draft){
    if(!LIVE) return {data:null, error:null};
    const r = await JammyAPI.profile.create({
      handle:(draft.handle||"").replace(/^@/,""), name:draft.name, city:draft.city,
      instruments:draft.instruments, genres:draft.genres,
      lookingFor:draft.goal, birthDate:draft.dob, needs:[], days:draft.days||[]
    });

  },
  async matches(){
    if(!LIVE) return {data:null, error:null};

  },
  async swipe(id, dir){
    if(!LIVE) return {data:null, error:null};
    return JammyAPI.discover.swipe(id, dir);
  },

  /* ---- likes ----
     Optimistic: the heart fills instantly and we reconcile with whatever
     the server says. If the write fails we put it back and say so, rather
     than leaving a like that never happened. */
  async toggleLike(postId, nextState){
    if(!LIVE){
      S.likes[postId]=nextState;save();
      return {data:{liked:nextState}, error:null};
    }
    const r=await JammyAPI.sb.rpc("toggle_like",{post:postId});
    if(r.error)return {data:null, error:r.error};
    const row=Array.isArray(r.data)?r.data[0]:r.data;
    S.likes[postId]=!!(row&&row.liked);save();
    return {data:row, error:null};
  },

  /* ---- comments ---- */
  async comments(postId){
    if(!LIVE)return {data:commentsOf(postId).map(c=>({
      id:c.id||("local"+Math.random()),author_id:c.who,body:c.t,
      created_at:c.at||new Date().toISOString(),
      author_name:(c.who==="me"?S.me.name:(A(c.who)||{}).name)||"Someone",
      is_mine:c.who==="me"}))
      ,error:null};
    return JammyAPI.feed.comments(postId);
  },
  async addComment(postId, body){
    if(!LIVE){
      S.comments[postId]=(S.comments[postId]||[]).concat([{who:"me",t:body,at:new Date().toISOString()}]);
      save();return {data:{body}, error:null};
    }
    return JammyAPI.feed.comment(postId, body);
  },
  async deleteComment(id, postId){
    if(!LIVE){
      S.comments[postId]=(S.comments[postId]||[]).filter(c=>c.id!==id);save();
      return {data:null, error:null};
    }
    return JammyAPI.feed.deleteComment(id);
  },
  watchComments(postId, cb){
    if(!LIVE)return null;
    return JammyAPI.feed.subscribeComments(postId, cb);
  },
  stopWatching(ch){ if(LIVE&&ch)JammyAPI.feed.unsubscribe(ch); },

  /* ---- messaging ---- */
  convos(){ return LIVE?JammyAPI.chat.list():Promise.resolve({data:[],error:null}); },
  dmWith(userId){ return JammyAPI.chat.dmWith(userId); },
  bandConvo(bandId){ return JammyAPI.chat.bandConversation(bandId); },
  thread(convoId,before){ return JammyAPI.chat.messages(convoId,before||null); },
  sendText(convoId,body){ return JammyAPI.chat.send(convoId,body); },

  watchThread(convoId,cb){ return JammyAPI.chat.subscribe(convoId,cb); },
  stopThread(ch){ if(ch)JammyAPI.chat.unsubscribe(ch); }
};

/* Show an onboarding failure where it can actually be read, and keep the
   raw server text underneath — that line is what makes a problem reportable
   instead of "it got stuck". */
function obError(e){
  const foot=$("#ob-foot");
  if(!foot)return;
  let box=foot.querySelector(".oberr");
  if(!box){box=document.createElement("div");box.className="oberr";foot.insertBefore(box,foot.firstChild)}
  const raw=(e&&(e.message||e.error_description||e.details))||"";
  box.innerHTML=`<b>${esc(authMessage(e))}</b>`+(raw?`<code>${esc(String(raw))}</code>`:"");
  box.classList.add("on");
}
function obClearError(){
  const b=document.querySelector(".oberr");
  if(b)b.classList.remove("on");
}

/* Turn a server error into something a musician can act on.
   "AuthApiError: Token has expired or is invalid" helps nobody. */
function authMessage(e){
  const m=String((e&&(e.message||e.error_description))||e||"").toLowerCase();
  if(m.includes("rate limit")||m.includes("too many"))
    return "Too many codes requested. Wait a few minutes and try again.";
  if(m.includes("expired")||m.includes("invalid")||m.includes("otp"))
    return "That code is wrong or has expired. Ask for a new one.";
  if(m.includes("email")&&m.includes("not")&&m.includes("enabled"))
    return "Email sign-in isn't switched on for this project yet.";
  if(m.includes("signups not allowed")||m.includes("disabled"))
    return "New accounts are switched off for this project right now.";
  if(m.includes("failed to fetch")||m.includes("network"))
    return "Couldn't reach the server. Check your connection and try again.";
  if(m.includes("duplicate")||m.includes("unique")){
    if(m.includes("handle"))return "That handle is taken — pick another.";
    return "That's already registered.";
  }
  if(m.includes("adults_only")||m.includes("birth"))
    return "Jammy is 18+. Check the date of birth you entered.";
  if(m.includes("handle_check")||m.includes("handle ~"))
    return "Handles can only use lowercase letters, numbers and underscores — 3 to 20 of them.";
  return (e&&e.message)||"Something went wrong. Try again.";
}

/* A real profiles row from the database, adopted as "me". */
function adoptProfile(r){
  if(!r)return;
  S.me={...ME_DEFAULT,
    id:r.id,
    name:r.display_name||"You",
    handle:"@"+(r.handle||"you"),
    city:r.city||"",
    instruments:r.instruments||[],
    role:(r.instruments||[]).slice(0,2).join(" · ")||"Musician",
    genres:(r.genres||[]).join(", "),
    want:r.looking_for||"",
    bio:r.bio||"",
    days:r.rehearsal_days||[],
    photo:r.photo_path||null,
    loc:S.me&&S.me.loc?S.me.loc:{...HOME},
    tracks:(S.me&&S.me.tracks)||[]};
  S.account=Object.assign({},S.account,{serverId:r.id});
}

/* Handles have to satisfy the database: lowercase, 3–20, letters/digits/_ */
function cleanHandle(h){
  return String(h||"").replace(/^@/,"").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,20);
}

/* map a database row onto the shape the cards already render */
function rowToArtist(r){
  return {
    id:r.id, name:r.display_name, handle:"@"+r.handle, city:r.city||"",
    instruments:r.instruments||[], genres:r.genres||[],
    role:(r.instruments||[]).slice(0,2).join(" · "),
    want:r.looking_for||"", bio:r.bio||"", infl:"", avail:"",
    seeking:[], days:[], remote:!!r.is_remote,
    photo:r.photo_path||null,
    _miles:r.miles, _fit:r.fit, _shared:r.shared_genres||[], _needsMe:r.they_need_me||[],
    tracks:[{title:"Their track",key:"A minor",bpm:100,plays:0}],
    replies:["(live reply)"], likesYou:false, lat:null, lng:null
  };
}

        <div class="rule"><span class="n">4</span><div><b>This is for playing music</b><span>Not a marketplace, not a dating app. Connect with people you'd actually want in a rehearsal room.</span></div></div>
      </div>
      <div class="agree" id="ob-agree"><span class="box"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg></span>
        <p>I'm 18 or older, and I agree to the Terms of Service, Privacy Policy, and a zero-tolerance policy on abusive content and behaviour.</p></div>`;
    foot.innerHTML=`<button class="btn" id="ob-next" disabled>Agree and continue</button>`;
    const ag=$("#ob-agree"),next=$("#ob-next");
    ag.onclick=()=>{obDraft.agreed=!obDraft.agreed;ag.classList.toggle("on",obDraft.agreed);next.disabled=!obDraft.agreed};
    next.onclick=()=>finishOnboarding();
  }

  else if(st.id==="done"){
    body.innerHTML=`<div class="splash">
      <div class="lw">Welcome</div>
      <p>Your card is live. ${(obDraft.instruments[0]||"Musicians").toString()} players near ${obDraft.city||"you"} can find you now.</p>
      <div class="free">Free. No subscription, ever.</div></div>`;
    foot.innerHTML=`<button class="btn" id="ob-next">Start looking</button>
      <p class="fine">Add a track any time from your profile — it goes straight into Jammy Radio's rotation.</p>`;
    $("#ob-next").onclick=()=>{$("#onb").classList.remove("on");go("disc");
      setTimeout(()=>toast("Swipe right to connect. Tap a card for the full profile."),700)};
  }
}
async function finishOnboarding(){
  /* Live: the profile has to land in the database before we let anyone in.
     If it fails, stay on this screen and say why — silently carrying on
     would give them an account that exists only on their own phone. */
  if(LIVE){
    const btn=$("#ob-next");
    if(btn){btn.disabled=true;btn.textContent="Creating your profile…"}
    obDraft.handle=cleanHandle(obDraft.handle)||cleanHandle(obDraft.name)||("user"+Math.floor(Math.random()*9000+1000));
    if(obDraft.handle.length<3)obDraft.handle="user"+Math.floor(Math.random()*9000+1000);
    const r=await DB.createProfile(obDraft);
    if(btn){btn.disabled=false;btn.textContent="Agree and continue"}
    if(r.error){obError(r.error);return}
    obClearError();
    if(r.data)adoptProfile(r.data);
  }
  S.account={method:obDraft.method,contact:obDraft.contact||null,dob:obDraft.dob,
    agreedAt:new Date().toISOString(),notifications:!!obDraft.notif,createdAt:new Date().toISOString(),
    serverId:(S.account&&S.account.serverId)||null};
  /* In live mode adoptProfile() has already filled S.me from the row the
     database actually stored, which is the version that matters — it has
     the real id, and the handle the server accepted rather than the one
     that was typed. Only the demo builds "me" out of the draft. */
  if(!LIVE){
    S.me={...ME_DEFAULT,
      name:obDraft.name||"You",handle:obDraft.handle||"@you",city:obDraft.city||"Boston",
      role:obDraft.instruments.slice(0,2).join(" · ")||"Musician",
      instruments:obDraft.instruments.slice(),
      days:obDraft.days&&obDraft.days.length?obDraft.days:["Wed","Thu"],
      loc:obDraft.loc||{lat:HOME.lat,lng:HOME.lng,label:obDraft.city||"Boston"},
      genres:obDraft.genres.join(", "),want:obDraft.goal||"Open to anything",
      bio:"",tracks:[]};
  }else if(obDraft.loc){
    S.me.loc=obDraft.loc;
  }
  S.onboarded=true;save();renderAll();loadDeck();loadConvos();obGo(10);
}
$("#ob-back").onclick=()=>obGo(obStep-1);
$("#ob-skip").onclick=()=>obGo(obStep+1);
function signOut(){
  if(LIVE)JammyAPI.auth.signOut();
  S.onboarded=false;S.account=null;save();
  obStep=0;obDraft={instruments:[],genres:[],goal:null,agreed:false,method:null};
  renderStep();$("#onb").classList.add("on");
}

/* ============ picking up where you left off ============
   Supabase keeps the session on the device, so a returning user should
   land straight in the app. The case that matters more is the opposite:
   this phone thinks it's signed in but the session has expired or was
   ended elsewhere. Carrying on would show a full app where every single
   request fails. Better to ask them to sign in again. */
async function resumeSession(){
  if(!LIVE)return;
  let s;
  try{ s=await JammyAPI.auth.session(); }catch(e){ return; }
  const live=!!(s&&s.data&&s.data.session);
  if(!live){
    if(S.onboarded){S.onboarded=false;S.account=null;save();renderAll()}
    obGo(0);$("#onb").classList.add("on");
    return;
  }
  const me=await DB.loadMe();
  if(me.data){
    adoptProfile(me.data);S.onboarded=true;save();
    $("#onb").classList.remove("on");renderAll();
    loadDeck();loadConvos();
    setTimeout(()=>locateOnLaunch(),250);
  }else{
    /* Signed in, but the profile was never finished — drop them back
       into onboarding at the first step after verification. */
    S.onboarded=false;save();
    obGo(3);$("#onb").classList.add("on");
  }
}

paintMode();
renderAll();
{const fab=$("#fab");if(fab)fab.hidden=false;}   /* feed is the landing tab */
/* locate on launch — after first paint, so the app is usable instantly
   and a slow GPS fix never holds up the UI */
if(S.onboarded)setTimeout(()=>locateOnLaunch(),250);
if(!S.onboarded){obGo(0);$("#onb").classList.add("on")}
else if(S.firstRun){S.firstRun=false;save();setTimeout(()=>toast("Swipe in Discover, play anything, the chart moves"),900)}
/* then let the server have the final say on whether we're signed in */
if(LIVE)resumeSession();
</script>
