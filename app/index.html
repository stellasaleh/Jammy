<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#120A0D" media="(prefers-color-scheme:dark)">
<meta name="theme-color" content="#F7F0E4" media="(prefers-color-scheme:light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jammy — find your band</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120A0D;
  --surface:#1E1318;
  --surface2:#2A1D22;
  --line:rgba(247,240,228,.13);
  --text:#F7F0E4;
  --dim:rgba(247,240,228,.56);
  --mag:#E5285C;
  --mag-dk:#B01344;
  --amber:#F58220;
  --mint:#F7F0E4;
  --ombre:linear-gradient(96deg,#E5285C 6%,#F2553F 52%,#F58220 96%);
  --glow:0 14px 40px -18px rgba(0,0,0,.85);
  --r:18px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
--bg:#F7F0E4;--surface:#FFFDF7;--surface2:#ECE0CE;--line:rgba(26,16,18,.15);
    --text:#1A1012;--dim:#6D5A55;--mag:#C9174A;--mag-dk:#A00F3A;--amber:#B85C08;--mint:#1A1012;
    --ombre:linear-gradient(96deg,#C9174A 6%,#D2402C 52%,#B85C08 96%);
    --glow:0 12px 30px -18px rgba(26,16,18,.45);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F7F0E4;--surface:#FFFDF7;--surface2:#ECE0CE;--line:rgba(26,16,18,.15);
  --text:#1A1012;--dim:#6D5A55;--mag:#C9174A;--mag-dk:#A00F3A;--amber:#B85C08;--mint:#1A1012;
  --ombre:linear-gradient(96deg,#C9174A 6%,#D2402C 52%,#B85C08 96%);
  --glow:0 12px 30px -18px rgba(26,16,18,.45);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:"Inter Tight","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

/* Form controls do NOT inherit colour from their parent — browsers apply their
   own default, which is black. On a dark background that made typed text
   invisible. This sets it for every control in the app, present and future.
   -webkit-text-fill-color is needed as well because iOS Safari ignores
   `color` on inputs in some states, and it is what greys out disabled fields. */
input,textarea,select{
  font-family:inherit;font-size:16px;              /* 16px stops iOS zooming on focus */
  color:var(--text);
  -webkit-text-fill-color:var(--text);
  caret-color:var(--mag);
  background-color:var(--surface);
}
input::placeholder,textarea::placeholder{color:var(--dim);-webkit-text-fill-color:var(--dim);opacity:1}
input:disabled,textarea:disabled,select:disabled{
  color:var(--dim);-webkit-text-fill-color:var(--dim);opacity:.65}
select option{color:var(--text);background-color:var(--surface)}
/* iOS turns autofilled fields a hard yellow-white with black text */
input:-webkit-autofill,input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--text);
  box-shadow:0 0 0 1000px var(--surface) inset;
  caret-color:var(--mag);
}
/* date and time pickers render their own icon, dark-on-dark by default */
input[type="date"],input[type="time"]{color-scheme:inherit}
input[type="file"]{color:var(--dim);-webkit-text-fill-color:var(--dim)}
:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
.app{position:relative;height:100%;max-width:500px;margin:0 auto;display:flex;flex-direction:column;
  background:var(--bg);overflow:hidden}
@media (min-width:1000px){
  body{background:radial-gradient(900px 500px at 50% -10%,rgba(229,40,92,.18),transparent 70%),var(--bg)}
  .app{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

/* ---------- top bar ---------- */
.top{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px 10px;border-bottom:1px solid var(--line);
  background:var(--bg);position:relative;z-index:5}
.word{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;letter-spacing:-.045em;
  background:var(--ombre);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .ctx{font-size:13px;color:var(--dim);font-weight:500}
.top .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pip{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--mag)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:18px}

/* ---------- tab bar ---------- */
nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px)}
nav button{padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--dim);position:relative}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--mag)}

nav .nb{position:absolute;top:4px;right:calc(50% - 20px);background:var(--mag);color:#fff;font-size:9.5px;font-weight:700;
  min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* ---------- mini player ---------- */
#mini{flex:none;display:none;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);
  background:linear-gradient(90deg,rgba(229,40,92,.16),rgba(255,199,90,.10));position:relative;overflow:hidden}
#mini.on{display:flex}
#mini .cov{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none}
#mini .cov svg{width:100%;height:100%;display:block}
#mini .t{flex:1;min-width:0}
#mini .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .t span{display:block;font-size:11.5px;color:var(--dim)}
#mini .eq{display:flex;align-items:flex-end;gap:2px;height:18px;flex:none;margin-right:2px}
#mini .eq i{width:3px;background:var(--mag);border-radius:2px;animation:bounce .9s ease-in-out infinite}
#mini .eq i:nth-child(2){animation-delay:.15s}#mini .eq i:nth-child(3){animation-delay:.3s}#mini .eq i:nth-child(4){animation-delay:.45s}
@keyframes bounce{0%,100%{height:5px}50%{height:17px}}
@media (prefers-reduced-motion:reduce){#mini .eq i{animation:none;height:11px}}
.pbtn{width:34px;height:34px;border-radius:50%;background:transparent;border:1.4px solid currentColor;display:grid;place-items:center;flex:none;color:var(--text)}
.pbtn svg{width:13px;height:13px;fill:currentColor;stroke:none}

/* ---------- shared bits ---------- */
.cov{background:var(--surface2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--surface2);color:var(--dim);border:1px solid var(--line)}
.chip.mag{background:rgba(229,40,92,.14);color:var(--mag);border-color:rgba(229,40,92,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--mag);color:#fff;
  font-weight:600;font-size:14.5px;padding:11px 18px;border-radius:14px;box-shadow:none}
.btn.ghost{background:var(--surface2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.amber{background:var(--amber);color:#1C0A02;box-shadow:none}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sechead{display:flex;align-items:baseline;gap:8px;padding:16px 16px 8px}
.sechead h2{font-size:19px}
.sechead .more{margin-left:auto;font-size:12.5px;color:var(--mag);font-weight:600}
.av{border-radius:50%;overflow:hidden;flex:none;background:var(--surface2)}
.av svg{width:100%;height:100%;display:block}
.dimtext{color:var(--dim)}
.empty{padding:40px 24px;text-align:center;color:var(--dim)}
.empty h3{font-size:18px;color:var(--text);margin-bottom:6px}

/* ---------- feed ---------- */
.stories{display:flex;gap:12px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:62px;text-align:center}
.story .ring{width:58px;height:58px;border-radius:50%;padding:2px;background:var(--ombre)}
.story .ring .av{width:100%;height:100%;border:2px solid var(--bg)}
.story span{display:block;font-size:10.5px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story.live .ring{background:var(--mag)}
.story .lv{display:block;margin:-9px auto 0;position:relative;background:var(--mag);color:#fff;font-size:8.5px;font-weight:700;
  padding:1px 5px;border-radius:4px;width:max-content;letter-spacing:.04em}
.post{padding:14px 16px;border-bottom:1px solid var(--line)}
.prow{display:flex;gap:10px;align-items:center}
.prow .av{width:42px;height:42px}
.pn{flex:1;min-width:0}
.pn b{font-size:14.5px;display:block;line-height:1.2}
.pn span{font-size:12px;color:var(--dim)}
.ptxt{margin:10px 0 0;font-size:15px;white-space:pre-wrap}
.media{margin-top:11px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line)}
.media svg{width:100%;display:block;aspect-ratio:16/10}
.media .ov{position:absolute;inset:0;display:flex;align-items:flex-end;padding:12px;gap:10px;
  background:linear-gradient(transparent 45%,rgba(8,2,8,.78))}
.media .ov .t{flex:1;min-width:0;color:#fff}
.media .ov .t b{display:block;font-size:14.5px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.media .ov .t span{font-size:11.5px;opacity:.85}
.vtag{position:absolute;top:10px;left:10px;background:rgba(10,3,10,.7);backdrop-filter:blur(6px);color:#fff;
  font-size:11px;font-weight:600;padding:3px 8px;border-radius:8px;display:flex;gap:5px;align-items:center}
.vtag svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.pacts{display:flex;gap:18px;margin-top:11px;align-items:center;font-size:12.5px;font-weight:600;color:var(--dim)}
.pacts button{display:flex;align-items:center;gap:6px;color:var(--dim)}
.pacts button.on{color:var(--mag)}
.pacts svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pacts button.on svg{fill:currentColor}
.pacts .connect{margin-left:auto;color:var(--mag);border:1px solid rgba(229,40,92,.4);padding:5px 12px;border-radius:999px;font-size:12.5px}
.pacts .connect.done{color:var(--mint);border-color:var(--line)}

/* sponsored */
.ad{border-left:3px solid var(--amber)}
.adlabel{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--amber);margin-bottom:9px}
.adlabel .sq{width:5px;height:5px;background:var(--amber);border-radius:1px}
.ad .btn{margin-top:11px;width:100%}
.ad.venue{border-left-color:var(--mint)}
.ad.venue .adlabel{color:var(--mint)}
.ad.venue .adlabel .sq{background:var(--mint)}

/* ---------- discover ---------- */
.deck{flex:1;min-height:0;position:relative;padding:12px 14px}
.dcard{position:absolute;inset:12px 14px;border-radius:24px;overflow:hidden;background:var(--surface);
  border:1px solid var(--line);box-shadow:0 20px 50px -24px rgba(0,0,0,.8);touch-action:pan-y;
  display:flex;flex-direction:column;will-change:transform}
.dcard.s1{transform:translateY(10px) scale(.96);filter:brightness(.8)}
.dcard.s2{transform:translateY(20px) scale(.92);filter:brightness(.6)}
.dcard.fly{transition:transform .4s cubic-bezier(.3,.7,.3,1),opacity .4s}
.dcard .hero{position:relative;flex:1;min-height:0}
.dcard .hero svg{position:absolute;inset:0;width:100%;height:100%}
.dcard .info{position:relative;padding:14px 16px 12px;background:linear-gradient(transparent,var(--surface) 22%),var(--surface);margin-top:-52px;z-index:2}
.dcard h2{font-size:26px;line-height:1.05;display:flex;align-items:baseline;gap:8px}
.dcard h2 em{font-style:normal;font-family:"Inter Tight";font-weight:500;font-size:16px;color:var(--dim)}
.dcard .role{color:var(--mag);font-weight:600;font-size:14.5px;margin-top:3px}
.dcard .bio{font-size:14px;color:var(--dim);margin:9px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dcard .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dcard .trk{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:26px;overflow:hidden}
.wave i{flex:1;min-width:1px;background:var(--surface2);border-radius:1px}
.wave i.hit{background:var(--mag)}
.badge-dist{position:absolute;top:12px;left:12px;background:rgba(10,3,10,.6);backdrop-filter:blur(8px);
  color:#fff;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px}
.stamp{position:absolute;top:26px;font-family:"Bricolage Grotesque";font-weight:800;font-size:26px;letter-spacing:-.02em;
  padding:6px 14px;border:3px solid;border-radius:12px;opacity:0;pointer-events:none;z-index:3;backdrop-filter:blur(3px)}
.stamp.y{left:18px;transform:rotate(-12deg);color:var(--mag);border-color:var(--mag);background:rgba(229,40,92,.12)}
.stamp.n{right:18px;transform:rotate(12deg);color:var(--dim);border-color:var(--dim)}
.dacts{flex:none;display:flex;justify-content:center;gap:16px;padding:10px 0 14px}
.dacts button{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.dacts button svg{width:24px;height:24px;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.dacts .no svg{stroke:var(--dim)}
.dacts .hear{width:48px;height:48px;align-self:center;background:var(--surface2)}
.dacts .hear svg{stroke:var(--amber);width:20px;height:20px}
.dacts .yes{background:var(--mag);border-color:transparent;box-shadow:none}
.dacts .yes svg{stroke:#fff}
.dacts button:active{transform:scale(.93)}

/* ---------- bands ---------- */
#bandlist,#bandview{position:absolute;inset:0;z-index:32;display:none;flex-direction:column;background:var(--bg)}
#bandlist.on,#bandview.on{display:flex}
.bgroup{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--dim);padding:16px 16px 7px}
.brow{display:flex;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.brow .bart{width:54px;height:54px;border-radius:15px;overflow:hidden;flex:none}
.brow .bart svg{width:100%;height:100%;display:block}
.brow .t{flex:1;min-width:0}
.brow .t b{display:block;font-size:15.5px;line-height:1.2}
.brow .t span{display:block;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .t .up{color:var(--amber);font-weight:600}
.brow .chev{width:17px;height:17px;flex:none;fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round}
.bhero{position:relative;height:150px}
.bhero svg{position:absolute;inset:0;width:100%;height:100%}
.bhero .fade{position:absolute;inset:0;background:linear-gradient(transparent 25%,var(--bg))}
.bhead{padding:0 16px;margin-top:-38px;position:relative}
.bhead h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.05}
.bhead .meta{font-size:13px;color:var(--dim);margin-top:4px}
.bhead .role{display:inline-block;margin-top:9px;font-size:12px;font-weight:600;color:var(--mag);
  border:1px solid var(--mag);border-radius:999px;padding:3px 11px}
.nextup{margin:14px 16px 0;border-radius:16px;border:1px solid var(--line);overflow:hidden}
.nextup .bar{padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.06em;
  background:var(--amber);color:#1C0A02;display:flex;justify-content:space-between}
.nextup.gigbar .bar{background:var(--mag);color:#fff}
.nextup .in{padding:13px 14px}
.nextup .in h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em}
.nextup .in .w{font-size:13.5px;color:var(--dim);margin-top:3px}
.nextup .note{font-size:13px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);color:var(--dim)}
.yourjob{display:flex;gap:9px;align-items:flex-start;margin-top:10px;padding:10px 11px;border-radius:12px;
  background:var(--surface2)}
.yourjob svg{width:15px;height:15px;flex:none;margin-top:2px;fill:none;stroke:var(--mag);stroke-width:2}
.yourjob b{font-size:10px;letter-spacing:.06em;color:var(--mag);display:block;margin-bottom:2px}
.yourjob span{font-size:13px}
.evrow{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line)}
.evrow .when{width:56px;flex:none;text-align:center}
.evrow .when b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;line-height:1.1}
.evrow .when span{font-size:10px;color:var(--dim);font-family:"JetBrains Mono",monospace}
.evrow .what{flex:1;min-width:0}
.evrow .what b{display:block;font-size:14.5px}
.evrow .what span{display:block;font-size:12.5px;color:var(--dim)}
.evtype{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:999px;flex:none;
  border:1px solid var(--line);color:var(--dim)}
.evtype.gig{color:var(--mag);border-color:var(--mag)}
.evtype.practice{color:var(--amber);border-color:var(--amber)}
.mrow2{display:flex;gap:11px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.mrow2 .av{width:42px;height:42px}
.mrow2 .ph{width:42px;height:42px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;
  font-size:14px;font-weight:700;color:var(--dim);flex:none}
.mrow2 .t{flex:1;min-width:0}
.mrow2 .t b{display:block;font-size:14.5px}
.mrow2 .t span{display:block;font-size:12.5px;color:var(--dim)}
.mrow2 .tagme{font-size:10px;font-weight:700;color:var(--mag);border:1px solid var(--mag);border-radius:999px;padding:1px 7px}
.inforow{display:flex;justify-content:space-between;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.inforow span:first-child{color:var(--dim)}
.inforow span:last-child{text-align:right;font-weight:500}
.statbtn{cursor:pointer}
.statbtn:active{background:var(--surface2)}

/* alerts */
.alert{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.alert .ic{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--surface2)}
.alert .ic svg{width:17px;height:17px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.alert.prac .ic svg{stroke:var(--amber)}
.alert.gig .ic svg{stroke:var(--mag)}
.alert .t{flex:1;min-width:0}
.alert .t b{display:block;font-size:14px;margin-bottom:2px;line-height:1.35}
.alert .t span{font-size:12.5px;color:var(--dim);line-height:1.45}
.alert .t .ago{font-size:11px;color:var(--amber);font-weight:600;margin-top:3px;display:block}
.alert.unread .t b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--mag);margin-left:6px;vertical-align:middle}

/* filter sheet */
.slider{width:100%;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:var(--surface2);margin:14px 0 6px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--mag);
  border:3px solid var(--bg);cursor:pointer}
.slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--mag);border:3px solid var(--bg);cursor:pointer}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);font-family:"JetBrains Mono",monospace}
.ticks span.on{color:var(--mag);font-weight:700}
.radval{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1}
.radval em{font-style:normal;font-size:14px;font-family:"Inter Tight";font-weight:500;color:var(--dim)}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.toggle .tx{flex:1}
.toggle .tx b{display:block;font-size:14.5px}
.toggle .tx span{font-size:12.5px;color:var(--dim);line-height:1.45}
.sw{width:44px;height:26px;border-radius:999px;background:var(--surface2);position:relative;flex:none;
  border:1px solid var(--line);transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--dim);transition:left .18s,background .18s}
.toggle.on .sw{background:var(--mag);border-color:transparent}
.toggle.on .sw::after{left:21px;background:#fff}
.venn{display:block;width:100%;max-width:260px;margin:6px auto 2px}

/* ---------- radio ---------- */
.nowplaying{margin:14px 16px 0;border-radius:22px;overflow:hidden;position:relative;background:var(--surface);border:1px solid var(--line)}
.nowplaying .art{position:relative;aspect-ratio:1.5;}
.nowplaying .art svg{position:absolute;inset:0;width:100%;height:100%}
.nowplaying .lbl{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;
  background:rgba(10,3,10,.55);backdrop-filter:blur(8px);padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff}
.nowplaying .lbl .live{width:7px;height:7px;border-radius:50%;background:var(--mag);box-shadow:0 0 0 0 rgba(229,40,92,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(229,40,92,0)}100%{box-shadow:0 0 0 0 rgba(229,40,92,0)}}
@media (prefers-reduced-motion:reduce){.nowplaying .lbl .live{animation:none}}
.nowplaying .bot{padding:14px 16px;display:flex;align-items:center;gap:12px}
.nowplaying .bot .t{flex:1;min-width:0}
.nowplaying .bot h3{font-size:19px;line-height:1.15}
.nowplaying .bot span{font-size:13px;color:var(--dim)}
.lbrow{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.lbrow .rank{width:26px;text-align:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:18px;color:var(--dim)}
.lbrow.top1 .rank{color:var(--amber)}.lbrow.top2 .rank,.lbrow.top3 .rank{color:var(--mag)}
.lbrow .cov{width:46px;height:46px;border-radius:12px;overflow:hidden;flex:none}
.lbrow .cov svg{width:100%;height:100%}
.lbrow .t{flex:1;min-width:0}
.lbrow .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbrow .t span{font-size:12px;color:var(--dim)}
.mv{font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:3px}
.mv.up{color:var(--mint)}.mv.dn{color:var(--dim)}.mv.new{color:var(--amber)}
.lbrow.me{background:linear-gradient(90deg,rgba(229,40,92,.12),transparent)}
.pills{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--dim)}
.pill.on{background:var(--mag);color:#fff;border-color:transparent}

/* ---------- chats ---------- */
.crow{display:flex;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.crow .av{width:52px;height:52px;position:relative}
.crow .stack{width:52px;height:52px;flex:none;position:relative}
.crow .stack .av{width:34px;height:34px;position:absolute;border:2px solid var(--bg)}
.crow .stack .av:nth-child(1){top:0;left:0}
.crow .stack .av:nth-child(2){bottom:0;right:0}
.crow .t{flex:1;min-width:0}
.crow .t b{display:block;font-size:15px}
.crow .t span{display:block;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .r{text-align:right;flex:none}
.crow .r i{font-style:normal;font-size:11px;color:var(--dim);display:block}
.crow .r .u{margin-top:5px;background:var(--mag);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;display:inline-block}
#chat,#call,#sheet{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:var(--bg)}
#chat.on,#call.on,#sheet.on{display:flex}
.chead{flex:none;display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.chead .av{width:38px;height:38px}
.chead .t{flex:1;min-width:0}
.chead .t b{display:block;font-size:15px;line-height:1.2}
.chead .t span{font-size:11.5px;color:var(--dim)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.4}
.msg.them{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--mag);color:#fff;border-bottom-right-radius:6px}
.msg .who{display:block;font-size:11px;font-weight:700;color:var(--mag);margin-bottom:2px}
.msg.sending{opacity:.6}
.msg.failed{border:1px solid var(--mag);cursor:pointer}
.mstate{display:block;font-size:10.5px;opacity:.75;margin-top:3px;letter-spacing:.02em}
.msg.sys{align-self:center;background:transparent;color:var(--dim);font-size:12px;text-align:center;max-width:90%}
.msg .attach{display:flex;gap:9px;align-items:center;margin-top:7px;background:rgba(0,0,0,.2);border-radius:12px;padding:8px}
.msg .attach .cov{width:36px;height:36px;border-radius:8px;overflow:hidden}
.typing{align-self:flex-start;font-size:12.5px;color:var(--dim);padding:2px 6px}
.cbar{flex:none;display:flex;gap:8px;padding:9px 10px;border-top:1px solid var(--line);background:var(--surface);align-items:center}
.cbar input{flex:1;min-width:0;background-color:var(--surface2);border:1px solid var(--line);
  border-radius:999px;padding:10px 15px;font-size:16px;color:var(--text);-webkit-text-fill-color:var(--text)}
.cbar .send{width:40px;height:40px;border-radius:50%;background:var(--mag);display:grid;place-items:center;flex:none}
.cbar .send svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- call ---------- */
#call{background:#08040A}
.grid{flex:1;min-height:0;display:grid;gap:6px;padding:6px;grid-template-columns:1fr 1fr}
.tile{position:relative;border-radius:16px;overflow:hidden;background:#150A1A;display:grid;place-items:center}
.tile svg.face{width:100%;height:100%;position:absolute;inset:0;opacity:.85}
.tile video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.tile .nm{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);
  color:#fff;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:8px;display:flex;gap:6px;align-items:center}
.tile .nm svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.tile.speaking{box-shadow:inset 0 0 0 2.5px var(--mag)}
.callhead{flex:none;padding:10px 16px;display:flex;align-items:center;gap:10px;color:#fff}
.callhead .t b{display:block;font-size:15px}
.callhead .t span{font-size:11.5px;color:rgba(247,240,228,.56)}
.studio{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(229,40,92,.15);
  border:1px solid rgba(229,40,92,.4);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:600;color:#FFB5DC}
.studio .sw{width:30px;height:17px;border-radius:999px;background:var(--mag);position:relative;transition:background .2s}
.studio .sw::after{content:"";position:absolute;top:2px;left:15px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .2s}
.studio.off{background:rgba(247,240,228,.07);border-color:rgba(247,240,228,.16);color:rgba(247,240,228,.56)}
.studio.off .sw{background:rgba(255,255,255,.25)}
.studio.off .sw::after{left:2px}
.callinfo{padding:0 16px 8px;font-size:11.5px;color:#8E7797;display:flex;gap:12px;flex-wrap:wrap}
.callinfo b{color:var(--mint);font-weight:600}
.callacts{flex:none;display:flex;justify-content:center;gap:14px;padding:12px 0 18px}
.callacts button{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}
.callacts button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.callacts button.off{background:#fff;color:#08040A}
.callacts .end{background:#FF2D55;width:64px}

/* ---------- sheets / profile ---------- */
#sheet{background:rgba(6,2,8,.6);backdrop-filter:blur(6px);justify-content:flex-end}
.sheetbody{background:var(--bg);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:8px 16px 20px;
  max-height:88%;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.grabber{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--dim);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background-color:var(--surface);
  border:1px solid var(--line);border-radius:13px;padding:11px 13px;font-size:16px;
  color:var(--text);-webkit-text-fill-color:var(--text)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--mag);outline:none}
.field textarea{height:92px;resize:none}
.hero-profile{position:relative;height:190px}
.hero-profile svg{position:absolute;inset:0;width:100%;height:100%}
.hero-profile .fade{position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--bg))}
.pstats{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px}
.pstats div{flex:1;padding:13px 6px;text-align:center;border-right:1px solid var(--line)}
.pstats div:last-child{border-right:0}
.pstats b{display:block;font-family:"Bricolage Grotesque";font-weight:800;font-size:21px;line-height:1}
.pstats span{font-size:11px;color:var(--dim)}
.tracklist{padding:0 16px}
.trow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow .cov{width:44px;height:44px;border-radius:11px;overflow:hidden;flex:none}
.trow .t{flex:1;min-width:0}
.trow .t b{display:block;font-size:14.5px}
.trow .t span{font-size:12px;color:var(--dim)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));
  background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:999px;
  font-size:13.5px;font-weight:500;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(6,2,8,.8)}
#modal.on{display:flex}
.msheet{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center;box-shadow:var(--glow)}
.msheet h2{font-size:30px;line-height:1;margin-bottom:8px;background:var(--ombre);-webkit-background-clip:text;background-clip:text;color:transparent}
.msheet p{color:var(--dim);font-size:14.5px;margin:0 0 18px}
.msheet .pair{display:flex;justify-content:center;margin-bottom:16px}
.msheet .pair .av{width:88px;height:88px;border:3px solid var(--bg)}
.msheet .pair .av:last-child{margin-left:-22px}
.msheet .btn{width:100%;margin-bottom:9px}
@media (prefers-reduced-motion:no-preference){#modal.on .msheet{animation:pop .35s cubic-bezier(.2,1.3,.4,1)}}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
/* ---------- onboarding ---------- */
#onb{position:fixed;inset:0;z-index:95;display:none;flex-direction:column;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#onb.on{display:flex}
.obar{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px 8px}
.obar .back{width:32px;height:32px;display:grid;place-items:center;color:var(--dim)}
.obar .back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prog{flex:1;height:3px;border-radius:2px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--mag);border-radius:2px;transition:width .35s cubic-bezier(.3,.8,.3,1)}
.obar .skip{font-size:13px;font-weight:600;color:var(--dim)}
.obody{flex:1;min-height:0;overflow-y:auto;padding:14px 22px 20px;display:flex;flex-direction:column}
.obody h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:29px;line-height:1.05;letter-spacing:-.03em;margin:0 0 9px}
.obody .sub{color:var(--dim);font-size:15px;margin:0 0 20px;max-width:34ch}
.ofoot{flex:none;padding:10px 22px calc(18px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.ofoot .btn{width:100%}
.ofoot .fine{font-size:11.5px;color:var(--dim);text-align:center;margin:10px 0 0;line-height:1.5}
.btn[disabled]{opacity:.35;pointer-events:none}
.splash{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;padding:0 10px}
.splash .lw{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:58px;letter-spacing:-.05em;line-height:1;
  background:var(--ombre);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash p{color:var(--dim);font-size:16.5px;max-width:28ch;margin:8px 0 0}
.splash .free{margin-top:18px;font-size:13px;font-weight:600;color:var(--mag);border:1px solid rgba(229,40,92,.4);
  padding:7px 16px;border-radius:999px}
.authbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:600;margin-bottom:9px}
.authbtn svg{width:18px;height:18px}
.authbtn.primary{background:var(--mag);border-color:transparent;color:#fff;box-shadow:none}
.codebox{display:flex;gap:8px;justify-content:space-between;margin:4px 0 16px}
.codebox input{width:100%;aspect-ratio:.78;text-align:center;font-size:24px;font-weight:700;
  background-color:var(--surface);border:1px solid var(--line);border-radius:13px;
  color:var(--text);-webkit-text-fill-color:var(--text);font-family:"Bricolage Grotesque",sans-serif}
.codebox input:focus{border-color:var(--mag);outline:none}
/* A single field rather than a row of one-character boxes. Six boxes assume
   the code is six long — it isn't always — and they fight with pasting,
   which is how most people enter a code they've just been emailed. */
.codein{width:100%;text-align:center;font-size:30px;font-weight:700;letter-spacing:10px;
  padding:16px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);
  color:var(--text);-webkit-text-fill-color:var(--text);caret-color:var(--mag);
  font-family:"JetBrains Mono",ui-monospace,monospace;margin:4px 0 14px}
.codein:focus{border-color:var(--mag);outline:none}
.codein::placeholder{color:var(--dim);letter-spacing:6px}
/* Onboarding errors stay on screen. A toast that fades after three seconds
   is fine for "message sent"; it is the wrong place for the reason someone
   cannot get into the app. */
.oberr{display:none;margin:0 0 12px;padding:12px 14px;border-radius:12px;
  background:rgba(229,40,92,.12);border:1px solid var(--mag);color:var(--text);
  font-size:14px;line-height:1.5}
.oberr.on{display:block}
.oberr b{display:block;margin-bottom:3px}
.oberr code{display:block;margin-top:7px;font-family:"JetBrains Mono",monospace;
  font-size:11px;opacity:.75;word-break:break-word;white-space:pre-wrap}
.pickgrid{display:flex;flex-wrap:wrap;gap:8px}
.pick{padding:9px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:14px;font-weight:600;color:var(--dim)}
.pick.on{background:rgba(229,40,92,.15);border-color:var(--mag);color:var(--mag)}
.oprime{text-align:center;padding:10px 0 4px}
.oprime .ic{width:82px;height:82px;border-radius:26px;margin:0 auto 20px;display:grid;place-items:center;
  background:rgba(229,40,92,.13);border:1px solid rgba(229,40,92,.3)}
.oprime .ic svg{width:36px;height:36px;fill:none;stroke:var(--mag);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rulelist{display:flex;flex-direction:column;gap:14px;margin:4px 0 18px}
.rule{display:flex;gap:12px;align-items:flex-start}
.rule .n{width:24px;height:24px;flex:none;border-radius:8px;background:rgba(229,40,92,.15);color:var(--mag);
  display:grid;place-items:center;font-size:13px;font-weight:700}
.rule b{display:block;font-size:14.5px;margin-bottom:2px}
.rule span{font-size:13px;color:var(--dim);line-height:1.45}
.agree{display:flex;gap:11px;align-items:flex-start;padding:13px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.agree .box{width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid var(--dim);display:grid;place-items:center;margin-top:1px}
.agree.on .box{background:var(--mag);border-color:var(--mag)}
.agree .box svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.agree.on .box svg{opacity:1}
.agree p{margin:0;font-size:13px;color:var(--dim);line-height:1.5}
.blocked{text-align:center;padding:30px 0}
.blocked h1{font-size:25px}
.fab[hidden]{display:none}
.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:19px;background:var(--mag);
  display:grid;place-items:center;box-shadow:var(--glow);z-index:6}
.fab svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="word">Jammy</div>
    <div class="ctx" id="ctx">Boston · 12 online</div>
    <span class="modepill" id="modepill" hidden>DEMO</span>
    <div class="right">
      <button class="iconbtn" id="b-search" aria-label="Search musicians and bands"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button class="iconbtn" id="b-theme" aria-label="Switch appearance"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
      <button class="iconbtn" id="b-alerts" aria-label="Notifications"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-2 8-2 8h16s-2-1-2-8"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg><span class="pip"></span></button>
    </div>
  </header>

  <main>
    <!-- FEED -->
    <section class="view on" id="v-feed">
      <div class="scroll">
        <div class="stories" id="stories"></div>
        <div id="feed"></div>
      </div>
    </section>

    <!-- DISCOVER -->
    <section class="view" id="v-disc">
      <div class="fbar">
        <button class="fchip" id="f-open"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M7 12h10M10 18h4"/></svg><span id="f-summary">Within 7 mi</span></button>
        <div class="vswitch">
          <button id="v-deck" class="on">Deck</button>
          <button id="v-radar">Rings</button>
        </div>
      </div>
      <div class="deck" id="deck"></div>
      <div class="radar" id="radar"></div>
      <div class="dacts">

/* ---------- geography ---------- */
function toRad(d){return d*Math.PI/180}
function distMiles(a,b){
  const R=3958.8,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a,b){
  const y=Math.sin(toRad(b.lng-a.lng))*Math.cos(toRad(b.lat));
  const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lng-a.lng));
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function myLoc(){return (S.me&&S.me.loc)||HOME}
/* Live rows arrive with the distance already worked out by the database,
   which is the only version worth trusting: the server never sends another
   person's coordinates, so there is nothing here to measure from. */
function distTo(a){
  if(a&&typeof a._miles==="number")return a._miles;
  return distMiles(myLoc(),{lat:a.lat,lng:a.lng});
}
function distLabel(mi){return mi<1?(Math.round(mi*10)/10)+" mi":mi<10?mi.toFixed(1)+" mi":Math.round(mi)+" mi"}

/* ============================================================
   LOCATION
   Order of attempts on every launch:
     1. a cached fix less than an hour old  (free, instant, no prompt)
     2. GPS                                 (coarse accuracy — a distance
                                              ring doesn't need 5 metres,
                                              and coarse is faster, kinder
                                              to the battery, and more private)
     3. IP lookup                            (city level, ~25 mile accuracy)
     4. the city the user typed at signup
     5. a manual picker, so nobody is ever stuck

   iOS and Android only ever show the permission dialog ONCE. After a
   refusal the OS silently rejects every later call, so re-prompting on
   each launch does nothing except waste time. We attempt a read each
   launch, and if permission was refused we fall through quietly and
   offer the manual picker instead of nagging.
   ============================================================ */
const LOC_FRESH_MS=60*60*1000;       /* re-locate at most once an hour */
const LOC_TIMEOUT=8000;

/* coordinates are rounded to ~1km before they are ever stored or sent.
   exact coordinates in an app where strangers meet is a safety problem. */
const coarse=n=>Math.round(n*100)/100;

 ["Somerville",42.3876,-71.0995],["Jamaica Plain",42.3098,-71.1147],["Brighton",42.3464,-71.1627],
 ["Dorchester",42.2997,-71.0714],["Roxbury",42.3240,-71.0957],["East Boston",42.3702,-71.0389],
 ["South Boston",42.3331,-71.0450],["Brookline",42.3317,-71.1211],["Medford",42.4184,-71.1062],
 ["Quincy",42.2529,-71.0023],["Lynn",42.4668,-70.9495],["Worcester",42.2626,-71.8023],
 ["Providence, RI",41.8240,-71.4128],["Portland, ME",43.6591,-70.2568],["New York, NY",40.7128,-74.0060],
 ["Chicago, IL",41.8781,-87.6298],["Los Angeles, CA",34.0522,-118.2437],["Austin, TX",30.2672,-97.7431],
 ["Nashville, TN",36.1627,-86.7816],["Seattle, WA",47.6062,-122.3321],["Atlanta, GA",33.7490,-84.3880]

function locFresh(){
  const l=S.me&&S.me.loc;
  return !!(l&&l.lat&&l.at&&(Date.now()-new Date(l.at).getTime())<LOC_FRESH_MS);
}
function setLoc(lat,lng,label,source){
  S.me.loc={lat:coarse(lat),lng:coarse(lng),label:label||"your area",
            source:source||"manual",at:new Date().toISOString()};
  save();
  if(LIVE&&window.JammyAPI)JammyAPI.profile.setLocation(S.me.loc.lat,S.me.loc.lng,S.me.loc.label);
  return S.me.loc;
}

function gpsOnce(){
  return new Promise(res=>{
    if(!navigator.geolocation)return res(null);
    let settled=false;
    const done=v=>{if(!settled){settled=true;res(v)}};
    /* permissions API, where supported, tells us whether a prompt will even
       appear — so we can skip a pointless call after a prior refusal */
    const go=()=>navigator.geolocation.getCurrentPosition(
      pos=>done({lat:pos.coords.latitude,lng:pos.coords.longitude,
                 acc:pos.coords.accuracy}),
      ()=>done(null),
      {enableHighAccuracy:false,timeout:LOC_TIMEOUT,maximumAge:10*60*1000});
    if(navigator.permissions&&navigator.permissions.query){
      navigator.permissions.query({name:"geolocation"})
        .then(st=>{if(st.state==="denied")done(null);else go()})
        .catch(go);
    }else go();
    setTimeout(()=>done(null),LOC_TIMEOUT+500);
  });
}

/* IP lookup. Routed through our own backend when live, so no third party
   gets a list of our users' addresses and no API key sits in the client.
   In the demo (and inside the artifact preview, where outside requests are
   blocked) this simply fails and we fall through to the next step. */
async function ipLocate(){
  try{
    if(LIVE&&window.JammyAPI){
      const {data,error}=await window.JammyAPI.sb.functions.invoke("geo-ip");
      if(!error&&data&&data.lat)return {lat:data.lat,lng:data.lng,label:data.city||"your area"};
      return null;
    }
    const ctl=new AbortController();
    setTimeout(()=>ctl.abort(),5000);
    const r=await fetch("https://ipapi.co/json/",{signal:ctl.signal});
    if(!r.ok)return null;
    const j=await r.json();
    if(!j||!j.latitude)return null;
    return {lat:j.latitude,lng:j.longitude,
            label:[j.city,j.region_code].filter(Boolean).join(", ")||"your area"};
  }catch(e){return null}
}

function cityFromName(name){
  if(!name)return null;
  const n=String(name).trim().toLowerCase();
  const hit=CITIES.find(c=>c[0].toLowerCase()===n)||CITIES.find(c=>c[0].toLowerCase().startsWith(n));
  return hit?{lat:hit[1],lng:hit[2],label:hit[0]}:null;
}

let locating=false;
async function locateOnLaunch(opts){
  opts=opts||{};
  if(locating)return S.me.loc;
  if(!opts.force&&locFresh())return S.me.loc;
  locating=true;
  try{
    const g=await gpsOnce();
    if(g){
      const near=CITIES.map(c=>[c,distMiles({lat:g.lat,lng:g.lng},{lat:c[1],lng:c[2]})])
        .sort((a,b)=>a[1]-b[1])[0];
      const label=(near&&near[1]<18)?near[0][0]:(S.me.city||"your area");
      setLoc(g.lat,g.lng,label,"gps");
      return S.me.loc;
    }
    const ip=await ipLocate();
    if(ip){setLoc(ip.lat,ip.lng,ip.label,"ip");return S.me.loc}

    const typed=cityFromName(S.me.city);
    if(typed){setLoc(typed.lat,typed.lng,typed.label,"city");return S.me.loc}

    if(!S.me.loc||!S.me.loc.lat)setLoc(HOME.lat,HOME.lng,HOME.label,"fallback");
    return S.me.loc;
  }finally{
    locating=false;
    paintLocBadge();
    if(S.filters&&S.filters.view)refreshDiscover();
  }
}

const LOC_LABEL={gps:"GPS",ip:"Approximate",city:"From your city",manual:"Set by you",fallback:"Default"};
function locSource(){return (S.me.loc&&S.me.loc.source)||"fallback"}
function paintLocBadge(){
  const el2=$("#ctx");
  if(!el2)return;

  if(document.querySelector("#v-disc.on")||document.querySelector("#v-feed.on"))

}

    <div class="locstate"><b>${esc(myLoc().label)}</b><span>${LOC_LABEL[src]}${
      src==="ip"?" — accurate to about 25 miles":src==="gps"?" — accurate to a block or so":""}</span></div>
    <button class="btn" id="lp-gps" style="width:100%;margin-bottom:9px">Use my exact location</button>
    <p class="dimtext" style="font-size:12px;margin:0 0 14px">If nothing happens, location permission is off for Jammy. Turn it on in your phone's Settings, or pick a city below.</p>
    <div class="field"><label>Or choose a city</label>
      <div class="pickgrid" id="lp-cities">${CITIES.map(c=>
        `<button class="pick${myLoc().label===c[0]?" on":""}" data-c="${esc(c[0])}">${esc(c[0])}</button>`).join("")}</div></div>
    <p class="dimtext" style="font-size:11.5px;margin:4px 0 0;line-height:1.5">Jammy stores your location rounded to about a mile and never shows anyone your coordinates — only how far away you are.</p>`;
  $("#sheet").classList.add("on");
  $("#lp-gps").onclick=async()=>{
    toast("Finding you…");
    const before=JSON.stringify(S.me.loc||{});
    await locateOnLaunch({force:true});
    if(JSON.stringify(S.me.loc||{})===before&&locSource()!=="gps")
      toast("Couldn't get GPS — pick a city instead");
    else toast("Located · "+myLoc().label);
    openLocationPicker();refreshDiscover();renderYou();
  };
  sb.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    const c=cityFromName(b.dataset.c);
    if(!c)return;
    setLoc(c.lat,c.lng,c.label,"manual");
    S.me.city=c.label;save();
    $("#sheet").classList.remove("on");
    refreshDiscover();renderYou();paintLocBadge();
    toast("Distances now measured from "+c.label);
  });
}

/* ---------- the overlap engine ---------- */
/* Only genuine duplicates collapse together. A trumpet player and a sax player are
   NOT the same instrument — that was a bug. Keys/Synths and Producer/Engineer do collapse. */
const SAME={Keys:"keys",Synths:"keys",Producer:"studio",Engineer:"studio",DJ:"studio"};
const fam=i=>SAME[i]||String(i).toLowerCase();
/* Sections are used for bonuses, never for exclusion. */
const SECTION={Sax:"horns",Trumpet:"horns",Trombone:"horns",Flute:"horns",
  Violin:"strings",Cello:"strings",Drums:"rhythm",Bass:"rhythm",Percussion:"rhythm",Tabla:"rhythm"};
const myInstruments=()=>(S.me.instruments&&S.me.instruments.length?S.me.instruments:String(S.me.role||"").split(/\s*·\s*/)).filter(Boolean);
const myGenres=()=>(S.me.genres||"").split(",").map(g=>g.trim()).filter(Boolean);

function overlap(a){
  /* The database already scored this person against you — same rules,
     but with both profiles in front of it. Recomputing here from a row
     that deliberately carries no coordinates and no availability would
     produce a worse answer, not a second opinion. */
  if(a&&typeof a._fit==="number"){
    const mine=myInstruments().map(fam);
    return {
      sharedGenres:a._shared||[],
      sameInstrument:(a.instruments||[]).some(i=>mine.includes(fam(i))),
      theyNeedMe:a._needsMe||[],
      iNeedThem:(S.filters.needs||[]).filter(n=>(a.instruments||[]).some(i=>fam(i)===fam(n))),
      sharedDays:[],
      mi:typeof a._miles==="number"?a._miles:0,
      score:Math.round(Math.min(100,a._fit))
    };
  }
  const mine=myInstruments(),myFams=mine.map(fam);
  const sharedGenres=myGenres().filter(g=>a.genres.some(x=>x.toLowerCase()===g.toLowerCase()));
  const sameInstrument=a.instruments.some(i=>myFams.includes(fam(i)));
  const theyNeedMe=a.seeking.filter(sk=>myFams.includes(fam(sk)));
  const iNeedThem=(S.filters.needs||[]).filter(n=>a.instruments.some(i=>fam(i)===fam(n)));
  const sharedDays=(S.me.days||[]).filter(d=>a.days.includes(d));
  const mi=distTo(a);
  let score=0;
  score+=Math.min(3,sharedGenres.length)*14;
  score+=theyNeedMe.length?24:0;
  const mySec=mine.map(i=>SECTION[i]).filter(Boolean);
  const sameSection=a.instruments.some(i=>mySec.includes(SECTION[i]));
  score+=sameSection&&!sameInstrument?10:0;
  score+=iNeedThem.length?20:0;
  score+=sameInstrument?0:12;
  score+=Math.max(0,14-mi*0.9);
  score+=sharedDays.length?8:0;
  return {sharedGenres,sameInstrument,theyNeedMe,iNeedThem,sharedDays,mi,
          score:Math.round(Math.min(100,score))};
}
function reasons(a,o){
  const r=[];
  if(o.theyNeedMe.length)r.push({t:"Needs a "+o.theyNeedMe[0].toLowerCase(),hot:true});
  if(o.iNeedThem.length)r.push({t:"Plays "+o.iNeedThem[0].toLowerCase(),hot:true});
  if(o.sharedGenres.length)r.push({t:o.sharedGenres.length+" shared "+(o.sharedGenres.length===1?"genre":"genres")});
  if(o.sharedDays.length)r.push({t:"Both free "+o.sharedDays[0]});
  if(isRemoteMatch(a))r.push({t:"Remote only — too far to rehearse"});
  else if(o.sharedDays.length===0&&a.days.length)r.push({t:"Different schedule"});
  return r.slice(0,3);
}

function ALLBANDS(){return BANDS.concat(S.myBands||[])}
function Bnd(id){return ALLBANDS().find(b=>b.id===id)}
function myBandList(){return ALLBANDS().filter(b=>S.joined.includes(b.id))}
function bandEvents(b){return (b.events||[]).concat((S.bandEvents&&S.bandEvents[b.id])||[]).sort((x,y)=>new Date(x.at)-new Date(y.at))}
function nextEvent(b){const now=Date.now();return bandEvents(b).find(e=>new Date(e.at)>=now)||null}
function bandMembers(b){return (b.members||[]).map(m=>m.id?{...m,p:A(m.id)}:{...m,p:null})}
/* In live mode the people on screen come from the database, not from the
   sixteen written-in demo musicians. LIVEPOOL holds whoever the server
   last sent; POOL() is what every screen should ask for. KNOWN keeps
   anyone we've ever seen, so a name still resolves after they drop out
   of the deck — in a message list, say, or on an old post. */
let LIVEPOOL=[];
const KNOWN=new Map();
function remember(list){(list||[]).forEach(p=>{if(p&&p.id)KNOWN.set(p.id,p)});return list}
const POOL=()=>LIVE?LIVEPOOL:ARTISTS;
const A=id=>POOL().find(x=>x.id===id)||KNOWN.get(id)||ARTISTS.find(x=>x.id===id)||
            (id==="me"||id===(S.me&&S.me.id)?S.me:null);

/* ---------- dates ---------- */
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function nextDow(dow,h,min){
  const d=new Date();d.setSeconds(0,0);
  let delta=(dow-d.getDay()+7)%7;
  if(delta===0&&(d.getHours()>h||(d.getHours()===h&&d.getMinutes()>min)))delta=7;
  d.setDate(d.getDate()+delta);d.setHours(h,min||0,0,0);
  return d.toISOString();
}
function plusDays(n,h,min){
  const d=new Date();d.setDate(d.getDate()+n);d.setHours(h,min||0,0,0);return d.toISOString();
}
function clock(iso){
  const d=new Date(iso),h=d.getHours(),m=d.getMinutes();
  const ap=h<12?"AM":"PM",hh=h%12===0?12:h%12;
  return hh+(m?":"+String(m).padStart(2,"0"):"")+" "+ap;
}
function dayPhrase(iso){
  const d=new Date(iso),now=new Date();
  const a=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const b=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const days=Math.round((a-b)/86400000);
  if(days===0)return "Today";
  if(days===1)return "Tomorrow";
  if(days<0)return Math.abs(days)+" days ago";
  if(days<7)return DOW[d.getDay()];
  if(days<14)return "Next "+DOW[d.getDay()];
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function whenPhrase(iso){
  const w=dayPhrase(iso);
  return /^(Today|Tomorrow|Next )/.test(w)?w.charAt(0).toLowerCase()+w.slice(1):w;
}
function countdown(iso){
  const ms=new Date(iso)-new Date();
  if(ms<0)return "done";
  const h=Math.round(ms/3600000);
  if(h<1)return "in "+Math.max(1,Math.round(ms/60000))+" min";
  if(h<24)return "in "+h+(h===1?" hour":" hours");
  const d=Math.round(h/24);
  return "in "+d+(d===1?" day":" days");
}

const NOTE={"C":261.63,"C#":277.18,"D":293.66,"D#":311.13,"E":329.63,"F":349.23,"F#":369.99,"G":392,"G#":415.3,"A":440,"A#":466.16,"B♭":466.16,"B":493.88};
let actx=null,nowPlaying=null,loopT=null,rafT=null;
function rootOf(k){const m=String(k).match(/^[A-G][#♭]?/);return NOTE[m?m[0]:"C"]||261.63}
function scaleOf(k){return /minor|dorian|hijaz/i.test(k)?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11]}
const ICON_PLAY='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
const ICON_PAUSE='<svg aria-hidden="true" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
function stopAudio(){
  if(loopT)clearInterval(loopT);loopT=null;
  if(rafT)cancelAnimationFrame(rafT);rafT=null;
  document.querySelectorAll(".wave i.hit").forEach(b=>b.classList.remove("hit"));
  document.querySelectorAll("[data-play]").forEach(b=>b.innerHTML=ICON_PLAY);
  nowPlaying=null;$("#mini").classList.remove("on");
}
function play(track,artist){
  const uid=(artist.id||"me")+":"+track.title;
  if(nowPlaying===uid){stopAudio();return}
  stopAudio();
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}
  catch(e){toast("Audio isn't available in this browser");return}
  nowPlaying=uid;
  S.plays[uid]=(S.plays[uid]||0)+1;save();
  $("#mini").classList.add("on");
  $("#mp-cov").innerHTML=art(hash(uid),initials(artist.name),{size:170,k:"m"});
  $("#mp-title").textContent=track.title;
  $("#mp-by").textContent=artist.name+" · "+track.key+" · "+track.bpm+" bpm";
  $("#mp-btn").innerHTML=ICON_PAUSE;
  document.querySelectorAll(`[data-play="${CSS.escape(uid)}"]`).forEach(b=>b.innerHTML=ICON_PAUSE);
  const root=rootOf(track.key),sc=scaleOf(track.key),r=rng(hash(uid)),step=60/track.bpm/2,steps=64;
  const pat=Array.from({length:8},()=>sc[Math.floor(r()*sc.length)]);
  const out=actx.createGain();out.gain.value=.15;
  const filt=actx.createBiquadFilter();filt.type="lowpass";filt.frequency.value=2400;filt.Q.value=.7;
  filt.connect(out);out.connect(actx.destination);
  function note(f,dur,type,g){
    const o=actx.createOscillator(),gn=actx.createGain(),t=actx.currentTime;
    o.type=type;o.frequency.value=f;
    gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(g,t+.01);
    gn.gain.exponentialRampToValueAtTime(.0006,t+dur);
    o.connect(gn);gn.connect(filt);o.start(t);o.stop(t+dur+.05);
  }
  let i=0;
  function tick(){
    const semi=pat[i%8];
    note(root*Math.pow(2,semi/12),step*1.7,"triangle",.45);
    if(i%8===0)note(root/2,step*2.4,"sine",.55);
    if(i%4===2)note(root*Math.pow(2,(semi+7)/12)*2,step,"sawtooth",.11);
    i++;if(i>=steps)stopAudio();
  }
  tick();loopT=setInterval(tick,step*1000);
  const waves=document.querySelectorAll(`[data-wave="${CSS.escape(uid)}"]`);
  if(waves.length){
    const total=steps*step*1000,t0=performance.now();
    const frame=t=>{const prog=Math.min(1,(t-t0)/total);
      waves.forEach(w=>{const bs=w.children;for(let k=0;k<bs.length;k++)bs[k].classList.toggle("hit",k/bs.length<=prog)});
      if(prog<1&&nowPlaying===uid)rafT=requestAnimationFrame(frame)};
    rafT=requestAnimationFrame(frame);
  }
}
$("#mp-btn").onclick=()=>stopAudio();
function waveBars(uid,n){
  const r=rng(hash(uid));let h="";
  for(let i=0;i<(n||40);i++){const v=20+Math.abs(Math.sin(i*.6))*45+r()*35;h+=`<i style="height:${Math.min(100,v)}%"></i>`}
  return `<div class="wave" data-wave="${esc(uid)}">${h}</div>`;
}

function relTime(iso){
  if(!iso)return "";
  const m=Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return "just now";
  if(m<60)return m+"m";
  const h=Math.floor(m/60); if(h<24)return h+"h";
  const d=Math.floor(h/24); if(d<7)return d+"d";
  return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function fieldChips(post){

  }).filter(Boolean).join("");
  return out?`<div class="fieldrow">${out}</div>`:"";
}

/* ---------- advertising ----------
   Businesses request a placement, you approve or decline it, and only
   approved ads enter rotation. Impressions and clicks are counted so an
   advertiser can see what they paid for — which is what makes them renew. */
const AD_PRICING=[
 {k:"venue_week",label:"Venue listing · 1 week",blurb:"A promoted post for a show, an open slot, or a room to rent.",price:40},
 {k:"venue_month",label:"Venue listing · 1 month",blurb:"Four weeks, better rate. Best for rehearsal spaces and regular nights.",price:120},
 {k:"brand_week",label:"Brand placement · 1 week",blurb:"For instrument shops, gear makers and music services.",price:75},
 {k:"brand_month",label:"Brand placement · 1 month",blurb:"Four weeks of placement, targeted by instrument and genre.",price:240}
];
const adStat=id=>(S.adStats&&S.adStats[id])||{imp:0,clicks:0};
function logImpression(id){
  S.adStats=S.adStats||{};
  const a=S.adStats[id]||{imp:0,clicks:0};
  a.imp++;S.adStats[id]=a;
  clearTimeout(logImpression._t);
  logImpression._t=setTimeout(save,1200);   /* batch the writes */
}
function liveAds(){
  const approved=(S.adRequests||[]).filter(r=>r.status==="live").map(r=>({
    id:r.id,kind:r.kind,sponsor:r.business,avatarSeed:r.business,
    headline:r.headline,body:r.body,cta:r.cta,url:r.url,image:r.image,custom:true
  }));
  return approved.concat(ADS);
}

const FEED_PAGE=12;
let feedShown=FEED_PAGE, feedTab="all";
const FEED_TABS=[["all","All"],["mine","Yours"],["looking","Looking for"],["show","Shows"],
                 ["track","Tracks"],["gear","Gear"],["space","Spaces"],["saved","Saved"]];
function feedFiltered(){
  const all=allPosts();
  if(feedTab==="all")return all;
  if(feedTab==="mine")return all.filter(p=>p.who==="me");
  if(feedTab==="saved")return all.filter(p=>(S.saved||{})[p.id]);
  return all.filter(p=>p.type===feedTab);
}
function renderFeed(){
  const f=$("#feed");f.innerHTML="";

  const tabs=el("div","pills feedtabs");
  FEED_TABS.forEach(([k,label])=>{
    const n=k==="all"?allPosts().length
      :k==="mine"?allPosts().filter(p=>p.who==="me").length
      :k==="saved"?allPosts().filter(p=>(S.saved||{})[p.id]).length
      :allPosts().filter(p=>p.type===k).length;
    const b=el("button","pill"+(feedTab===k?" on":""),label+(n?` <i>${n}</i>`:""));
    b.onclick=()=>{feedTab=k;feedShown=FEED_PAGE;renderFeed();};
    tabs.appendChild(b);
  });
  f.appendChild(tabs);

  const posts=feedFiltered();
  if(!posts.length){
    f.appendChild(el("div","empty",
      feedTab==="mine"
      ? `<h3>You haven't posted yet</h3><p>Tap the + button. Looking for a drummer is the most answered kind of post there is.</p>`
      : feedTab==="saved"
      ? `<h3>Nothing saved yet</h3><p>Tap the bookmark on any post to keep it here.</p>`
      : `<h3>No ${esc((FEED_TABS.find(t=>t[0]===feedTab)||[])[1]||"").toLowerCase()} posts yet</h3><p>Be the first — tap the + button.</p>`));
    renderStories();return;
  }
  let adi=0;
  posts.slice(0,feedShown).forEach((p,i)=>{
    f.appendChild(postEl(p));
    const pool=liveAds();
    if((i+1)%3===0&&pool[adi])f.appendChild(adEl(pool[adi++]));
  });
  if(posts.length>feedShown){
    const more=el("button","loadmore","Show more posts");
    more.style.margin="14px 16px";
    more.onclick=()=>{feedShown+=FEED_PAGE;renderFeed();};
    f.appendChild(more);
  }
  renderStories();
}
$("#feed").addEventListener("click",e=>{
  const lk=e.target.closest("[data-like]");
  if(lk){
    const id=lk.dataset.like, was=!!S.likes[id], next=!was;
    /* paint immediately — a like that waits on a round trip feels broken */
    S.likes[id]=next;save();renderFeed();
    DB.toggleLike(id,next).then(r=>{
      if(r.error){
        S.likes[id]=was;save();renderFeed();
        toast("Couldn't save that like — check your connection");
      }else renderFeed();
    });
    return;
  }
  const cm=e.target.closest("[data-cm]");
  if(cm){openComments(cm.dataset.cm);return}
  const cn=e.target.closest("[data-conn]");
  if(cn){connect(cn.dataset.conn);return}
  const adv=e.target.closest("[data-advertise]");
  if(adv){openAdvertise();return}
  const ad=e.target.closest("[data-ad]");
  if(ad){
    const id=ad.dataset.ad;
    S.adStats=S.adStats||{};
    const st=S.adStats[id]||{imp:0,clicks:0};st.clicks++;S.adStats[id]=st;save();
    const req=(S.adRequests||[]).find(r=>r.id===id);
    toast(req&&req.url?"Opening "+req.url:"Click logged — this is how Jammy stays free");
    return;
  }
  const pm=e.target.closest("[data-media]");
  if(pm){
    const card=pm.closest(".post");
    const id=pm.dataset.media;
    const post=allPosts().find(x=>x.media&&x.media.id===id);
    openMediaViewer(id,post);return;
  }
  const mo=e.target.closest("[data-more]");
  if(mo){openPostMenu(mo.dataset.more);return}
  const sv=e.target.closest("[data-save]");
  if(sv){const id=sv.dataset.save;S.saved=S.saved||{};S.saved[id]=!S.saved[id];save();renderFeed();
    toast(S.saved[id]?"Saved":"Removed from saved");return}
  const rp=e.target.closest("[data-reply]");
  if(rp){
    const post=allPosts().find(x=>x.id===rp.dataset.reply);
    if(!post)return;
    const t=PT(post.type);
    const opener=post.type==="looking"
      ? `Saw your post looking for ${(post.fields&&post.fields.instrument||"someone").toLowerCase()}. I play ${myInstruments().join(" and ")||"a bit of everything"} — still looking?`
      : post.type==="space" ? `Saw your post about the room${post.fields&&post.fields.where?" at "+post.fields.where:""}. Is it still free?`
      : post.type==="gear"  ? `Is the ${(post.fields&&post.fields.item||"item").toLowerCase()} still available?`
      : `Saw you're playing${post.fields&&post.fields.venue?" at "+post.fields.venue:""} — I'll try to come down.`;
    if(!connected(post.who))connect(post.who,true);
    go("chats");openChat(post.who);
    setTimeout(()=>{const i=$("#ch-input");if(i){i.value=opener;i.dispatchEvent(new Event("input"));i.focus()}},260);
    return;
  }
  const tr=e.target.closest("[data-track]");
  if(tr){const[w,ix]=tr.dataset.track.split("|");const who=w==="me"?S.me:A(w);
    if(who&&who.tracks&&who.tracks[+ix])play(who.tracks[+ix],who);return}
});
const SEED_COMMENTS={
 p1:[{who:"a2",t:"I'm in Somerville and free weekends. What's the set length?"},{who:"a14",t:"If Kai flakes, call me."}],
 p2:[{who:"a4",t:"That low end is filthy. What preamp?"},{who:"a3",t:"Sending you something tonight."}],
 p4:[{who:"a9",t:"Third session is where songs go to die. Agreed."}],
 p5:[{who:"a13",t:"Is the PA still there? I'd take Wednesdays."}]
};
function commentsOf(id){return (SEED_COMMENTS[id]||[]).concat(S.comments[id]||[]).filter(c=>c.who==="me"||!isBlocked(c.who))}
let commentWatch=null, commentPost=null;
function closeComments(){
  if(commentWatch){DB.stopWatching(commentWatch);commentWatch=null}
  commentPost=null;
}
function openComments(postId){
  const post=allPosts().find(p=>p.id===postId);if(!post)return;
  const sb=$("#sheetbody");
  commentPost=postId;
  let rows=[], loading=true;

  const paint=()=>{
    if(commentPost!==postId)return;
    sb.innerHTML=`<div class="grabber"></div>
      <div class="cmhead">
        <h2 style="font-size:20px;margin:0">${loading?"Comments":rows.length+" "+(rows.length===1?"comment":"comments")}</h2>
        ${LIVE?`<span class="livedot" title="Updating live"></span>`:""}
      </div>
      <div id="cm-list"></div>
      <div class="cbar" style="border:0;background:transparent;padding:12px 0 0">
        <input id="cm-in" placeholder="Add a comment" autocomplete="off" maxlength="800">
        <button class="send" id="cm-send" aria-label="Post comment">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></svg></button>
      </div>`;
    const host=sb.querySelector("#cm-list");

    if(loading){
      host.appendChild(el("div","empty",`<p style="font-size:13.5px">Loading…</p>`));
    }else if(!rows.length){
      host.appendChild(el("div","empty",`<p style="font-size:13.5px">No comments yet. Say something useful.</p>`));
    }else{
      /* oldest first reads like a conversation */
      rows.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(c=>{
        const mine=c.is_mine||c.author_id==="me";
        const who=mine?S.me:(A(c.author_id)||{name:c.author_name||"Someone"});
        const row=el("div","cmrow");
        row.innerHTML=`<div class="av">${mine?meAvatar(34):(who.id?avatarOf(who):art(hash(c.author_name||"x"),initials(c.author_name||"?"),{k:"a"}))}</div>
          <div class="t"><b>${esc(who.name||c.author_name||"Someone")} <i>${relTime(c.created_at)}</i></b>
            <span>${esc(c.body)}</span></div>
          ${(mine||post.who==="me")?`<button class="cmdel" data-del="${esc(c.id)}" aria-label="Delete comment">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`:""}`;
        host.appendChild(row);
      });
      host.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
        const id=b.dataset.del;
        rows=rows.filter(r=>String(r.id)!==String(id));paint();
        const r=await DB.deleteComment(id,postId);
        if(r.error){toast("Couldn't delete that");load()}
        else renderFeed();
      });
    }

    const send=async()=>{
      const inp=sb.querySelector("#cm-in"), v=inp.value.trim();
      if(!v)return;
      inp.value="";inp.disabled=true;
      /* show it straight away, reconcile after */
      const temp={id:"temp"+Date.now(),author_id:"me",is_mine:true,body:v,
                  created_at:new Date().toISOString(),author_name:S.me.name};
      rows.push(temp);paint();
      const r=await DB.addComment(postId,v);
      const inp2=sb.querySelector("#cm-in");if(inp2)inp2.disabled=false;
      if(r.error){
        rows=rows.filter(x=>x.id!==temp.id);paint();
        toast(String(r.error.message||"").includes("Slow down")
          ? "Slow down a moment — too many comments" : "Couldn't post that comment");
        return;
      }
      if(r.data&&r.data.id){temp.id=r.data.id}
      renderFeed();
    };
    sb.querySelector("#cm-send").onclick=send;
    sb.querySelector("#cm-in").addEventListener("keydown",e=>{if(e.key==="Enter")send()});
    const box=sb.querySelector("#cm-list");if(box)box.scrollTop=box.scrollHeight;
  };

  const load=async()=>{
    const r=await DB.comments(postId);
    if(commentPost!==postId)return;
    loading=false;
    if(r.error){rows=[];paint();toast("Couldn't load comments");return}
    rows=r.data||[];paint();
  };

  paint();load();
  $("#sheet").classList.add("on");

  /* live updates while the sheet is open */
  closeComments();commentPost=postId;
  commentWatch=DB.watchComments(postId,(c)=>{
    if(commentPost!==postId)return;
    if(rows.some(x=>String(x.id)===String(c.id)))return;
    rows.push(c);paint();renderFeed();
  });
}

function connect(id,silent){
  const p=A(id);if(!p)return;
  if(connected(id)){openChat(id);return}
  S.connections.unshift(id);
  /* Only the demo invents an opening message. A real new connection
     starts with an empty thread, the way it actually is. */
  if(!LIVE){
    S.threads[id]=S.threads[id]||[{f:"them",t:(p.replies&&p.replies[0])||"Hey!"}];
    S.unread[id]=1;
  }
  save();updateBadge();renderFeed();renderChats();
  if(!silent){
    $("#md-a").innerHTML=meAvatar();
    $("#md-b").innerHTML=avatarOf(p);
